<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
                <li><a href="{:url('update')}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index')}">
        关键字：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="请输入名称">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>
        <span class="text-muted" style="margin-left: 25px;">标签最多配置4个；第一个为固定打卡标签（不参与排序，需绑定活动分类），其他标签按排序数字从小到大排列</span>
    </form>


    <form method="post" class="js-ajax-form margin-top-20" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">排序</th>
            <th>ID</th>
            <th>名称</th>
            <th>绑定分类</th>
            <th>启用</th>


            <th width="200">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>
                    <if condition="$vo.is_fixed == 1">
                        <span class="text-muted">固定</span>
                        <else/>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </if>
                </td>
                <td>{$vo.id}</td>
                <td>{$vo.name}</td>
                <td>
                    {$vo.cate_name|default=''}
                </td>
                <td>
                    <div class="layui-form">
                        <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                    </div>
                </td>
                <td>
                    <a class="btn btn-xs btn-primary" href="{:url('update',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>

                    <a class="btn btn-xs btn-danger js-ajax-delete"
                       href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>

            </tr>
        </foreach>
        </tbody>
    </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        let layer = layui.layer,form = layui.form;
        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });

        function setStatus(id,type,status){
            $.ajax({
                url:"{:url('setStatus')}",
                type:"POST",
                data: {id:id,type:type,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

</script>
</body>
</html>
