<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>

</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">列表</a></li>
        <notempty name="item.id">
            <li class="active"><a href="">编辑</a></li>
            <else/>
            <li class="active"><a href="{:url('update')}">添加</a></li>
        </notempty>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('updatePost')}">

        <input type="hidden" value="{$item.id|default=''}" name="id">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>名称:</label>
            <div class="col-md-4 col-sm-10">
                <input  type="text" class="form-control" name="name" value="{$item.name|default=''}" required>
            </div>
        </div>

        <if condition="!empty($item['id']) && $item['is_fixed'] == 1">
            <div class="form-group">
                <label class="col-sm-2 control-label">说明:</label>
                <div class="col-md-6 col-sm-10">
                    <p class="text-muted" style="padding-top: 7px;">固定标签：小程序活动页第一个标签，内容固定，不参与排序，不绑定活动分类。</p>
                </div>
            </div>
        <else/>
            <div class="form-group">
                <label class="col-sm-2 control-label"><span class="form-required">*</span>绑定分类:</label>
                <div class="col-md-4 col-sm-10">
                    <select name="cate_id" lay-verify="required" required>
                        <option value="">请选择活动分类</option>
                        <foreach name="cate_list" item="cate">
                            <notempty name="item.id">
                                <option value="{$cate.id}" <eq name="item.cate_id" value="$cate.id">selected</eq>>{$cate.name}</option>
                                <else/>
                                <option value="{$cate.id}">{$cate.name}</option>
                            </notempty>
                        </foreach>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">说明:</label>
                <div class="col-md-6 col-sm-10">
                    <p class="text-muted" style="padding-top: 7px;">普通标签按排序数字从小到大排列，需绑定活动分类。</p>
                </div>
            </div>
        </if>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
            <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>

</body>
</html>
