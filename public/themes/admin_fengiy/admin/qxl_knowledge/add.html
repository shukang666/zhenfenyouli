<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('admin/QxlKnowledge/index')}">七贤岭学习</a></li>
        <if condition="$data.id">
            <li class="active"><a href="javascript:;">编辑内容</a></li>
        <else/>
            <li class="active"><a href="javascript:;">添加内容</a></li>
        </if>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('admin/QxlKnowledge/add', ['id'=>$data.id])}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>标题</label>
            <div class="col-md-8 col-sm-10">
                <input type="text" class="form-control" name="title" value="{$data.title|default=''}" required placeholder="请输入标题">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">分类</label>
            <div class="col-md-4 col-sm-10">
                <input type="text" class="form-control" name="category" value="{$data.category|default=''}" placeholder="如：七贤故事">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">封面图</label>
            <div class="col-md-6 col-sm-10">
                <div class="input-group">
                    <input type="text" class="form-control" id="qxl-knowledge-image" name="image" value="{$data.image|default=''}" placeholder="图片URL或上传">
                </div>
                <php>$imagePreviewUrl = cmf_get_image_preview_url($data['image'] ?? '');</php>
                <if condition="$imagePreviewUrl">
                    <img src="{$imagePreviewUrl}" id="qxl-knowledge-image-preview" style="height:80px;margin-top:10px;border-radius:4px;vertical-align:top;" onclick="parent.imagePreviewDialog(this.src);">
                <else/>
                    <img src="" id="qxl-knowledge-image-preview" style="height:80px;margin-top:10px;border-radius:4px;vertical-align:top;display:none;" onclick="parent.imagePreviewDialog(this.src);">
                </if>
                <a class="btn btn-default" href="javascript:doQxlKnowledgeUpload();" style="margin-top:10px;margin-left:4px;"><i class="fa fa-upload fa-fw"></i></a>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>内容</label>
            <div class="col-md-8 col-sm-10">
                <textarea class="form-control" id="qxl-knowledge-content" name="content" rows="12" required placeholder="输入正文内容（支持HTML）">{$data.content|default=''}</textarea>
                <p class="help-block">支持HTML标签排版</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-md-2 col-sm-10">
                <input type="number" class="form-control" name="list_order" value="{$data.list_order|default='0'}" placeholder="数字越小越靠前">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-md-4 col-sm-10">
                <label class="checkbox-inline" style="padding-top:0;">
                    <input type="checkbox" name="status" value="1" <if condition="$data.status neq 0">checked="checked"</if>> 启用
                </label>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a href="{:url('admin/QxlKnowledge/index')}" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
function doQxlKnowledgeUpload(){
    openUploadDialog('图片上传', function (dialog, files) {
        var filepath = files[0].filepath || '';
        $('#qxl-knowledge-image').val(filepath);
        var previewUrl = files[0].preview_url || files[0].filepath || '';
        if(previewUrl && !/^https?:\/\//.test(previewUrl)){
            previewUrl = GV.WEB_ROOT + previewUrl;
        }
        $('#qxl-knowledge-image-preview').attr('src', previewUrl).show();
    }, {}, 0, 'image', 'admin');
}
$(function(){
    $('#qxl-knowledge-image').on('blur', function(){
        var v = $(this).val().trim();
        if(v){
            if(!/^https?:\/\//.test(v)){
                v = GV.WEB_ROOT + v;
            }
            $('#qxl-knowledge-image-preview').attr('src', v).show();
        } else {
            $('#qxl-knowledge-image-preview').hide();
        }
    });
});
</script>
</body>
</html>
