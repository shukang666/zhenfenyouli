<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index',['pid'=>$pid])}">列表</a></li>
        <li><a href="{:url('add',['pid'=>$pid])}">添加</a></li>
    </ul>

    <form class="well form-inline margin-top-20 layui-form" method="get" action="{:url('index')}" style="display: flex">

        <input type="hidden" name="pid" value="{$pid}">
        <div>
            <span>关键字：</span>
            <div class="layui-inline">
                <input type="text" class="form-control" name="keyword"  value="{:input('request.keyword/s','')}" placeholder="关键字">
            </div>
        </div>

<!--        <div style="margin-left: 10px">-->
<!--            <span>题目类型：</span>-->
<!--            <div class="layui-inline">-->
<!--                <select name="type" lay-search >-->
<!--                    <option value = "0" class="form-control">全部</option>-->
<!--                    <foreach name="type_list" item="item" key="key">-->
<!--                        <option value = "{$key}" class="form-control" <if condition="$key == input('request.type')">selected</if>>{$item}</option>-->
<!--                    </foreach>-->
<!--                </select>-->
<!--            </div>-->
<!--        </div>-->

        <div style="margin-left: 10px">
            <input type="submit" class="btn btn-primary" value="搜索" />
            <a class="btn btn-danger" href="{:url('index',['pid'=>$pid])}">清空</a>
        </div>
    </form>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
<!--            <th>题号</th>-->
            <th>题目类型</th>
            <th>题目</th>
            <th>选项</th>
            <th>正确答案</th>
            <if condition="$problem_type neq 1">

            </if>

            <th>发布</th>
<!--            <th width="200">添加时间</th>-->
            <th width="200">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
<!--                <td>{$vo.sn}</td>-->
                <td>{$vo.type_name}</td>
                <td>{$vo.title}</td>
                <td>
                    <notempty name="vo.option_list">
                        <foreach name="vo.option_list" item="item">
                            <span style="display: flex">  {$item.letter} . {$item.option}   </span>    <br>
                        </foreach>
                    </notempty>
                </td>
                <td>{$vo.true_answer}</td>
                <if condition="$problem_type neq 1">

                </if>
                <td>
                    <div class="layui-form" style="margin-bottom: 10px">
                        <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                    </div>
                </td>
<!--                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>-->
                <td>
                    <if condition="$vo.type == 1 OR $vo.type == 2 OR $vo.type == 4">
                        <a class="btn btn-xs btn-success" href="javascript:parent.openIframeLayer('{:url('questionOption/index',array('q_id'=>$vo['id'],'problem_type'=>$problem_type))}','{$vo.title}的选项',{area:['60%','70%']});">选项</a>
                    </if>

                    <a class="btn btn-xs btn-primary" href="{:url('edit',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider','laydate'], function(){
        let layer = layui.layer,form = layui.form,laydate = layui.laydate;
        //日期范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });

        //发布不发布
        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });

        function setStatus(id,field,status){
            $.ajax({
                url:'/admin/question/setStatus',
                type:"POST",
                data: {id:id,field:field,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

    function check(id){
        layer.confirm('是否确认审核通过？', {
            btn: ['通过','拒绝'] //按钮
        }, function(){
            doCheck(id,1);
        }, function(){
            layer.prompt({title: '请说明拒绝原因', formType: 2}, function(text, index){
                doCheck(id,2,text);
            });
        });
    }

    function doCheck(id,check_status,check_reason){
        $.ajax({
            url:'/admin/question/check',
            type:"POST",
            data: {id:id,check_status:check_status,check_reason:check_reason},
            success: function(res) {
                if(res.code === 1){
                    layer.msg(res.msg, {icon:1});
                    setTimeout(function(){
                        location.reload();
                    },1000);
                }else{
                    layer.msg(res.msg, {icon: 7});
                }
            }
        });
    }

</script>
</body>
</html>
