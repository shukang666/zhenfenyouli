<script>
    layui.use(['layer', 'form'], function(){
        let layer = layui.layer,form = layui.form;
        const type = $("#type").val();
        setShow(type)
        form.on('select(type)', function(data) {
            setShow(data.value)
        })
        function setShow(type){
            $('.show_type').css('display','none');
            $('.show_type_'+type).css('display','block');
        }
    });
</script>
