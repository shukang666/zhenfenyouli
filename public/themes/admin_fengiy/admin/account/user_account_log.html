<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="">交易记录</a></li>
    </ul>
    <form class="well form-inline margin-top-20 layui-form" method="get" action="{:url('userAccountLog')}"
          style="display: flex">

        <div>
            <span>关键字：</span>
            <div class="layui-inline">
                <input type="text" class="form-control" name="keyword" value="{:input('request.keyword/s','')}"
                       placeholder="关键字">
            </div>
        </div>

        <div style="margin-left: 10px">
            <span>交易类型：</span>
            <div class="layui-inline">
                <select name="type" lay-search>
                    <option value="0" class="form-control">全部</option>
                    <foreach name="type_list" item="item" key="key">
                        <option value="{$key}" class="form-control"
                        <if condition="$key == input('request.type')">selected</if>
                        >{$item}</option>
                    </foreach>
                </select>
            </div>
        </div>

<!--        <input type="hidden" name="type" value="{$type}"/>-->
        <input type="hidden" name="account_type" value="{$account_type}"/>
        <div style="margin-left: 10px">
            <span>时间：</span>
            <div class="layui-inline" id="create-time">
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="text" autocomplete="off" id="create-startDate" class="layui-input" name="start_time"
                           value="{:input('request.start_time')}" placeholder="开始日期">
                </div>
                -
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="text" autocomplete="off" id="create-endDate" class="layui-input" name="end_time"
                           value="{:input('request.end_time')}" placeholder="结束日期">
                </div>
            </div>
        </div>

        <div style="margin-left: 10px">
            <input type="submit" class="btn btn-primary" value="搜索"/>
            <a class="btn btn-danger" href="{:url('userAccountLog',['account_type'=>$account_type])}">清空</a>
            <a class="btn btn-success" href="{:url('outData',input('get.'))}">导出</a>
        </div>
    </form>
    <form class="js-ajax-form" action="" method="post">
        <div>
            <button class="btn btn-danger btn-sm js-ajax-submit " type="submit"
                    data-action="{:url('delete_all',array('no'=>1))}" data-subcheck="true">批量删除
            </button>

        </div>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>     <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"
                                         data-checklist="js-check-x"></label></th>

            <th>ID</th>
            <th>用户信息</th>
            <th>账户类别</th>
            <th>交易类型</th>
            <th>变化值</th>
            <th>剩余值</th>
            <th>备注</th>
            <th>时间</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>          <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"
                           name="ids[]" value="{$vo.id}"></td>


                <td>{$vo.id}</td>
                <td>
                    <notempty name="vo.true_name">
                        ({$vo.user_id})  {$vo.nickname}
                        <else/>
                        被删除
                    </notempty>
                </td>
                <td>{$vo.account_type_name}</td>
                <td>
                    {$vo.type_name}
                    <if condition="$vo.type == 107">
                        <span style="color: red"><notempty name="vo.param.reason">({$vo.param.reason})</notempty></span>
                    </if>
                </td>
                <td>{$vo.change_amount}</td>
                <td>{$vo.left_amount}</td>
                <td>{$vo.remark}</td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
            </tr>
        </foreach>
        </tbody>
    </table>

    <div class="pagination" style="display:flex; align-items:center; flex-wrap:wrap; row-gap:6px;">
        {$page}
        <div class="pagination-jump" style="display:inline-flex; align-items:center; margin-left:10px;">
            <span>第</span>
            <input type="text" id="jump_page_input" class="form-control"
                   style="width:50px; height:34px; text-align:center; padding:6px; margin:0 4px;"
                   value="{:input('page/d',1)}">
            <span>页</span>
            <button type="button" class="btn btn-default" id="jump_page_btn"
                    style="height:34px; padding:6px 12px;">跳转</button>
        </div>
    </div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });
        var laydate = layui.laydate;
        // 日期时间范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate']
        });
    });
</script>
<script>
(function(){
    var input = document.getElementById('jump_page_input');
    var btn = document.getElementById('jump_page_btn');
    if (!input || !btn) return;
    function jump(){
        var p = parseInt(input.value, 10);
        if (isNaN(p) || p < 1) p = 1;
        // 解析当前 query string，剔除旧 page，保留所有其它筛选/排序参数
        var qs = location.search ? location.search.substring(1) : '';
        var params = qs.split('&').filter(function(x){ return x && x.indexOf('page=') !== 0; });
        params.push('page=' + p);
        location.href = location.pathname + '?' + params.join('&') + location.hash;
    }
    btn.addEventListener('click', jump);
    input.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); jump(); }
    });
})();
</script>
</body>
</html>
