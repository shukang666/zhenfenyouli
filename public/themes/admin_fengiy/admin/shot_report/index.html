<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:;">随手拍审核</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('admin/ShotReport/index')}">
        <div class="form-group">
            <label>状态：</label>
            <select name="status" class="form-control" style="width: 120px;">
                <option value="">全部</option>
                <option value="0" <if condition="$status eq '0'">selected="selected"</if>>待审核</option>
                <option value="1" <if condition="$status eq '1'">selected="selected"</if>>已通过</option>
                <option value="2" <if condition="$status eq '2'">selected="selected"</if>>已拒绝</option>
            </select>
        </div>
        <div class="form-group">
            <label>问题类型：</label>
            <select name="location_type" class="form-control" style="width: 120px;">
                <option value="">全部</option>
                <option value="1" <if condition="$location_type eq '1'">selected="selected"</if>>小区内</option>
                <option value="2" <if condition="$location_type eq '2'">selected="selected"</if>>非小区</option>
            </select>
        </div>
        <div class="form-group">
            <label>备注：</label>
            <input type="text" class="form-control" name="keyword" style="width: 160px;"
                   value="{$keyword}" placeholder="备注关键词">
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
        <a class="btn btn-danger" href="{:url('admin/ShotReport/index')}">清空</a>
    </form>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户昵称</th>
            <th>手机号</th>
            <th>问题图片</th>
            <th>问题类型</th>
            <th>位置信息</th>
            <th>备注</th>
            <th>状态</th>
            <th>提交时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr id="row_{$vo.id}">
                <td>{$vo.id}</td>
                <td>{$vo.nickname}</td>
                <td>{$vo.mobile}</td>
                <td>
                    <notempty name="$vo.image">
                        <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.image)}');">
                            <img src="{:cmf_get_image_preview_url($vo.image)}" style="width:60px;height:60px;border-radius:4px;">
                        </a>
                    </notempty>
                </td>
                <td><if condition="$vo.location_type == 2">非小区<else/>小区内</if></td>
                <td style="max-width:200px;word-break:break-all;">
                    <if condition="$vo.location_type == 2">
                        <span style="color:#666;">{$vo.merchant_name}</span><br>
                        <small style="color:#999;">{$vo.address}</small>
                    <else/>
                        <span style="color:#666;">{$vo.community_name}</span><br>
                        <small style="color:#999;">{$vo.point_name}</small>
                    </if>
                </td>
                <td style="max-width:200px;word-break:break-all;">{$vo.remark}</td>
                <td>
                    <if condition="$vo.status == 0">
                        <span class="label label-warning">待审核</span>
                    <elseif condition="$vo.status == 1"/>
                        <span class="label label-success">已通过</span>
                    <else/>
                        <span class="label label-danger">已拒绝</span>
                    </if>
                </td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <if condition="$vo.status == 0">
                        <a class="btn btn-xs btn-success btn-pass" href="javascript:;" data-id="{$vo.id}">通过</a>
                        <a class="btn btn-xs btn-danger btn-reject" href="javascript:;" data-id="{$vo.id}">拒绝</a>
                    </if>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    $(function () {
        $('.btn-pass').on('click', function () {
            var id = $(this).data('id');
            layer.confirm('确认审核通过？审核通过后将自动加入整改清单。', {btn: ['确认', '取消']}, function (index) {
                $.ajax({
                    url: "{:url('admin/ShotReport/pass')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id},
                    success: function (res) {
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1});
                            setTimeout(function () { location.reload(); }, 1000);
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
                layer.close(index);
            });
        });

        $('.btn-reject').on('click', function () {
            var id = $(this).data('id');
            layer.confirm('确认拒绝？', {btn: ['确认', '取消']}, function (index) {
                $.ajax({
                    url: "{:url('admin/ShotReport/reject')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id},
                    success: function (res) {
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1});
                            setTimeout(function () { location.reload(); }, 1000);
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
                layer.close(index);
            });
        });
    });
</script>
</body>
</html>
