<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
        <!--<li><a href="{:url('add')}">添加用户</a></li>-->
    </ul>
    <form class="layui-form well form-inline margin-top-20" method="get" action="{:url('index')}">

        关键字:
        <input type="text" class="form-control" name="order_num" style="width: 220px;"
               value="{:input('request.order_num/s','')}" placeholder="请输入订单号">

        &nbsp;&nbsp;
        抬头类型：
        <div class="layui-inline">
            <select name="type" lay-filter="vip_id">
                <option value="">全部</option>
                <foreach name="type_list" item="vo">
                    <notempty name="$params.type">
                        <option value="{$key}"
                        <if condition="$params.type == $key">selected</if>
                        >{$vo}</option>
                        <else/>
                        <option value="{$key}">{$vo}</option>
                    </notempty>

                </foreach>
            </select>
        </div>

        状态：
        <div class="layui-inline">
            <select name="status" lay-filter="vip_id">
                <option value="">全部</option>
                <foreach name="status_list" item="vo">
                    <notempty name="$params.status">
                        <option value="{$key}"
                        <if condition="$params.status == $key">selected</if>
                        >{$vo}</option>
                        <else/>
                        <option value="{$key}">{$vo}</option>
                    </notempty>

                </foreach>
            </select>
        </div>

        <input type="submit" class="btn btn-primary" value="搜索"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>
    </form>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>订单编号</th>
            <th>用户</th>
            <th>抬头类型</th>
            <th>发票类型</th>
            <th>抬头名称</th>
            <th>税号</th>
            <th>状态</th>
            <th>创建时间</th>
            <th width="300">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>

        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.order_num}</td>
                <td>{$vo.user_info}</td>
                <td>{$vo.type_name}</td>
                <td>{$vo.invoiceKind_name}</td>
                <td>{$vo.title}</td>
                <td>{$vo.tax_sn}</td>
                <!--                <td>{$vo.content}</td>-->
                <td>{$vo.status_name}</td>

                <td>{:date("Y-m-d H:i:s",$vo['create_time'])}</td>
                <td>


                    <!--<a class="btn btn-xs btn-warning" href="javascript:parent.openIframeLayer('{:url('addBalance',array('id'=>$vo['id']))}','',{area:['70%','70%']});">账户设置</a>-->
<!--                    <if condition="$vo.status==1">-->
<!--                        <a class="btn btn-xs btn-success js-ajax-dialog-btn"-->
<!--                           href="{:url('again_invoice',array('invoice_order_num'=>$vo['invoice_order_num']))}">开票重试</a>-->
<!--&lt;!&ndash;                        <a class="btn btn-xs btn-success js-ajax-dialog-btn"&ndash;&gt;-->
<!--&lt;!&ndash;                           href="{:url('invoicing',array('order_num'=>$vo['order_num']))}">确认开票</a>&ndash;&gt;-->


<!--                        <elseif condition="$vo.status == 2"/>-->
<!--                        <a class="btn btn-xs btn-success js-ajax-dialog-btn"-->
<!--                           href="{:url('get_red_invoice',array('invoice_order_num'=>$vo['invoice_order_num']))}">冲红</a>-->

<!--                    </if>-->
<!--                    <a class="btn btn-xs btn-primary"-->
<!--                       href="javascript:parent.openIframeLayer('{:url('detalis',array('invoice_order_num'=>$vo['invoice_order_num']))}','{$vo.order_num}开票详情',{area:['60%','60%']});">详情</a>-->


                    <a class="btn btn-xs btn-primary"
                       href="javascript:parent.openIframeLayer('{:url('update',array('id'=>$vo['id']))}','编辑',{area:['70%','70%']});">编辑</a>

                    <!--                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>-->
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <ul class="pagination">{$page|default=''}</ul>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form', 'slider', 'laydate'], function () {
        let layer = layui.layer, form = layui.form, laydate = layui.laydate;
        //日期范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });

        //禁用不禁用
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });

        function setStatus(id, field, status) {
            $.ajax({
                url: '/admin/member/setStatus',
                type: "POST",
                data: {id: id, field: field, status: status},
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

</script>
</body>
</html>
