<script>
    function togglePdfView(url) {
        var viewer = document.getElementById('pdfViewArea');
        if(viewer.style.display  === 'none') {
            document.getElementById('pdfViewer').src  = url;
            viewer.style.display  = 'block';
        } else {
            viewer.style.display  = 'none';
        }
        }
</script>
