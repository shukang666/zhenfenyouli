<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
        <li><a href="{:url('update')}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index')}">
        关键字：
        <input type="text" class="form-control" name="keyword" style="width: 140px;" value="{:input('request.keyword/s','')}" placeholder="请输入标题">


        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>
    </form>
    <form method="post" class="js-ajax-form margin-top-20" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="50">排序</th>
                <th>ID</th>
                <th>标题</th>
                <th>发布</th>
                <th>首页</th>
                <th width="200">添加时间</th>
                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.cate_name}</td>

                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="is_home" name="is_home"
                                   value="{$vo.id}"
                            <if condition="$vo.is_home == 1">checked</if>
                            >
                        </div>
                    </td>
                    <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                    <td>
<!--                        <a class="btn btn-xs btn-success" href="javascript:parent.openIframeLayer('{:url('cate_index',array('pid'=>$vo['id']))}','{$vo.cate_name}子分类',{area:['80%','80%']});">子分类</a>-->
                        <a class="btn btn-xs btn-primary" href="javascript:parent.openIframeLayer('{:url('update',array('id'=>$vo['id']))}','',{area:['80%','80%']});">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        let layer = layui.layer,form = layui.form;
        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });
        //发布不发布
        form.on('switch(is_home)', function(data){
            setStatus(data.value,'is_home',this.checked ? 1 : 0)
        });

        function setStatus(id,type,status){
            $.ajax({
                url:'{:url(\'setStatus\')}',
                type:"POST",
                data: {id:id,type:type,status:status,cate:0},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

</script>
</body>
</html>
