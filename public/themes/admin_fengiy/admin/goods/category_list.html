<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('categoryList',array('parent_id'=>$parent_id))}">分类列表</a></li>
        <li><a href="{:url('addCategory',array('parent_id'=>$parent_id))}">添加分类</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('categoryList')}">
        名称：
        <input type="text" class="form-control" name="keyword" style="width: 120px;" value="{:input('request.keyword/s','')}" placeholder="请输入名称">

        <input type="hidden" name="parent_id" value="{$parent_id}">

        <input type="submit" class="btn btn-primary" value="搜索" />
        <a class="btn btn-danger" href="{:url('categoryList',array('parent_id'=>$parent_id))}">清空</a>
    </form>

    <form class="js-ajax-form" action="" method="post">
        <button class="btn btn-primary btn-sm js-ajax-submit" type="submit" data-action="{:url('cateListOrder')}">排序</button>

        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="50">排序</th>
                <th width="50">ID</th>
                <th>名称</th>
                <th>上线</th>
<!--                <if condition="$parent_id == 0">-->
<!--                    <th>首页</th>-->
<!--                </if>-->
                <th width="320">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.cate_name}</td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
<!--                    <if condition="$parent_id == 0">-->
<!--                        <td>-->
<!--                            <div class="layui-form">-->
<!--                                <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="is_home" name="is_home" value="{$vo.id}" <if condition="$vo.is_home == 1">checked</if>>-->
<!--                            </div>-->
<!--                        </td>-->
<!--                    </if>-->
                    <td>
<!--                        <if condition="$parent_id == 0">-->
<!--                            <a class="layui-btn layui-btn-xs layui-bg-cyan" href="javascript:parent.openIframeLayer('{:url('categoryList',array('parent_id'=>$vo['id']))}','子分类',{area:['70%','70%']});">子分类</a>-->
<!--                        </if>-->
                        <a class="btn btn-xs btn-primary" href="{:url('editCategory',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('deleteCategory',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider'], function(){
        var layer = layui.layer,form = layui.form;


        //发布不发布
        form.on('switch(status)', function(data){
            setStatus(data.value,1,this.checked ? 1 : 2)
        });

        form.on('switch(is_home)', function(data){
            setStatus(data.value,2,this.checked ? 1 : 0)
        });

        function setStatus(id,type,status){
            $.ajax({
                url:'/admin/goods/setCategory',
                type:"POST",
                data: {id:id,type:type,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }

    });

</script>
</body>
</html>
