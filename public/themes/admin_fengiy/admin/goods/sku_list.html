<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('skuList',array('goods_id'=>$goods_id))}">规格列表</a></li>
        <li><a href="{:url('addSku',array('goods_id'=>$goods_id))}">添加规格</a></li>
    </ul>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>规格</th>
            <th>价格</th>
            <th>库存</th>
            <th width="200">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.sku_name}</td>
                <td>{$vo.price}</td>
                <td>{$vo.stock}</td>
                <td>
                    <a class="btn btn-xs btn-primary" href="{:url('editSku',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('deleteSku',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
