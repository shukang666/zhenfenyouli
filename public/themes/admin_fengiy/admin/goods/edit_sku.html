<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('skuList',array('goods_id'=>$goods_id))}">规格列表</a></li>
        <li class="active"><a href="">编辑规格</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('editSku')}">

        <input type="hidden" class="form-control" name="goods_id" value="{$goods_id}" required>
        <input type="hidden" class="form-control" name="id" value="{$data.id}" required>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>名称:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="sku_name" value="{$data.sku_name}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>价格:</label>
            <div class="col-md-6 col-sm-10">
                <input type="number" class="form-control" name="price" value="{$data.price}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>库存:</label>
            <div class="col-md-6 col-sm-10">
                <input type="number" class="form-control" name="stock" value="{$data.stock}" required>
            </div>
        </div>
<!--

        <div class="form-group">
            <label class="col-sm-2 control-label">图片:</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="thumb" id="thumbnail" value="{$data.thumb}">
                <a href="javascript:uploadOneImage('图片上传','#thumbnail');">
                    <if condition="empty($data.thumb)">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png"
                             id="thumbnail-preview"
                             width="135" style="cursor: pointer"/>
                        <else/>
                        <img src="{:cmf_get_image_preview_url($data.thumb)}"
                             id="thumbnail-preview"
                             width="135" style="cursor: pointer"/>
                    </if>
                </a>
            </div>
        </div>
-->

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
            <a class="btn btn-default" href="{:url('skuList',array('goods_id'=>$goods_id))}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
