<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
        <li><a href="{:url('update')}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index')}">
        关键字：
        <input type="text" class="form-control" name="true_name|mobile" style="width: 140px;"
               value="{:input('request.true_name/s','')}" placeholder="请输入名称">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>

    </form>


    <form method="post" class="js-ajax-form margin-top-20 layui-form" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <div>
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit"
                    data-action="{:url('toggle',array('yes'=>1))}" data-subcheck="true">审核通过
            </button>
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit"
                    data-action="{:url('toggle',array('no'=>1))}" data-subcheck="true">审核不通过
            </button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"
                                             data-checklist="js-check-x"></label></th>
                <th>排序</th>
                <th>ID</th>
                <th>姓名</th>
                <th>头像</th>
                <th>手机号</th>
                <th>启用</th>
                <th>创建时间</th>


                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"
                               name="ids[]" value="{$vo.id}"></td>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.true_name}</td>
                    <td>
                        <if condition="!empty($vo['avatar'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.avatar)}');">
                                <img src="{:cmf_get_image_preview_url($vo.avatar)}"
                                     style="width:40px;height:40px;border-radius: 40px;">
                            </a>
                        </if>
                    </td>
                    <td>{$vo.mobile}</td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status"
                                   value="{$vo.id}"<if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
                    <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>

                    <td>
                        <a class="btn btn-xs btn-primary"
                           href="{:url('update',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>

                        <a class="btn btn-xs btn-primary"
                           href="javascript:parent.openIframeLayer('{:url('holle',array('id'=>$vo['id']))}','',{area:['80%','80%']});">测试</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete"
                           href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                        <a class="btn btn-xs btn-warning"
                           href="javascript:parent.openIframeLayer('{:url('cate_data/index',array('data_id'=>$vo['id']))}','',{area:['70%','70%']});">内容</a>
                    </td>

                </tr>
            </foreach>
            </tbody>
        </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });
        //发布不发布
        form.on('switch(is_top)', function (data) {
            setStatus(data.value, 'is_top', this.checked ? 1 : 0)
        });

        function setStatus(id, type, status) {
            $.ajax({
                url: '{:url(\'setStatus\')}',
                type: "POST",
                data: {id: id, type: type, status: status, cate: 0},
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

</script>
</body>
</html>
