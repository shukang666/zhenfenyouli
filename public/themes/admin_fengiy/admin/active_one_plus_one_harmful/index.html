<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('admin/ActiveOnePlusOneHarmful/index')}">1+1有害垃圾打卡</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('admin/ActiveOnePlusOneHarmful/index')}">
        <div class="form-group">
            <label>活动：</label>
            <select name="active_id" class="form-control" style="width: 200px;">
                <option value="0">全部 1+1 活动</option>
                <foreach name="actives" item="a">
                    <option value="{$a.id}" <if condition="$active_id eq $a.id">selected="selected"</if>>{$a.name}（ID:{$a.id}）</option>
                </foreach>
            </select>
        </div>
        <div class="form-group">
            <label>用户/备注：</label>
            <input type="text" class="form-control" name="keyword" style="width: 160px;" value="{$keyword}" placeholder="昵称/手机/备注">
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
        <a class="btn btn-default" href="{:url('admin/ActiveOnePlusOneHarmful/index')}">清空</a>
    </form>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th>ID</th>
            <th>照片</th>
            <th>活动</th>
            <th>轮次</th>
            <th>用户</th>
            <th>手机</th>
            <th>用户说明</th>
            <th>打卡时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>
                    <notempty name="vo.image_url">
                        <a href="{$vo.image_url}" target="_blank">
                            <img src="{$vo.image_url}" style="width:64px;height:64px;object-fit:cover;border-radius:4px;">
                        </a>
                    </notempty>
                </td>
                <td>{$vo.active_name|default='-'}</td>
                <td>第 {$vo.cycle_no} 轮</td>
                <td>{$vo.nickname|default='-'}</td>
                <td>{$vo.mobile|default='-'}</td>
                <td style="max-width:200px;word-break:break-all;">{$vo.remark|default='-'}</td>
                <td>{:date('Y-m-d H:i', $vo.create_time)}</td>
                <td>
                    <a class="btn btn-xs btn-danger js-ajax-dialog-btn" data-msg="确认删除该打卡记录？删除后用户需重新上传才算完成第1天任务。" href="{:url('admin/ActiveOnePlusOneHarmful/delete', ['id'=>$vo.id])}">删除</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
