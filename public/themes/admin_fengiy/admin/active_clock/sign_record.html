<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('sign_record')}">签到记录</a></li>
    </ul>
    <form class="ajax-form well form-inline margin-top-20 layui-form" method="get" action="{:url('sign_record')}">

        用户信息：
        <input type="text" class="form-control" name="keyword" style="width: 140px;"
               value="{:input('request.keyword/s','')}" placeholder="请输入用户信息">
        活动名称：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="请输入名称">
        开始日期:
        <input type="text" class="form-control js-date" name="begintime" autocomplete="off" style="width: 220px;"
               value="{:input('request.begintime/s','')}" placeholder="请输入开始日期">
        结束日期:
        <input type="text" class="form-control js-date" name="endtime" autocomplete="off" style="width: 220px;"
               value="{:input('request.endtime/s','')}" placeholder="请输入结束日期">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('sign_record')}">清空</a>

        <input type="hidden" class="export" name="export" value="0">
        <a class="btn btn-success ajax-export" href="javascript:;">导出</a>
    </form>
    <form class="js-ajax-form margin-top-20" action="" method="post">
        <button class="btn btn-danger btn-sm js-ajax-submit" type="submit"
                data-action="{:url('delete_all')}" data-subcheck="true">批量删除
        </button>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"
                                             data-checklist="js-check-x"></label></th>
                <th width="50">ID</th>
                <th width="80">用户ID</th>
                <th>签到用户</th>
                <th>手机号</th>
                <th>签到活动</th>
                <th>图片</th>
                <th>签到日期</th>
                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"
                               name="ids[]" value="{$vo.id}"></td>
                    <td>{$vo.id}</td>
                    <td>{$vo.user_id}</td>
                    <td>
                        <if condition="!empty($vo['avatar'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.avatar)}');">
                                <img src="{:cmf_get_image_preview_url($vo.avatar)}"
                                     style="width:40px;height:40px;border-radius: 40px;">
                            </a>
                        </if>
                        {$vo.nickname}
                    </td>
                    <td>{$vo.phone}</td>
                    <td>
                        <if condition="!empty($vo['image'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.image)}');">
                                <img src="{:cmf_get_image_preview_url($vo.image)}"
                                     style="width:40px;height:40px;border-radius: 40px;">
                            </a>
                        </if>
                        {$vo.name}
                    </td>
                    <td>
                        <if condition="!empty($vo['image_url'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.image_url)}');">
                                <img src="{:cmf_get_image_preview_url($vo.image_url)}"
                                     style="width:40px;height:40px;border-radius: 40px;">
                            </a>
                        </if>
                    </td>

                    <td>{$vo.date_time |date="Y-m-d"}</td>
                    <td>

                        <a class="btn btn-xs btn-danger js-ajax-delete"
                           href="{:url('delete',['id'=>$vo['id'] ])}">{:lang('DELETE')}</a>
                    </td>

                </tr>
            </foreach>
            </tbody>
        </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>

    //导出数据
    $(".ajax-export").click(function () {
        // console.log($(".ajax-form"));
        $(".export").val(1);
        $(".ajax-form").submit();
        $(".export").val(0);
        // console.log($(".ajax-form").submit())
        return false;
    });
</script>
</body>
</html>
