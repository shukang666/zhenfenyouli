<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>

</head>
<body>
<div class="wrap js-check-wrap">

    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('refund_price')}">

        <input type="hidden" value="{$id|default=''}" name="id">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>退款金额:</label>
            <div class="col-md-1 col-sm-10">
                <input  type="number" class="form-control" name="refund_price" min="0.01" value="{$item.refund_price|default=''}" required>
            </div>
        </div>


        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>

</body>
</html>
