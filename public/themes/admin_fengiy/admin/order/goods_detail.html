<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(function () {
        var laydate = layui.laydate,
            layer = layui.layer,
            util = layui.util;

        // 日期时间范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate']
        });

        //操作订单
        util.on('lay-on', {
            //管理员添加备注信息
            'order-tips': function () {
                var orderid = $(this).attr("data-id"); //当前订单ID
                var value = $(this).attr("data-notes"); //当前订单备注信息
                layer.prompt({title: '请输入备注信息', value, formType: 2}, function (value, index, elem) {
                    if (value === '') return elem.focus();
                    $.ajax({
                        url: '/admin/order/addAdminRemark',
                        type: "POST",
                        data: {id: orderid, admin_remark: util.escape(value)},
                        success: function (res) {
                            if (res.code === 1) {
                                location.reload();
                            } else {
                                layer.msg(res.msg, {icon: 7});
                            }
                        }
                    });
                    //layer.msg('获得：'+ util.escape(value)); // 显示 value
                    layer.close(index); // 关闭 prompt

                });
            },
            //处理退款
            'order-refund': function () {
                var orderid = $(this).attr("data-id"); //当前订单ID
                layer.confirm('确认要通过审核？', {
                    btn: ['确定', '拒绝'] //按钮
                }, function () {
                    doRefund(orderid, 1)
                }, function () {
                    doRefund(orderid, 2)
                    // layer.prompt({title: '请输入拒绝原因', formType: 2}, function (value, index, elem) {
                    //     if (value === '') return elem.focus();
                    //     doRefund(orderid, 2, util.escape(value))
                    //     layer.close(index); // 关闭 prompt
                    // });
                });
            }, 'order-exchange': function () {
                var orderid = $(this).attr("data-id"); //当前订单ID
                layer.confirm('确认要通过审核？', {
                    btn: ['确定', '取消'] //按钮
                }, function () {
                    doRefund(orderid, 8)
                }, function () {
                    // doRefund(orderid, 2)
                    // layer.prompt({title: '请输入拒绝原因', formType: 2}, function (value, index, elem) {
                    //     if (value === '') return elem.focus();
                    //     doRefund(orderid, 2, util.escape(value))
                    //     layer.close(index); // 关闭 prompt
                    // });
                });
            },
        })


        function doRefund(id, status, text) {
            $.ajax({
                url: '/admin/order/refund_goods',
                type: "POST",
                data: {id: id, status: status, text: text},
                success: function (res) {
                    //console.log(res);
                    if (res.code == 1) {
                        layer.msg(res.msg, {icon: 1});
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }

    })

    //展示退款图片
    function showPhotos(images, index) {
        layer.photos({
            photos: {
                "title": "Photos Demo",
                "start": index,
                "data": images
            }
        });
    }
</script>
