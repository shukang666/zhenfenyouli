<include file="public@header" />
<link href="__TMPL__/public/assets/css/common.css" rel="stylesheet">
</head>
<body>
	<div class="wrap js-check-wrap">
		<table class="table table-hover table-bordered">
			<tbody>
				<tr>
					<th width="100">退款原因</th>
					<td>{$data.cancel_reason}</td>
				</tr>
				<tr>
					<th>详细描述</th>
					<td>{$data.cancel_desc}</td>
				</tr>

				<notempty name="data.cancel_image">
					<tr>
						<th>图片</th>
						<td id="reason-pic">
							<foreach name="data.cancel_image" item="item">
								<img class="img-rounded" src="{$item}" lay-on="reason-pic" data-index="0" alt="" width="60" height="60">
							</foreach>
						</td>
					</tr>
				</notempty>
			</tbody>
		</table>

		<notempty name="data.refuse_reason">
			<table class="table table-bordered">
				<tbody>
				<tr style="background-color: #f2dede;">
					<th width="100">管理员回复</th>
					<td>{$data.refuse_reason}</td>
				</tr>
				</tbody>
			</table>
		</notempty>
	</div>
	
	<script src="__STATIC__/js/admin.js"></script>
	<script>
		layui.use(function(){
			var layer = layui.layer;
			var util = layui.util;
			
			//操作
			util.on('lay-on', {
				//退款原因———图片
				'reason-pic': function(){
					var index = $(this).attr("data-index"); //当前图片键值
					var images = []
					$('#reason-pic img').each(function () {
						images.push({src: $(this).attr('src')});
					})
					parent.showPhotos(images, index)
			    },
			})
		})
	</script>
</body>
</html>
