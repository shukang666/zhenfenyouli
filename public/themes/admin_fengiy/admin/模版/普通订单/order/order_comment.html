<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('orderComment')}">列表</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('orderComment')}">
        关键字：
        <input type="text" class="form-control" name="keyword" value="{:input('request.keyword/s','')}" placeholder="请输入关键字">

        <input type="submit" class="btn btn-primary" value="搜索" />
        <a class="btn btn-danger" href="{:url('orderComment')}">清空</a>
    </form>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>用户</th>
            <th>师傅</th>
            <th>评分</th>
            <th>内容</th>
            <th>图片</th>
            <th>评论时间</th>
            <th width="150">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname}，{$vo.mobile}</td>
                <td>{$vo.goods_name}</td>
                <td>{$vo.point}</td>
                <td>{$vo.content}</td>
                <td>
                    <notempty name="vo.photos">
                        <foreach name="vo.photos" item="item">
                            <img width="25" height="25" src="{:cmf_get_asset_url($item)}" onclick="parent.imagePreviewDialog(this.src);"/>
                        </foreach>
                    </notempty>
                </td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('deleteComment',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
