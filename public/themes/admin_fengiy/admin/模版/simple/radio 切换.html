<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>
<script type="text/html" id="photos-item-tpl">
    <li id="saved-image{id}">
        <input id="photo-{id}" type="hidden" name="photo_urls[]" value="{filepath}">
        <input class="form-control" id="photo-{id}-name" type="text" name="photo_names[]" value="{name}"
               style="width: 200px;" title="图片名称">
        <img id="photo-{id}-preview" src="{url}" style="height:36px;width: 36px;"
             onclick="imagePreviewDialog(this.src);">
        <a href="javascript:uploadOneImage('图片上传','#photo-{id}');">替换</a>
        <a href="javascript:(function(){$('#saved-image{id}').remove();})();">移除</a>
    </li>
</script>
</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li class="active"><a href="">跳转页</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('adsense')}">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>类型:</label>
            <div class="col-sm-16">
                    <div class="layui-input-block">
                        <input lay-filter="testRadio" type="radio" name="type" value="1" title="图片"  <if condition="$data.type == 1">checked</if>>
                        <input lay-filter="testRadio" type="radio" name="type" value="2" title="视频"  <if condition="$data.type == 2" >checked</if>>
                    </div>
            </div>
        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script type="text/javascript">
    //编辑器路径定义
    var editorURL = GV.WEB_ROOT;
</script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('content');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
    var type = $('input:radio:checked').val();
    if(type == 1){
        $(".show_image").css("display", "block");
        $(".show_video").css("display", "none");
    } else {
        $(".show_image").css("display", "none");
        $(".show_video").css("display", "block");
    }


    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;

        //首页显示
        form.on('radio(testRadio)', function(data){
            console.log(111)
            if(data.value == 1){
                $(".show_image").css("display", "block");
                $(".show_video").css("display", "none");
            } else {
                $(".show_image").css("display", "none");
                $(".show_video").css("display", "block");
            }
        });
    });

    function change(that){
        console.log(that.attr('value'))
    }
</script>
</body>
</html>
