<script type="text/html" id="photos-item-tpl">
    <li  id="saved-image{id}" style="cursor:pointer;margin-bottom: 5px;margin-right: 10px;">
        <input id="photo-{id}" type="hidden" name="photos[]" value="{filepath}">
        <input class="form-control" id="photo-{id}-name" type="hidden" name="photo_names[]" value="{name}"
               style="width: 200px;" title="图片名称">
        <img id="photo-{id}-preview" src="{url}" style="height:80px;width: 80px;" >
        <div>
            <a href="javascript:uploadOneImage('图片上传','#photo-{id}');">替换</a>
            <a href="javascript:(function(){$('#saved-image{id}').remove();})();">移除</a>
        </div>
    </li>
</script>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>编号:</label>

        <div class="form-group">

            <div class="col-md-6 col-sm-10" style="z-index: 8888 !important;">

                <input type="hidden" name="team_uid" value="" id="select_team_uid">

            <div class="col-md-6 col-sm-10">

<script src="__STATIC__/js/admin.js"></script>
<script type="text/javascript">
    //编辑器路径定义
    var editorURL = GV.WEB_ROOT;
</script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {

        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('content');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });

    getSelectData('')

    var charge_uid = xmSelect.render({
        el: '#charge_uid',
        language: 'zn',
        data: [],
        on: function(data){
            //arr:  当前多选已选中的数据
            var arr = data.arr;
            var select_charge_uid = [];
            if(arr){
                arr.forEach(function(item,index){
                    select_charge_uid.push(item.value)
                });
            }
            if(select_charge_uid){
                $('#select_charge_uid').val( select_charge_uid.join(','))
            }
        },
    })

    var team_uid = xmSelect.render({
        el: '#team_uid',
        language: 'zn',
        data: [],
        on: function(data){
            //arr:  当前多选已选中的数据
            var arr = data.arr;
            var select_team_uid = [];
            if(arr){
                arr.forEach(function(item,index){
                    select_team_uid.push(item.value)
                });
            }
            if(select_team_uid){
                $('#select_team_uid').val( select_team_uid.join(','))
            }
        },
    })

    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;
        form.on('checkbox(depart_id)', function(data){
            console.log(22222)
            var chk_value =[];//定义一个数组
            $('input[name="depart_id[]"]:checked').each(function(){
                chk_value.push($(this).val());
            });
            var selectId = chk_value.join(",");
            getSelectData(selectId)
        });
    });

    function getSelectData(depart_id){
        var domain = "{$domain}"
        $.ajax({
            url:domain+'/api/wxapp/basic/getStaffByDepart',
            type:"POST",
            data: {depart_id:depart_id},
            success: function(res) {
                charge_uid.update({
                    data: res.data,
                    autoRow: true,
                })
                team_uid.update({
                    data: res.data,
                    autoRow: true,
                })
            }
        });
    }

</script>

<style>
    .layui-form-checkbox i{
        height: 30px;
    }
    .layui-form-checkbox{
        margin-bottom: 4px;
    }
</style>
</body>
