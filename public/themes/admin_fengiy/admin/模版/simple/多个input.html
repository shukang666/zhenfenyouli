<include file="public@header"/>
<script type="text/html" id="photos-item-tpl">
    <li id="saved-image{id}">
        <input id="photo-{id}" type="hidden" name="photos[]" value="{filepath}">
        <input class="form-control" id="photo-{id}-name" type="text" name="photo_names[]" value="{name}"
               style="width: 200px;" title="图片名称">
        <img id="photo-{id}-preview" src="{url}" style="height:36px;width: 36px;"
             onclick="imagePreviewDialog(this.src);">
        <a href="javascript:uploadOneImage('图片上传','#photo-{id}');">替换</a>
        <a href="javascript:(function(){$('#saved-image{id}').remove();})();">移除</a>
    </li>
</script>
</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('setPrice')}">收费配置</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('setPrice')}">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>收费配置：</label>
            <div class="col-md-6 col-sm-10">
                <div class="layui-form-item">

                    <div class="layui-inline">
                        <div class="layui-form-mid">其他时段免费</div>
                        <div class="layui-input-inline" style="width: 60px;">
                            <input type="number" name="free_num"  autocomplete="off" class="layui-input" required value="{$data.free_num}">
                        </div>
                        <div class="layui-form-mid">次，继续使用收费</div>
                        <div class="layui-input-inline" style="width: 60px;">
                            <input type="number" name="one_price" autocomplete="off" class="layui-input" required value="{$data.one_price}">
                        </div>
                        <div class="layui-form-mid">元后在此期间不限次数使用</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
