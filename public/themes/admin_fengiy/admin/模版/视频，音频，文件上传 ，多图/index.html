<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
        <li><a href="{:url('update')}">添加</a></li>

    <form class="well form-inline margin-top-20" method="get" action="{:url('index')}">
        关键字：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="请输入关键字">


        用户：
        <div class="form-group layui-form">
            <select name="user_id" lay-search id="user_list" lay-filter="user_list">
                <option value="">全部</option>
                <foreach name="user_list" item="vo">
                    <notempty name="user_id">
                        <option value="{$vo.id}"
                        <if condition="$user_id == $vo.id">selected</if>
                        >{$vo.cate_name}</option>
                        <else/>
                        <option value="{$vo.id}">{$vo.cate_name}</option>
                    </notempty>
                </foreach>
            </select>
        </div>


        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>

    </form>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <!--                    <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"-->
            <!--                                                 data-checklist="js-check-x"></label></th>-->
            <th>ID</th>
            <th>名称</th>
            <th>视频</th>
            <th>图片</th>
            <th>音频</th>
            <th>文件</th>
            <th>创建时间</th>


            <th width="200">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <!--                        <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"-->
                <!--                                   name="ids[]" value="{$vo.id}"></td>-->
                <td>{$vo.id}</td>
                <td>{$vo.name}</td>
                <td>
                    <php> $thumb='thumb';</php>
                    <if condition="!empty($vo[$thumb])">
                        <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo[$thumb])}');">
                            <img src="{:cmf_get_image_preview_url($vo[$thumb])}"
                                 style="width:40px;height:40px;">
                        </a>
                    </if>
                </td>

                    <if condition="!empty($item[$thumb])">
                        <img src="{:cmf_get_image_preview_url($item[$thumb])}"
                             id="{$thumb}-preview"
                             width="135" style="cursor: pointer"/>
                    </if>
                </td>

                <td>
                    <if condition="!empty($vo['video'])">
                        <a class="btn btn-info inline" id="file-video-preview"
                           href="{:cmf_get_file_download_url($vo.video)}"
                           target="_blank"><i class="fa fa-play-circle fa-fw"></i></a>
                    </if>
                </td>
                <td>
                    <if condition="!empty($vo['auido'])">
                        <a class="btn btn-info inline" id="file-auido-preview"
                           href="{:cmf_get_file_download_url($vo.auido)}"
                           target="_blank"><i class="fa fa-play-circle fa-fw"></i></a>
                    </if>

                </td>
                <td>
                    <if condition="!empty($vo['image'])">
                        <foreach name="vo['image']" item="item">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($item)}');">
                                <img src="{:cmf_get_image_preview_url($item)}"
                                     style="width:40px;height:40px;round-clip: 40px">
                            </a>
                        </foreach>
                    </if>
                </td>
                <td>
                    <a href="{:cmf_get_asset_url($vo.file)}" download><i class="fa fa-download fa-fw"></i></a>
                </td>
                <td>{$vo.create_time|date='Y-m-d'}</td>

                <td>
                    <a class="btn btn-xs btn-primary" href="{:url('update',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>

                    <!--                    <a class="btn btn-xs btn-primary"-->
                    <!--                       href="javascript:parent.openIframeLayer('{:url('order/index',array('id'=>$vo['id']))}','',{area:['80%','80%']});">质保</a>-->
                    <a class="btn btn-xs btn-danger js-ajax-delete"
                       href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    <!--                                        <a class="btn btn-xs btn-warning" href="javascript:parent.openIframeLayer('{:url('cate_data/index',array('data_id'=>$vo['id']))}','',{area:['70%','70%']});">内容</a>-->
                </td>

            </tr>
        </foreach>
        </tbody>
    </table>

    <div class="pagination">{$page}</div>
