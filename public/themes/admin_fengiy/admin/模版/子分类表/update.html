<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>

</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['data_id'=>$params.data_id])}">列表</a></li>
        <notempty name="item.id">
            <li class="active"><a href="{:url('update',['data_id'=>$params.data_id])}">编辑</a></li>
            <else/>
            <li class="active"><a href="{:url('update',['data_id'=>$params.data_id])}">添加</a></li>
        </notempty>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('updatePost')}">

        <input type="hidden" value="{$item.id|default=''}" name="id">
        <input type="hidden" value="{$params.data_id|default=''}" name="school_id">
        <input type="hidden" value="{$params.data_id|default=''}" name="data_id">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>名称:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="file-file-name" name="name" value="{$item.name|default=''}" required>
            </div>
        </div>



        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
            <a class="btn btn-default" href="{:url('index',['data_id'=>$params.data_id])}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>

</script>

</body>
</html>
