        <div class="form-group">

        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>银行名称:</label>
            <div class="col-md-6 col-sm-10">

            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>银行账号:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="bank_account" value="" required>

        </div>

        <div class="form-group">

<script>
    //定义地图中心点坐标

    var already_lat = $("#lat").val();
    var already_lon = $("#lon").val();

    if(already_lat == ''){
        already_lat = 39.916706;
        already_lon = 116.403119;
    }
    var center = new TMap.LatLng(already_lat, already_lon);
    //定义map变量，调用 TMap.Map() 构造函数创建地图
    var map = new TMap.Map(document.getElementById('container'), {
        center: center,//设置地图中心点坐标
        zoom: 17, //设置地图缩放级别
        viewMode:'3D'
    });
    let markerLayer = new TMap.MultiMarker({
        id: 'marker-layer',
        map: map
    });
    var clickHandler=function(evt){
        var lat = evt.latLng.getLat().toFixed(6);
        var lng = evt.latLng.getLng().toFixed(6);
        $("#lnglat").val(lng+","+lat);
        removeMarker("search_res");
        addMarker(new TMap.LatLng(lat,lng),"search_res");

        let url = "{:url('shop/reverse_address')}";
        $.get(url,{lnglat:lat+","+lng},function(res){
            //debugger;
            res = JSON.parse(res);
            if(res.status==0){
                $("#address").val(res.result.formatted_addresses.recommend);
            }
        });
    };
    map.on("click",clickHandler);

    function addMarker(latLng, id) {
        markerLayer.add({
            id: id,
            position: latLng
        });
        let lng = latLng.lng;
        let lat = latLng.lat;


        map.setCenter(new TMap.LatLng(lat,lng)); // 坐标为天安门
    }
    //移除marker事件
    function removeMarker(id) {
        markerLayer.remove(id)
    }

    function searchAddress(){
        var province = $(".province option:selected").text();
        var city = $(".city option:selected").text();
        var district = $(".district option:selected").text();

        if(province == '省份'){
            layer.msg('请选择地区');
            return;
        }
        if(city == '请选择' || district == '请选择'){
            layer.msg('请选择地区');
            return;
        }

        let address = $("#address").val();
        var full_address = province+city+district+address;
        let url = "{:url('shop/search_address')}";
        $.get(url,{address:full_address},function(res){
            // debugger;
            res = JSON.parse(res);
            if(res.status==0){
                let location = res.result.location;
                $("#lnglat").val(location.lng+","+location.lat);
                removeMarker("search_res");
                addMarker(new TMap.LatLng(location.lat,location.lng),"search_res");

            }else{
                layer.msg(res.message);
            }
        });
    }

</script>
<script>
    layui.use([ 'form', 'element' ], function() {
        var form = layui.form, element = layui.element;

        var province = ""
        var city = ""
        var county = ""
        getCateList(0,$("#province"),'province');
        form.on('select(province)', function(data) {
            province = data.value;
            getCateList(data.value,$("#city"),'city');
        })

        form.on('select(city)', function(data) {
            city = data.value;
            getCateList(data.value,$("#county"),'county');
        })

        function getCateList(pid,target,type){
            console.log(pid)
            $.ajax({
                type: 'POST',
                url: "{:url('shop/getJsonAreaList')}",
                data: {
                    pid: pid,
                },
                dataType: 'json',
                success: function (data) {
                    var cate_list = data.data;
                    console.log(cate_list)
                    var str = "<option value=''>" + "请选择" + "</option>";
                    for (var i = 0; i < cate_list.length; i++) {

                        if(type == 'province'){
                            var where = province;
                        }else if(type == 'city'){
                            var where = city;
                        }else{
                            var where = county;
                        }
                        if (where == cate_list[i].code) {
                            str += "<option value='" + cate_list[i].code + "' selected>" + cate_list[i].name + "</option>";
                        }else{
                            str += "<option value='" + cate_list[i].code + "'>" + cate_list[i].name + "</option>";
                        }
                    }
                    target.html(str);
                    form.render('select');
                }
            });
        }
    })
</script>

</body>
