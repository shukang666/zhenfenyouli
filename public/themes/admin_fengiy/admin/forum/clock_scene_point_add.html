<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('clock_scene_point_index')}">沿街回收点配置</a></li>
        <li><a href="{:url('office_recycle_building_index')}">办公大楼回收点</a></li>
        <li class="active"><a href="javascript:;"><if condition="empty($data)">新增<else/>编辑</if></a></li>
    </ul>
    <form class="form-horizontal margin-top-20 js-ajax-form" action="{:url('clock_scene_point_add_post')}" method="post">
        <if condition="!empty($data.id)">
            <input type="hidden" name="id" value="{$data.id}">
        </if>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>用户ID</label>
            <div class="col-sm-6">
                <input type="number" name="user_id" class="form-control" required value="{$data.user_id|default=''}" placeholder="cmf_member 用户 id">
                <p class="help-block">可在「会员管理」中查看用户 ID；一个用户可配置多个回收点（每种垃圾一个点位）。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>场景</label>
            <div class="col-sm-6">
                <select name="hub_key" class="form-control" required>
                    <option value="">请选择</option>
                    <foreach name="hubLabels" item="lab" key="hk">
                        <option value="{$hk}" <if condition="isset($data.hub_key) && $data.hub_key eq $hk">selected</if>>{$lab}</option>
                    </foreach>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">所属社区</label>
            <div class="col-sm-6">
                <select name="community_id" class="form-control">
                    <option value="0">— 办公场景必选 —</option>
                    <foreach name="communityList" item="com">
                        <option value="{$com.id}" <if condition="isset($data.community_id) && $data.community_id eq $com.id">selected</if>>{$com.name}</option>
                    </foreach>
                </select>
                <p class="help-block">沿街场景一般留空；办公大楼请到「办公大楼回收点」菜单配置。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>回收点名称</label>
            <div class="col-sm-6">
                <input type="text" name="point_name" class="form-control" required maxlength="32" value="{$data.point_name|default=''}" placeholder="沿街：店后集中回收点">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>垃圾种类</label>
            <div class="col-sm-6">
                <select name="cate_id" class="form-control" required>
                    <option value="">请选择</option>
                    <foreach name="cateList" item="c">
                        <option value="{$c.id}" <if condition="isset($data.cate_id) && $data.cate_id eq $c.id">selected</if>>{$c.name}</option>
                    </foreach>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">真分角位置 / 备注</label>
            <div class="col-sm-6">
                <input type="text" name="remark" class="form-control" maxlength="255" value="{$data.remark|default=''}" placeholder="办公：XX大厦 3楼东侧楼道口；沿街：商铺性质等">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">真分角环境图</label>
            <div class="col-sm-6">
                <input type="text" name="point_image" class="form-control" maxlength="255" value="{$data.point_image|default=''}" placeholder="上传后填相对路径或完整 COS 地址">
                <p class="help-block">小程序「真分角位置」参考图；可在「文件管理」上传后粘贴路径。</p>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-6">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn btn-default" href="{:url('clock_scene_point_index')}">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
