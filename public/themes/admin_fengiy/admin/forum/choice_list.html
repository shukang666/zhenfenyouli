<include file="public@header"/>
</head>
<body>
<style>
    .table {
        table-layout: fixed;
    }
    .text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:;">精选打卡列表</a></li>
        <li><a href="{:url('index',['type'=>2])}">返回全部打卡</a></li>
    </ul>
    <form class="well form-inline margin-top-20 layui-form" method="get"
          action="{:url('choiceList')}">
        内容：
        <input type="text" class="form-control" name="keyword" style="width: 140px;"
               value="{:input('request.keyword/s','')}" placeholder="打卡内容">

        用户：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="昵称/手机号/用户ID">

        <span>时间：</span>
        <div class="layui-inline" id="create-time">
            <div class="layui-input-inline" style="width: 140px;">
                <input type="text" autocomplete="off" id="create-startDate" class="layui-input" name="start_time"
                       value="{:input('request.start_time')}" placeholder="开始日期">
            </div>
            -
            <div class="layui-input-inline" style="width: 140px;">
                <input type="text" autocomplete="off" id="create-endDate" class="layui-input" name="end_time"
                       value="{:input('request.end_time')}" placeholder="结束日期">
            </div>
        </div>

        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('choiceList')}">清空</a>
        <input type="hidden" class="export" name="export" value="0">
        <a class="btn btn-success ajax-export" href="javascript:;">导出</a>
    </form>
    <form method="post" class="js-ajax-form margin-top-20" action="">
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>ID</th>
                <th>用户ID</th>
                <th>用户</th>
                <th>分类</th>
                <th width="300px">内容</th>
                <th>图片</th>
                <th>小区</th>
                <th>积分</th>
                <th>点赞数</th>
                <th>创建时间</th>
                <th>{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.uid}</td>
                    <td>{$vo.user_info}</td>
                    <td>{$vo.cate_name}</td>
                    <td class="text">
                        {$vo.content}
                    </td>
                    <td>
                        <if condition="!empty($vo['image'])">
                            <foreach name="vo['image']" item="item">
                                <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($item)}');">
                                    <img src="{:cmf_get_image_preview_url($item)}"
                                         style="width:40px;height:40px;round-clip: 40px">
                                </a>
                            </foreach>
                        </if>
                    </td>
                    <td>{$vo.community_name}</td>
                    <td>{$vo.point}</td>
                    <td>{$vo.like_total}</td>
                    <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                    <td>
                        <a class="btn btn-xs btn-success btn-set-choice"
                           href="javascript:;"
                           data-id="{$vo['id']}"
                           data-is-choice="1">取消精选</a>
                        <a class="btn btn-xs btn-danger btn-delete-with-reason"
                           href="javascript:;"
                           data-id="{$vo['id']}">删除</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;

        var laydate = layui.laydate;
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });
    });
</script>
<script>
    //导出数据
    $(".ajax-export").click(function () {
        $(".export").val(1);
        $(".well.form-inline").submit();
        $(".export").val(0);
        return false;
    });

    // ========== 精选/取消精选打卡 ==========
    $(document).on('click', '.btn-set-choice', function () {
        var id = $(this).data('id');
        var isChoice = $(this).data('is-choice');
        var url = "{:url('setChoice')}";
        var actionText = isChoice == 1 ? '取消精选' : '设为精选';

        layer.confirm('确定要' + actionText + '该打卡记录？', {
            btn: ['确认', '取消'],
            title: '确认操作'
        }, function (indexConfirm) {
            $.ajax({
                url: url,
                type: 'POST',
                dataType: 'json',
                data: {id: id, is_choice: isChoice},
                success: function (res) {
                    if (res.code == 1) {
                        layer.msg(res.msg, {icon: 1});
                        setTimeout(function () {
                            window.location.reload();
                        }, 1000);
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                },
                error: function () {
                    layer.msg('请求失败', {icon: 2});
                }
            });
            layer.close(indexConfirm);
        });
    });

    // ========== 单条删除：弹窗填写原因 ==========
    var deleteLayerIndex = null;
    function showDeleteReasonModal(callback) {
        var formHtml = '<div style="padding:20px;">'
            + '<div class="form-group">'
            + '<label>删除原因（必填）</label>'
            + '<textarea id="delete-reason-input" class="form-control" rows="3" placeholder="请填写删除原因，如：图片模糊、分类错误、内容违规等"></textarea>'
            + '</div>'
            + '<div style="color:#999;font-size:12px;margin-top:5px;">原因将永久记录，供后续查询追溯。</div>'
            + '</div>';
        deleteLayerIndex = layer.open({
            title: '删除打卡记录',
            type: 1,
            area: ['420px', '280px'],
            content: formHtml,
            btn: ['确认删除', '取消'],
            btn1: function (index) {
                var reason = $.trim($('#delete-reason-input').val());
                if (reason === '') {
                    layer.msg('请填写删除原因', {icon: 2});
                    return false;
                }
                layer.close(index);
                callback(reason);
            },
            cancel: function (index) {
                layer.close(index);
            }
        });
    }

    $(document).on('click', '.btn-delete-with-reason', function () {
        var id = $(this).data('id');
        var url = "{:url('delete')}";
        showDeleteReasonModal(function (reason) {
            layer.confirm('确定要删除该打卡记录？<br><br>原因：' + reason, {
                btn: ['确认', '取消'],
                title: '确认删除'
            }, function (indexPost) {
                $.ajax({
                    url: url,
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id, reason: reason},
                    success: function (res) {
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1});
                            setTimeout(function () {
                                window.location.reload();
                            }, 1000);
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    },
                    error: function () {
                        layer.msg('请求失败', {icon: 2});
                    }
                });
                layer.close(indexPost);
            });
        });
    });
</script>
</body>
</html>
