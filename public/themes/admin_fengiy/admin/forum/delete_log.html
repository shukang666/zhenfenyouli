<include file="public@header"/>
</head>
<body>
<style>
    .table {
        table-layout: fixed;
    }
    .text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .reason-cell {
        max-width: 200px;
        word-wrap: break-word;
        white-space: normal;
    }
</style>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('deleteLogIndex')}">删除记录</a></li>
    <li><a href="{:url('index', ['type' => 2])}">返回垃圾打卡</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('deleteLogIndex')}">
        用户：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="昵称/手机/用户ID">

        原因：
        <input type="text" class="form-control" name="keyword" style="width: 140px;"
               value="{:input('request.keyword/s','')}" placeholder="删除原因关键词">

        <span>时间：</span>
        <div class="layui-inline" id="create-time">
            <div class="layui-input-inline" style="width: 140px;">
                <input type="text" autocomplete="off" id="create-startDate" class="layui-input" name="start_time"
                       value="{:input('request.start_time')}" placeholder="开始日期">
            </div>
            -
            <div class="layui-input-inline" style="width: 140px;">
                <input type="text" autocomplete="off" id="create-endDate" class="layui-input" name="end_time"
                       value="{:input('request.end_time')}" placeholder="结束日期">
            </div>
        </div>

        <input type="hidden" class="export" name="export" value="0">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-success ajax-export" href="javascript:;">导出</a>
        <a class="btn btn-danger" href="{:url('deleteLogIndex')}">清空</a>
        <a class="btn btn-default" href="{:url('index', ['type' => 2])}">返回垃圾打卡列表</a>
    </form>

    <form method="post" class="js-ajax-form margin-top-20" action="">
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>ID</th>
                <th>打卡ID</th>
                <th>用户</th>
                <th width="250">删除原因</th>
                <th width="200">打卡内容</th>
                <th>扣除积分</th>
                <th>操作时间</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.forum_id}</td>
                    <td>{$vo.user_info}</td>
                    <td title="{$vo.reason}">{$vo.reason}</td>
                    <td class="text" title="{$vo.content}">{$vo.content}</td>
                    <td>{$vo.point}</td>
                    <td>{$vo.create_time}</td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer;

        var laydate = layui.laydate;
        // 日期时间范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });
    });

    // 导出数据
    $(".ajax-export").click(function () {
        $(".export").val(1);
        $(".well.form-inline").submit();
        $(".export").val(0);
        return false;
    });
</script>
</body>
</html>
