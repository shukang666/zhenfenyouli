<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['type'=>2])}">垃圾打卡列表</a></li>
        <li><a href="{:url('clock_tutorial_index')}">打卡教程</a></li>
        <li><a href="{:url('clock_scene_guide_index')}">场景分类引导</a></li>
        <li class="active"><a href="">编辑引导</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('clock_scene_guide_update_post')}">
        <input type="hidden" name="id" value="{$item.id}">
        <div class="form-group">
            <label class="col-sm-2 control-label">场景 / 子场景 / 种类</label>
            <div class="col-sm-8">
                <p class="form-control-static">{$item.hub_label} · {$item.sub_label} · {$item.cate_label}（不可修改）</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>如何处理</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="handle_guide" rows="4" required>{$item.handle_guide|default=''}</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">建议投放时间</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="dispose_time" value="{$item.dispose_time|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">问卷问题</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="survey_question" value="{$item.survey_question|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">推荐技巧</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="preset_tips_text" rows="5" placeholder="每行一条">{$item.preset_tips_text|default=''}</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">学习跳转路径</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="learn_path" value="{$item.learn_path|default='/pages/flhd/list'}">
                <p class="help-block">小程序页面路径，如 /pages/flhd/list 或 /pages/dtsh/knowledge</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-sm-8">
                <select class="form-control" name="status" style="width:120px;">
                    <option value="1" <if condition="$item.status eq 1">selected</if>>启用</option>
                    <option value="0" <if condition="$item.status eq 0">selected</if>>停用</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-8">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('clock_scene_guide_index')}">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
