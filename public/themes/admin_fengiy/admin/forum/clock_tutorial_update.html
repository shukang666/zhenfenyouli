<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['type'=>2])}">垃圾打卡列表</a></li>
        <li><a href="{:url('clock_tutorial_index')}">打卡教程</a></li>
        <li class="active"><a href="">编辑 · {$item.cate_key_label}</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('clock_tutorial_update_post')}">
        <input type="hidden" name="id" value="{$item.id}">
        <div class="form-group">
            <label class="col-sm-2 control-label">打卡场景</label>
            <div class="col-sm-8">
                <p class="form-control-static">{$item.cate_key_label}（scene: {$item.cate_key}，不可修改）</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>教程标题</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="title" value="{$item.title}" required>
                <p class="help-block">仅后台列表展示；正文标题可在富文本里自行排版。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>教程正文</label>
            <div class="col-sm-8">
                <script type="text/plain" id="content" name="content">{$item.content|default=''}</script>
                <p class="help-block">富文本一整块展示在小程序打卡页下方，可插入示例图片、分段与列表。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-sm-8">
                <select class="form-control" name="status" style="width:120px;">
                    <option value="1" <if condition="$item.status eq 1">selected</if>>启用</option>
                    <option value="0" <if condition="$item.status eq 0">selected</if>>停用</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-8">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('clock_tutorial_index')}">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script type="text/javascript">
    var editorURL = GV.WEB_ROOT;
</script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('content');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
</script>
</body>
</html>
