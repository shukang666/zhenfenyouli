<include file="public@header"/>
<style>
    .patrol-member-picker { position: relative; max-width: 520px; }
    .patrol-member-selected {
        margin-top: 10px;
        padding: 10px 12px;
        background: #f0f9f4;
        border: 1px solid #b7e4c7;
        border-radius: 4px;
        display: none;
    }
    .patrol-member-selected.is-show { display: block; }
    .patrol-member-list {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        z-index: 100;
        max-height: 280px;
        overflow-y: auto;
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 4px 12px rgba(0,0,0,.12);
        display: none;
    }
    .patrol-member-list.is-open { display: block; }
    .patrol-member-list li {
        padding: 10px 12px;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
    }
    .patrol-member-list li:last-child { border-bottom: none; }
    .patrol-member-list li:hover { background: #e8f5e9; }
    .patrol-member-list .muted { color: #888; font-size: 12px; }
    .patrol-member-empty {
        padding: 12px;
        color: #999;
        font-size: 13px;
        display: none;
    }
    .patrol-member-empty.is-show { display: block; }
</style>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['type'=>3])}">列表</a></li>
        <li class="active"><a href="{:url('patrolAdd')}">代传巡检</a></li>
    </ul>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('patrolAddPost')}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>归属会员</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="user_id" id="js-patrol-user-id" value="" required>
                <div class="patrol-member-picker">
                    <input type="text" class="form-control" id="js-patrol-mobile" autocomplete="off"
                           placeholder="输入手机号，至少 3 位数字" maxlength="20">
                    <ul class="patrol-member-list" id="js-patrol-member-list"></ul>
                </div>
                <p class="patrol-member-empty" id="js-patrol-member-empty">未找到匹配会员，请继续输入或核对手机号</p>
                <div class="patrol-member-selected" id="js-patrol-member-selected">
                    已选：<strong id="js-patrol-member-label"></strong>
                    <a href="javascript:;" class="text-danger" id="js-patrol-member-clear" style="margin-left:12px;">重新选择</a>
                </div>
                <p class="help-block">输入手机号后从下方列表点选；记录将记在该会员名下（与小程序提交一致）。</p>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>工作小区</label>
            <div class="col-md-6 col-sm-10">
                <select name="community_id" id="js-community-id" lay-search lay-filter="patrol-community" required>
                    <option value="">请选择小区</option>
                    <foreach name="community_list" item="vo">
                        <option value="{$vo.id}">{$vo.name}</option>
                    </foreach>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>巡检点位</label>
            <div class="col-md-6 col-sm-10">
                <select name="cate_id" id="js-cate-id" lay-search required>
                    <option value="">请先选择小区</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>现场是否整洁</label>
            <div class="col-md-6 col-sm-10">
                <label class="radio-inline"><input type="radio" name="site_hygiene" value="tidy" checked> 整洁</label>
                <label class="radio-inline"><input type="radio" name="site_hygiene" value="average"> 一般</label>
                <label class="radio-inline"><input type="radio" name="site_hygiene" value="poor"> 较差</label>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>有无整改意见</label>
            <div class="col-md-6 col-sm-10">
                <label class="radio-inline"><input type="radio" name="has_rectify" value="0" checked class="js-has-rectify"> 无</label>
                <label class="radio-inline"><input type="radio" name="has_rectify" value="1" class="js-has-rectify"> 有</label>
            </div>
        </div>

        <div class="form-group js-rectify-wrap" style="display:none;">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>整改意见</label>
            <div class="col-md-6 col-sm-10">
                <textarea class="form-control" name="rectify_remark" rows="3" maxlength="500" placeholder="描述需整改的问题"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>工作情况</label>
            <div class="col-md-6 col-sm-10">
                <textarea class="form-control" name="content" rows="5" required placeholder="本次巡检做了什么：查看了哪些桶、有无错投、是否做了引导等"></textarea>
            </div>
        </div>

        <foreach name="photo_fields" item="pf">
            <div class="form-group">
                <label class="col-sm-2 control-label">
                    <if condition="$pf.req eq 1"><span class="form-required">*</span></if>
                    {$pf.label}
                </label>
                <div class="col-md-6 col-sm-10">
                    <input type="hidden" name="{$pf.key}" id="{$pf.key}" value="">
                    <a href="javascript:uploadOneImage('上传照片','#{$pf.key}');">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png" id="{$pf.key}-preview" width="160" style="cursor:pointer;border-radius:6px;">
                    </a>
                </div>
            </div>
        </foreach>

        <div class="form-group">
            <label class="col-sm-2 control-label">提交选项</label>
            <div class="col-md-6 col-sm-10">
                <label class="checkbox-inline">
                    <input type="checkbox" name="skip_inspection_limit" value="1" checked> 跳过同点位巡检间隔（后台代传建议勾选）
                </label>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">提交巡检记录</button>
                <a class="btn btn-default" href="{:url('index',['type'=>3])}">返回列表</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
(function () {
    var pointsUrl = "{:url('patrolPointsJson')}";
    var memberSearchUrl = "{:url('patrolMemberSearchJson')}";
    var memberTimer = null;
    var selectedMember = null;
    var PATROL_LAST_STORAGE_KEY = 'admin_patrol_add_last';

    function savePatrolLastCache() {
        var uid = $('#js-patrol-user-id').val();
        if (!uid) {
            return;
        }
        var payload = {
            user_id: uid,
            community_id: $('#js-community-id').val() || '',
            mobile: $('#js-patrol-mobile').val() || '',
            label: $('#js-patrol-member-label').text() || ('ID ' + uid),
        };
        try {
            localStorage.setItem(PATROL_LAST_STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {}
    }

    function applyPatrolLast(data) {
        if (!data || !data.user_id) {
            return;
        }
        selectedMember = { id: data.user_id, label: data.label || '' };
        $('#js-patrol-user-id').val(data.user_id);
        $('#js-patrol-mobile').val(data.mobile || '').prop('readonly', true);
        $('#js-patrol-member-list').removeClass('is-open').empty();
        $('#js-patrol-member-empty').removeClass('is-show');
        $('#js-patrol-member-label').text(data.label || ('ID ' + data.user_id));
        $('#js-patrol-member-selected').addClass('is-show');
        if (data.community_id) {
            $('#js-community-id').val(String(data.community_id));
            if (window.layui && layui.form) {
                layui.form.render('select');
            }
            loadPoints(data.community_id);
        }
    }

    function restorePatrolLast() {
        var data = null;
        try {
            data = {$patrol_last_json|raw};
        } catch (e) {
            data = null;
        }
        if (!data || !data.user_id) {
            try {
                var raw = localStorage.getItem(PATROL_LAST_STORAGE_KEY);
                if (raw) {
                    data = JSON.parse(raw);
                }
            } catch (e2) {}
        }
        applyPatrolLast(data);
    }

    function escapeHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function renderMemberList(list) {
        var $list = $('#js-patrol-member-list');
        var $empty = $('#js-patrol-member-empty');
        if (!list || !list.length) {
            $list.removeClass('is-open').empty();
            $empty.addClass('is-show');
            return;
        }
        $empty.removeClass('is-show');
        var html = '';
        list.forEach(function (row) {
            var label = (row.nickname || '未命名') + ' · ' + (row.mobile || '') + ' · ID ' + row.id;
            if (row.community_name) {
                label += ' · ' + row.community_name;
            }
            html += '<li data-id="' + row.id + '" data-mobile="' + escapeHtml(row.mobile || '') + '" data-community-id="' + (row.community_id || '') + '" data-label="' + escapeHtml(label) + '">' +
                '<div>' + escapeHtml(row.nickname || '未命名') + ' <span class="muted">' + escapeHtml(row.mobile || '') + '</span></div>' +
                '<div class="muted">ID ' + row.id + (row.community_name ? ' · ' + escapeHtml(row.community_name) : '') + '</div>' +
                '</li>';
        });
        $list.html(html).addClass('is-open');
    }

    function searchMembers(keyword) {
        keyword = (keyword || '').replace(/\s/g, '');
        if (selectedMember) {
            return;
        }
        if (keyword.length < 3) {
            $('#js-patrol-member-list').removeClass('is-open').empty();
            $('#js-patrol-member-empty').removeClass('is-show');
            return;
        }
        $.getJSON(memberSearchUrl, { keyword: keyword }, function (res) {
            if (res.code === 1) {
                renderMemberList(res.data || []);
            } else {
                renderMemberList([]);
            }
        }).fail(function () {
            renderMemberList([]);
        });
    }

    function selectMember(id, label, mobile, communityId) {
        selectedMember = { id: id, label: label };
        $('#js-patrol-user-id').val(id);
        $('#js-patrol-mobile').val(mobile || '').prop('readonly', true);
        $('#js-patrol-member-list').removeClass('is-open').empty();
        $('#js-patrol-member-empty').removeClass('is-show');
        $('#js-patrol-member-label').text(label);
        $('#js-patrol-member-selected').addClass('is-show');
        if (communityId) {
            $('#js-community-id').val(String(communityId));
            if (window.layui && layui.form) {
                layui.form.render('select');
            }
            loadPoints(communityId);
        }
    }

    function clearMember() {
        selectedMember = null;
        $('#js-patrol-user-id').val('');
        $('#js-patrol-mobile').val('').prop('readonly', false).focus();
        $('#js-patrol-member-selected').removeClass('is-show');
        $('#js-patrol-member-list').removeClass('is-open').empty();
        $('#js-patrol-member-empty').removeClass('is-show');
    }

    function loadPoints(communityId) {
        var $cate = $('#js-cate-id');
        $cate.html('<option value="">加载中…</option>');
        if (!communityId) {
            $cate.html('<option value="">请先选择小区</option>');
            if (window.layui && layui.form) layui.form.render('select');
            return;
        }
        $.getJSON(pointsUrl, { community_id: communityId }, function (res) {
            var html = '<option value="">请选择点位</option>';
            if (res.code === 1 && res.data && res.data.length) {
                res.data.forEach(function (row) {
                    html += '<option value="' + row.id + '">' + row.name + '</option>';
                });
            } else {
                html = '<option value="">该小区暂无点位</option>';
            }
            $cate.html(html);
            if (window.layui && layui.form) layui.form.render('select');
        }).fail(function () {
            $cate.html('<option value="">加载失败，请重选小区</option>');
            if (window.layui && layui.form) layui.form.render('select');
        });
    }

    function toggleRectify() {
        var on = $('input[name=has_rectify]:checked').val() === '1';
        $('.js-rectify-wrap').toggle(on);
    }

    $(function () {
        toggleRectify();
        $('.js-has-rectify').on('change', toggleRectify);

        $('#js-patrol-mobile').on('input', function () {
            if (memberTimer) clearTimeout(memberTimer);
            var val = $(this).val();
            memberTimer = setTimeout(function () {
                searchMembers(val);
            }, 280);
        });

        $('#js-patrol-member-list').on('click', 'li', function () {
            var $li = $(this);
            selectMember(
                $li.attr('data-id'),
                $li.attr('data-label'),
                $li.attr('data-mobile'),
                $li.attr('data-community-id')
            );
        });

        $('#js-patrol-member-clear').on('click', function (e) {
            e.preventDefault();
            clearMember();
        });

        $(document).on('click', function (e) {
            if (!$(e.target).closest('.patrol-member-picker').length) {
                $('#js-patrol-member-list').removeClass('is-open');
            }
        });

        $('form.js-ajax-form').on('submit', function () {
            if (!$('#js-patrol-user-id').val()) {
                alert('请先通过手机号搜索并点选归属会员');
                return false;
            }
            savePatrolLastCache();
        });

        $('#js-community-id').on('change', function () {
            loadPoints($(this).val());
        });

        if (window.layui) {
            layui.use(['form'], function () {
                var form = layui.form;
                form.on('select(patrol-community)', function (data) {
                    loadPoints(data.value);
                });
                restorePatrolLast();
            });
        } else {
            restorePatrolLast();
        }
    });
})();
</script>
</body>
</html>
