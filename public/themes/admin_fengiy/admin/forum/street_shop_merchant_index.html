<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('street_shop_merchant_index')}">沿街登记商户</a></li>
    </ul>
    <form class="well form-inline margin-top-15" method="get" action="{:url('street_shop_merchant_index')}">
        <input type="text" name="keyword" class="form-control" placeholder="商铺名/用户" value="{$keyword}">
        <button type="submit" class="btn btn-primary">搜索</button>
    </form>
    <table class="table table-hover table-bordered margin-top-10">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户</th>
            <th>商铺名称</th>
            <th>类型</th>
            <th>打卡种类</th>
            <th>登记时间</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname|default=''}<br><small>{$vo.mobile|default=''} / UID {$vo.user_id}</small></td>
                <td>{$vo.shop_name}</td>
                <td>{$vo.shop_type_name}</td>
                <td>{$vo.cate_name}</td>
                <td>{:date('Y-m-d H:i',$vo.create_time)}</td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page|raw}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
