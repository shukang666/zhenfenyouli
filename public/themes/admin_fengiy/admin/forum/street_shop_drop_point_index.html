<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('clock_scene_guide_index')}">场景分类引导</a></li>
        <li><a href="{:url('clock_scene_point_index')}">场景回收点（办公）</a></li>
        <li class="active"><a href="{:url('street_shop_drop_point_index')}">沿街统一投放点</a></li>
        <li><a href="{:url('street_shop_merchant_index')}">沿街认领商户</a></li>
    </ul>
    <form class="well form-inline margin-top-15" method="get" action="{:url('street_shop_drop_point_index')}">
        <select name="shop_type" class="form-control">
            <option value="">全部类型</option>
            <foreach name="typeLabels" item="lab" key="tk">
                <option value="{$tk}" <if condition="$shop_type eq $tk">selected</if>>{$lab.name}</option>
            </foreach>
        </select>
        <input type="text" name="keyword" class="form-control" placeholder="名称/地址" value="{$keyword}">
        <button type="submit" class="btn btn-primary">搜索</button>
        <a class="btn btn-success" href="{:url('street_shop_drop_point_add')}">新增投放点</a>
    </form>
    <table class="table table-hover table-bordered margin-top-10">
        <thead>
        <tr>
            <th>ID</th>
            <th>商铺类型</th>
            <th>显示名称</th>
            <th>地址说明</th>
            <th>垃圾种类</th>
            <th>经纬度</th>
            <th>排序</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.shop_type_name}</td>
                <td>{$vo.name}</td>
                <td>{$vo.address}</td>
                <td>{$vo.cate_name}</td>
                <td>{$vo.lng}, {$vo.lat}</td>
                <td>{$vo.list_order}</td>
                <td><if condition="$vo.status eq 1"><span class="label label-success">启用</span><else/><span class="label label-default">停用</span></if></td>
                <td>
                    <a class="btn btn-xs btn-primary" href="{:url('street_shop_drop_point_add',['id'=>$vo.id])}">编辑</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('street_shop_drop_point_delete',['id'=>$vo.id])}">删除</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page|raw}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
