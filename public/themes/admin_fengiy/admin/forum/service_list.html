	<script>
		layui.use(['layer', 'form'], function () {
			let layer = layui.layer, form = layui.form;
			form.on('switch(status)', function (data) {
				setStatus(data.value, 'status', this.checked ? 2 : 1)
			});
			//发布不发布
			form.on('switch(is_top)', function (data) {
				setStatus(data.value, 'is_top', this.checked ? 1 : 0)
			});

			function setStatus(id, type, status) {
				$.ajax({
					url: '{:url(\'setStatus\')}',
					type: "POST",
					data: {id: id, type: type, status: status, cate: 0},
					success: function (res) {
						if (res.code === 1) {
							layer.msg(res.msg, {icon: 1});
						} else {
							layer.msg(res.msg, {icon: 7});
						}
					}
				});
			}
		});

	</script>
	<script>
		$('.text').mouseenter(function() {
			var text = $(this).text();
			let that = $(this);


			let wid;

			if (text.length > 1000) {
				wid = '900px';
			} else if (text.length > 600) {
				wid = '700px';
			} else if (text.length > 150) {
				wid = '500px';
			} else if (text.length > 100) {
				wid = '250px';
			} else if (text.length > 50) {
				wid = '150px';
			}
			layui.use('layer', function(layer) {
				tip_index = layer.tips('<span style="word-wrap: break-word;">' + text + '</span>', that, {
					tips: [4, "#000000"],
					time: 0,
					area: [wid, 'auto']
				});
			});
		})

		$('.text').mouseout(function() {
			layui.use('layer', function(layer) {
				layer.close(tip_index);
			});
		});


		function check(id) {
			layer.confirm('确认审核通过？', {
				btn: ['通过', '拒绝'] //按钮
			}, function() {
				doCheck(id, 1)
			}, function() {
				layer.prompt({
					title: '请说明拒绝原因',
					formType: 2
				}, function(text, index) {
					doCheck(id, 2, text);
				});
			});
		}

		function doCheck(id, status, text) {
			$.ajax({
				url: "{:url('fix_status')}",
				type: "POST",
				data: {
					id: id,
					status: status,
					text: text
				},
				success: function(res) {
					if (res.code == 1) {
						layer.msg(res.msg, {
							icon: 1
						});
						setTimeout(function() {
							location.reload();
						}, 1000);

					} else {
						layer.msg(res.msg, {
							icon: 7
						});
					}
				}
			});
		}
	</script>
