<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('street_shop_drop_point_index')}">沿街统一投放点</a></li>
        <li class="active"><a href="javascript:;"><if condition="empty($data)">新增<else/>编辑</if></a></li>
    </ul>
    <form class="form-horizontal margin-top-20 js-ajax-form" id="drop-form" action="{:url('street_shop_drop_point_add_post')}" method="post">
        <if condition="!empty($data.id)">
            <input type="hidden" name="id" value="{$data.id}">
        </if>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>商铺类型</label>
            <div class="col-sm-6">
                <select name="shop_type" class="form-control" required>
                    <option value="">请选择</option>
                    <foreach name="typeLabels" item="lab" key="tk">
                        <option value="{$tk}" <if condition="isset($data.shop_type) && $data.shop_type eq $tk">selected</if>>{$lab.name}（种类按类型自动匹配）</option>
                    </foreach>
                </select>
                <p class="help-block">同类型商铺可共用本投放点；餐馆与药房等类型不可共用。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>显示名称</label>
            <div class="col-sm-6">
                <input type="text" name="name" class="form-control" required maxlength="64" value="{$data.name|default=''}" placeholder="小程序里展示的名称，如：XX 路厨余集中点">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>地址说明</label>
            <div class="col-sm-6">
                <input type="text" name="address" class="form-control" required maxlength="255" value="{$data.address|default=''}" placeholder="详细地址或方位说明">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>经纬度</label>
            <input type="hidden" name="lng" id="lng" value="{$data.lng|default=''}">
            <input type="hidden" name="lat" id="lat" value="{$data.lat|default=''}">
            <div class="col-sm-6">
                <input type="text" class="form-control" id="lnglat" required placeholder="经度,纬度（例：121.523456,38.854321）"
                       value="<if condition='isset($data.lng) && $data.lng neq \"\"'>{$data.lng},{$data.lat}</if>">
                <p class="help-block">可直接粘贴腾讯/高德坐标拾取器的「经度,纬度」，用于小程序导航。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-sm-6">
                <input type="number" name="list_order" class="form-control" value="{$data.list_order|default='0'}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-sm-6">
                <label class="radio-inline"><input type="radio" name="status" value="1" <if condition="!isset($data.status) || $data.status eq 1">checked</if>> 启用</label>
                <label class="radio-inline"><input type="radio" name="status" value="0" <if condition="isset($data.status) && $data.status eq 0">checked</if>> 停用</label>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-6">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn btn-default" href="{:url('street_shop_drop_point_index')}">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
function parseLngLatInput() {
    var val = ($('#lnglat').val() || '').trim();
    if (!val || val === ',') return true;
    var parts = val.split(/[,，;；\s、]+/).filter(function (s) { return s.trim() !== ''; });
    if (parts.length < 2) { layer.msg('请输入「经度,纬度」'); return false; }
    var lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
    if (isNaN(lng) || isNaN(lat)) { layer.msg('经纬度必须为数字'); return false; }
    lng = lng.toFixed(6); lat = lat.toFixed(6);
    $('#lng').val(lng); $('#lat').val(lat); $('#lnglat').val(lng + ',' + lat);
    return true;
}
$('#lnglat').on('blur', parseLngLatInput);
$('#drop-form').on('submit', function () { return parseLngLatInput(); });
</script>
</body>
</html>
