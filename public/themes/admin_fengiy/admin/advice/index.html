<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">建议列表</a></li>
    </ul>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>用户信息</th>
            <th>建议内容</th>
            <th>图片</th>
            <th>提交时间</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname}(ID：{$vo.user_id})</td>
                <td>{$vo.content}</td>
                <td>
                    <if condition="!empty($vo['image'])">
                        <foreach name="vo['image']" item="item">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($item)}');">
                                <img src="{:cmf_get_image_preview_url($item)}"
                                     style="width:40px;height:40px;round-clip: 40px">
                            </a>
                        </foreach>
                    </if>
                </td>

                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
