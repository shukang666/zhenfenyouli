<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的 · OA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #eef3f0;
            color: #1c2b26;
            min-height: 100vh;
            padding-bottom: calc(72px + env(safe-area-inset-bottom));
        }
        .top {
            padding: calc(14px + env(safe-area-inset-top)) 18px 20px;
            background: #157a5a;
            color: #fff;
        }
        .top h1 { font-size: 18px; font-weight: 650; }
        .wrap { padding: 16px; }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 6px 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(20, 60, 48, .06);
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #f1f4f2;
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .row .k { color: #8a9893; }
        .row .v { font-weight: 550; text-align: right; word-break: break-all; }
        .card-form { padding: 16px; }
        .card-form h2 { font-size: 15px; margin-bottom: 12px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; color: #6b7c76; margin-bottom: 6px; }
        .field input {
            width: 100%;
            height: 46px;
            border: 1px solid #e4ece8;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 16px;
            background: #f7faf8;
            outline: none;
        }
        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #157a5a;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
        }
        .btn:disabled { opacity: .55; }
        .out {
            display: block;
            text-align: center;
            margin: 8px 0 0;
            color: #c0392b;
            text-decoration: none;
            font-size: 14px;
            padding: 14px;
            background: #fff;
            border-radius: 16px;
        }
        .toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,.75); color: #fff; padding: 12px 20px;
            border-radius: 10px; font-size: 14px; display: none; z-index: 9;
        }
        .tabbar {
            position: fixed; left: 0; right: 0; bottom: 0;
            height: calc(56px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: #fff; border-top: 1px solid #e6eeea; display: flex;
        }
        .tabbar a {
            flex: 1; text-align: center; text-decoration: none; color: #8a9893;
            font-size: 11px; padding-top: 8px;
        }
        .tabbar a.on { color: #14835a; font-weight: 650; }
        .tabbar .ic { display: block; font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>
<div class="top"><h1>我的</h1></div>
<div class="wrap">
    <div class="card">
        <div class="row"><span class="k">登录账号</span><span class="v">{$user.user_login|default='—'}</span></div>
        <div class="row"><span class="k">昵称</span><span class="v"><notempty name="user.user_nickname">{$user.user_nickname}<else/>—</notempty></span></div>
        <div class="row"><span class="k">手机号</span><span class="v"><notempty name="user.mobile">{$user.mobile}<else/>—</notempty></span></div>
        <div class="row"><span class="k">邮箱</span><span class="v"><notempty name="user.user_email">{$user.user_email}<else/>—</notempty></span></div>
        <div class="row"><span class="k">上次登录</span><span class="v">{$lastLoginText}</span></div>
    </div>
    <div class="card card-form">
        <h2>修改密码</h2>
        <div class="field"><label>原密码</label><input type="password" id="old_password" autocomplete="current-password"></div>
        <div class="field"><label>新密码</label><input type="password" id="password" autocomplete="new-password" placeholder="至少 6 位"></div>
        <div class="field"><label>确认新密码</label><input type="password" id="re_password" autocomplete="new-password"></div>
        <button class="btn" id="btnPwd" type="button">保存新密码</button>
    </div>
    <a class="out" href="{:url('admin/Oa/logout')}">退出 OA</a>
</div>
<nav class="tabbar">
    <a href="{:url('admin/Oa/index')}"><span class="ic">⌂</span>工作台</a>
    <a class="on" href="{:url('admin/Oa/profile')}"><span class="ic">☺</span>我的</a>
</nav>
<div class="toast" id="toast"></div>
<script>
    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(function () { el.style.display = 'none'; }, 2000);
    }
    document.getElementById('btnPwd').addEventListener('click', function () {
        var oldPassword = document.getElementById('old_password').value.trim();
        var password = document.getElementById('password').value;
        var rePassword = document.getElementById('re_password').value;
        if (!oldPassword) { toast('请输入原密码'); return; }
        if (!password) { toast('请输入新密码'); return; }
        if (password.length < 6) { toast('新密码至少 6 位'); return; }
        if (password !== rePassword) { toast('两次输入的新密码不一致'); return; }
        var btn = document.getElementById('btnPwd');
        btn.disabled = true;
        btn.textContent = '保存中...';
        var data = new FormData();
        data.append('old_password', oldPassword);
        data.append('password', password);
        data.append('re_password', rePassword);
        fetch("{:url('admin/Oa/changePassword')}", {
            method: 'POST',
            body: data,
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        }).then(function (res) { return res.json(); }).then(function (res) {
            toast(res.msg || (res.code == 1 ? '密码已修改' : '修改失败'));
            if (res.code == 1) {
                document.getElementById('old_password').value = '';
                document.getElementById('password').value = '';
                document.getElementById('re_password').value = '';
            }
            btn.disabled = false;
            btn.textContent = '保存新密码';
        }).catch(function () {
            toast('网络错误，请重试');
            btn.disabled = false;
            btn.textContent = '保存新密码';
        });
    });
</script>
</body>
</html>
