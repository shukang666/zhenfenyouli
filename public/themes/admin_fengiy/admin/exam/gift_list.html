<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('exam/gift_list')}">中奖记录</a></li>
        <!-- <li><a href="{:url('exam/add')}">添加问卷</a></li> -->
    </ul>
    <form class="well form-inline margin-top-20 ajax-form" method="get" action="{:url('exam/gift_list')}">
        问卷:
        <select name="exam_id" id="exam_id" class="form-control">
            <option value="">全部</option>
            <foreach name="exam_list" item="vo">
                <option value="{$vo.id}"
                <if condition="$params['exam_id'] eq $vo['id']">selected</if>
                >{$vo.name}</option>
            </foreach>
        </select>

        开始日期:
        <input type="text" class="form-control js-date" name="begintime" autocomplete="off" style="width: 220px;"
               value="{:input('request.begintime/s','')}" placeholder="请输入开始日期">
        结束日期:
        <input type="text" class="form-control js-date" name="endtime" autocomplete="off" style="width: 220px;"
               value="{:input('request.endtime/s','')}" placeholder="请输入结束日期">

        关键字:
        <input type="text" class="form-control" name="keyword" style="width: 220px;"
               value="{:input('request.keyword/s','')}" placeholder="请输入姓名">
        <input type="hidden" name="is_export" id="is_export" value="0">
        问卷记录ID:
        <input type="text" class="form-control" id="record_id" name="id" style="width: 40px;"
               value="{:input('request.id/s','')}" placeholder="id">

        <input type="submit" class="btn btn-primary" value="搜索"/>
        <a class="btn btn-danger" href="{:url('exam/gift_list')}">清空</a>
        <a class="btn btn-success ajax-export" href="javascript:;">导出问卷</a>
        <a class="btn layui-btn layui-btn-warm " href="{:url('export_reservation')}">导出预约记录</a>

    </form>
    <form class="js-ajax-form" action="" method="post">
        <div>
            <button class="btn btn-danger btn-sm js-ajax-submit " type="submit"
                    data-action="{:url('delete_all',array('no'=>1))}" data-subcheck="true">批量删除
            </button>

        </div>


    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"
                                         data-checklist="js-check-x"></label></th>

            <th width="50">ID</th>
            <th width="80">用户ID</th>
            <th>姓名</th>
            <th>手机号</th>
            <th>类型</th>
            <!--					<th>中奖名称</th>-->
            <!--					<th>兑换码</th>-->
            <!--					<th>状态</th>-->
            <th>日期</th>
            <th width="260">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <php>

        </php>
        <foreach name="list" item="vo">
            <tr>
                <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"
                           name="ids[]" value="{$vo.id}"></td>

                <td>{$vo.id}</td>
                <td>{$vo.uid}</td>
                <td>{$vo.name}</td>
                <td>{$vo.mobile}</td>
                <td>{$vo.cate_name}</td>
                <!--					<td>{$vo.gift_name}</td>-->
                <!--					<td>{$vo.gift_code}</td>-->
                <!--					<td>-->
                <!--						<if condition="$vo['status'] eq 1">-->
                <!--							已兑换-->
                <!--						<else />-->
                <!--							未兑换-->
                <!--						</if>-->
                <!--					</td>-->
                <td>{$vo.createtime|date="Y-m-d H:i:s"}</td>
                <td>
                    <!--                        <a class="btn btn-xs btn-danger js-ajax-info"  data-msg="确认兑换？" href="{:url('exam/update_status',array('id'=>$vo['id']))}">确认兑换</a>-->
                    <a class="btn btn-xs btn-success"
                       href="javascript:parent.openIframeLayer('{:url('exam/record_list',array('id'=>$vo['id']))}','问卷详情',{});">问卷详情</a>
                    <a class="btn  btn-xs btn-warning"
                       href="javascript:parent.openIframeLayer('{:url('exam/reservation',array('id'=>$vo['id']))}','预约详情',{});">预约详情</a>

                    <a class="btn btn-xs btn-danger js-ajax-delete"
                       href="{:url('exam/delete_gift',array('id'=>$vo['id']))}">删除</a>

                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <ul class="pagination">{$page|default=''}</ul>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    //导出数据
    $(".ajax-export").click(function () {
        if ($("#exam_id").val() == '' && $('#record_id').val() == '') {
            layer.msg('请选择问卷', {icon: 2});
            return false;
        }

        $("#is_export").val(1);
        $(".ajax-form").submit();
        $("#is_export").val(0);
        return false;
    });
</script>
</body>
</html>
