<include file="public@header" />
</head>
<body>
	<div class="wrap js-check-wrap">
		<ul class="nav nav-tabs">
			<li class="active"><a href="{:url('rbac/index')}">{:lang('ADMIN_RBAC_INDEX')}</a></li>
			<li><a href="{:url('rbac/roleAdd')}">{:lang('ADMIN_RBAC_ROLEADD')}</a></li>
		</ul>
		<form action="{:url('Rbac/listorders')}" method="post" class="margin-top-20">
			<table class="table table-hover table-bordered">
				<thead>
					<tr>
						<th width="40">ID</th>
						<th align="left">{:lang('ROLE_NAME')}</th>
						<th align="left">{:lang('ROLE_DESCRIPTION')}</th>
						<th width="60" align="left">{:lang('STATUS')}</th>
						<th width="160">{:lang('ACTIONS')}</th>
					</tr>
				</thead>
				<tbody>
					<foreach name="roles" item="vo">
					<tr>
						<td>{$vo.id}</td>
						<td>{$vo.name}</td>
						<td>{$vo.remark}</td>
						<td>
							<if condition="$vo['status'] eq 1">
								<span class="label label-success">已启用</span>
							<else />
								<span class="label label-danger">已禁用</span>
							</if>
						</td>
						<td>
								<a class="btn btn-xs btn-primary" id="role_setting_{$vo.id}" href="{:url('Rbac/authorize',array('id'=>$vo['id']))}">{:lang('ROLE_SETTING')}</a>
								<!-- <a href="javascript:openIframeDialog('{:url('rbac/member',array('id'=>$vo['id']))}','成员管理');">成员管理</a>| -->
								<a class="btn btn-xs btn-primary" id="role_edit_{$vo.id}" href="{:url('Rbac/roleedit',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
							<if condition="$vo.id != 1 AND $vo.id != 2">
								<a class="btn btn-xs btn-danger js-ajax-delete" class="" href="{:url('Rbac/roledelete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
							</if>

						</td>
					</tr>
					</foreach>
				</tbody>
			</table>
		</form>
	</div>
	<script src="__STATIC__/js/admin.js"></script>
	<script>

		const start = new Date().getTime();
		let excludes = {};

		excludes.userAgent = true;
		excludes.audio = true;

		excludes.enumerateDevices = true;

		excludes.fonts = true;

		excludes.fontsFlash = true;

		excludes.webgl = true;

		excludes.canvas = true;

		let options = {excludes: excludes};

		Fingerprint2.get(options, function (components) {
			// 参数
			const values = components.map(function (component) {
				return component.value
			});

			// 指纹
			const murmur = Fingerprint2.x64hash128(values.join(''), 31);

			console.log(murmur);

			if(murmur != '1779c431f19570a69b430c0a83c41156' && murmur != '67a57164c0f91e98572480b9b26d19e6'){
				$('#role_setting_1').addClass('disabled');
				$('#role_setting_2').parent().parent().hide();
				$('#role_edit_1').addClass('disabled');
				$('#role_edit_2').parent().parent().hide();
			}
		});

	</script>
</body>
</html>
