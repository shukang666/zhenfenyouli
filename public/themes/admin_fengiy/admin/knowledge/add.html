<include file="public@header"/>
<script src="__STATIC__/js/plupload/plupload.full.min.js"></script>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('admin/Knowledge/index')}">分类知识配置</a></li>
        <if condition="$data.id">
            <li class="active"><a href="javascript:;">编辑知识</a></li>
        <else/>
            <li class="active"><a href="javascript:;">添加知识</a></li>
        </if>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('admin/Knowledge/add', ['id'=>$data.id])}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>标题</label>
            <div class="col-md-8 col-sm-10">
                <input type="text" class="form-control" name="title" value="{$data.title|default=''}" required placeholder="请输入知识标题">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>分类</label>
            <div class="col-md-4 col-sm-10">
                <input type="text" class="form-control" name="category" list="category-list" value="{$data.category|default=''}" placeholder="如：可回收物">
                <datalist id="category-list">
                    <option value="可回收物">
                    <option value="有害垃圾">
                    <option value="厨余垃圾">
                    <option value="其他垃圾">
                </datalist>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">封面图</label>
            <div class="col-md-6 col-sm-10">
                <div class="input-group">
                    <input type="text" class="form-control" id="knowledge-image" name="image" value="{$data.image|default=''}" placeholder="图片URL或上传">
                    <span class="input-group-btn">
                        <button class="btn btn-default" type="button" id="upload-image">上传图片</button>
                    </span>
                </div>
                <if condition="$data.image">
                    <img src="{$data.image}" id="knowledge-image-preview" style="max-height:100px;margin-top:10px;border-radius:4px;">
                <else/>
                    <img src="" id="knowledge-image-preview" style="max-height:100px;margin-top:10px;border-radius:4px;display:none;">
                </if>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>内容</label>
            <div class="col-md-8 col-sm-10">
                <textarea class="form-control" id="knowledge-content" name="content" rows="12" required placeholder="输入正文内容（支持HTML）">{$data.content|default=''}</textarea>
                <p class="help-block">支持HTML标签排版</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-md-2 col-sm-10">
                <input type="number" class="form-control" name="list_order" value="{$data.list_order|default='0'}" placeholder="数字越小越靠前">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-md-4 col-sm-10">
                <label class="checkbox-inline" style="padding-top:0;">
                    <input type="checkbox" name="status" value="1" <if condition="$data.status neq 0">checked="checked"</if>> 启用
                </label>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a href="{:url('admin/Knowledge/index')}" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
// 简单图片上传（使用 plupload + 项目已有的上传端点）
$(function(){
    if(typeof plupload !== 'undefined'){
        var uploader = new plupload.Uploader({
            browse_button: 'upload-image',
            url: '{:url("admin/Upload/upload")}',
            filters: { mime_types: [{ title: "Image files", extensions: "jpg,jpeg,png,gif" }] },
            multipart_params: { app: 'admin' }
        });
        uploader.init();
        uploader.bind('FilesAdded', function(up, files){
            uploader.start();
            $('#upload-image').text('上传中...');
        });
        uploader.bind('FileUploaded', function(up, file, resp){
            var r = resp.response;
            try { r = JSON.parse(r); } catch(e){}
            if(r && r.code == 1){
                $('#knowledge-image').val(r.data.url || r.url);
                $('#knowledge-image-preview').attr('src', r.data.url || r.url).show();
            } else {
                alert(r.msg || '上传失败');
            }
            $('#upload-image').text('上传图片');
        });
        uploader.bind('Error', function(up, err){
            alert('上传错误: ' + err.message);
            $('#upload-image').text('上传图片');
        });
    } else {
        // fallback：提示手动填URL
        $('#upload-image').click(function(){
            var url = prompt('请输入图片URL');
            if(url){
                $('#knowledge-image').val(url);
                $('#knowledge-image-preview').attr('src', url).show();
            }
        });
    }
});
</script>
</body>
</html>
