<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('admin/HealthSurvey/record',['survey_id'=>$survey.id])}">提交数据</a></li>
        <li class="active"><a href="javascript:;">记录 #{$row.id}</a></li>
    </ul>
    <div class="panel panel-default margin-top-20">
        <div class="panel-heading"><strong>{$survey.title}</strong></div>
        <div class="panel-body">
            <p>用户：{$row.nickname|default='-'} / {$row.mobile|default='-'}</p>
            <p>提交时间：{$row.create_time|date='Y-m-d H:i:s'}</p>
            <table class="table table-bordered">
                <thead><tr><th width="200">题目</th><th>回答</th></tr></thead>
                <tbody>
                <foreach name="lines" item="ln">
                    <tr>
                        <td>{$ln.label}</td>
                        <td style="white-space:pre-wrap;">{$ln.value}</td>
                    </tr>
                </foreach>
                </tbody>
            </table>
        </div>
    </div>
    <a class="btn btn-default" href="{:url('admin/HealthSurvey/record',['survey_id'=>$survey.id])}">返回列表</a>
</div>
<include file="public@footer"/>
