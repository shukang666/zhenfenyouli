<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('admin/HealthSurvey/index')}">新版问卷</a></li>
        <li class="active"><a href="javascript:;">提交数据 — {$survey.title}</a></li>
    </ul>
    <div class="well form-inline margin-top-20">
        <form method="get" action="{:url('admin/HealthSurvey/record')}">
            <input type="hidden" name="survey_id" value="{$survey_id}">
            <div class="form-group">
                <label>用户：</label>
                <input type="text" class="form-control" name="keyword" style="width:200px;" value="{$keyword}" placeholder="昵称/手机号">
            </div>
            <button type="submit" class="btn btn-primary">搜索</button>
            <a class="btn btn-success" href="{:url('admin/HealthSurvey/export_record',['survey_id'=>$survey_id,'keyword'=>$keyword])}">导出 Excel</a>
            <a class="btn btn-default" href="{:url('admin/HealthSurvey/edit',['id'=>$survey_id])}">编辑问卷</a>
        </form>
    </div>
    <p class="text-muted">导出 Excel 含全部题目列。</p>
    <table class="table table-hover table-bordered table-list">
        <thead>
        <tr>
            <th width="60">ID</th>
            <th width="120">昵称</th>
            <th width="130">手机号</th>
            <th width="170">提交时间</th>
            <th width="100">操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname|default='-'}</td>
                <td>{$vo.mobile|default='-'}</td>
                <td>{$vo.create_time|date='Y-m-d H:i:s'}</td>
                <td><a class="btn btn-xs btn-primary" href="{:url('admin/HealthSurvey/record_detail',['id'=>$vo.id])}">查看</a></td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
<include file="public@footer"/>
