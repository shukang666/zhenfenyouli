<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:;">商户共治</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('admin/MerchantInspect/index')}">
        <div class="form-group">
            <label>昵称：</label>
            <input type="text" class="form-control" name="name" style="width: 160px;"
                   value="{$params.name|default=''}" placeholder="用户昵称">
        </div>
        <div class="form-group">
            <label>用户ID：</label>
            <input type="text" class="form-control" name="id" style="width: 100px;"
                   value="{$params.id|default=''}" placeholder="用户ID">
        </div>
        <div class="form-group">
            <label>公司：</label>
            <input type="text" class="form-control" name="company" style="width: 160px;"
                   value="{$params.company|default=''}" placeholder="公司名称">
        </div>
        <div class="form-group">
            <label>时间：</label>
            <input type="text" class="form-control laydate-icon" name="start_time" id="start_time"
                   value="{$params.start_time|default=''}" placeholder="开始日期" style="width: 120px;">
            <input type="text" class="form-control laydate-icon" name="end_time" id="end_time"
                   value="{$params.end_time|default=''}" placeholder="结束日期" style="width: 120px;">
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
        <a class="btn btn-danger" href="{:url('admin/MerchantInspect/index')}">清空</a>
        <button type="submit" class="btn btn-success" name="export" value="1">导出</button>
    </form>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th>ID</th>
            <th>昵称</th>
            <th>公司</th>
            <th>门头照片</th>
            <th>宣传品照片</th>
            <th>投放点位照片</th>
            <th>管理制度/收运协议照片</th>
            <th>桶内照片</th>
            <th>提交时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr id="row_{$vo.id}">
                <td>{$vo.id}</td>
                <td>{$vo.nickname|default='--'}<br><small class="text-muted">{$vo.mobile|default=''}</small></td>
                <td>{$vo.company|default='--'}</td>
                <td><if condition="$vo.image_one"><img src="{$vo.image_one}" width="60" height="60" style="object-fit:cover;cursor:pointer;" onClick="openImg('{$vo.image_one}')"><else/>--</if></td>
                <td><if condition="$vo.image_two"><img src="{$vo.image_two}" width="60" height="60" style="object-fit:cover;cursor:pointer;" onClick="openImg('{$vo.image_two}')"><else/>--</if></td>
                <td><if condition="$vo.image_three"><img src="{$vo.image_three}" width="60" height="60" style="object-fit:cover;cursor:pointer;" onClick="openImg('{$vo.image_three}')"><else/>--</if></td>
                <td><if condition="$vo.image_four"><img src="{$vo.image_four}" width="60" height="60" style="object-fit:cover;cursor:pointer;" onClick="openImg('{$vo.image_four}')"><else/>--</if></td>
                <td><if condition="$vo.image_five"><img src="{$vo.image_five}" width="60" height="60" style="object-fit:cover;cursor:pointer;" onClick="openImg('{$vo.image_five}')"><else/>--</if></td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <a class="btn btn-xs btn-default btn-delete" href="javascript:;" data-id="{$vo.id}">删除</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    function openImg(url) {
        layer.open({
            type: 1,
            title: false,
            closeBtn: 1,
            area: ['500px', '500px'],
            skin: 'layui-layer-nobg',
            shadeClose: true,
            content: '<img src="' + url + '" style="width:100%;height:100%;object-fit:contain;" />'
        });
    }

    $(function () {
        $('.btn-delete').on('click', function () {
            var id = $(this).data('id');
            layer.confirm('确认删除？', {btn: ['确认', '取消']}, function (index) {
                $.post("{:url('admin/MerchantInspect/delete')}", {id: id}, function (res) {
                    layer.msg(res.msg, {icon: res.code == 1 ? 1 : 2});
                    if (res.code == 1) setTimeout(function () { location.reload(); }, 1000);
                });
                layer.close(index);
            });
        });
    });
</script>
</body>
</html>
