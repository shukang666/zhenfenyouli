<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>移动管理 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #1d9a6c 0%, #14b8a6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
        }
        .login-box h1 {
            font-size: 20px;
            text-align: center;
            color: #222;
        }
        .login-box .sub {
            font-size: 13px;
            color: #999;
            text-align: center;
            margin-top: 6px;
            margin-bottom: 26px;
        }
        .form-item {
            margin-bottom: 16px;
        }
        .form-item input {
            width: 100%;
            height: 46px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            background: #f8f9fa;
        }
        .form-item input:focus {
            border-color: #1d9a6c;
            background: #fff;
        }
        .btn-login {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: #1d9a6c;
            color: #fff;
            font-size: 16px;
            margin-top: 8px;
        }
        .btn-login:active { opacity: .85; }
        .btn-login[disabled] { opacity: .5; }
        .tip {
            margin-top: 14px;
            font-size: 12px;
            color: #bbb;
            text-align: center;
        }
        .msg {
            display: none;
            margin-bottom: 14px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            background: #fdecea;
            color: #d93026;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>甄分友礼 · 移动管理</h1>
    <div class="sub">驾驶舱</div>
    <div class="msg" id="msg"></div>
    <div class="form-item">
        <input type="text" id="username" placeholder="账号 / 手机号" autocomplete="username">
    </div>
    <div class="form-item">
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn" onclick="doLogin()">登 录</button>
    <!-- <div class="tip">账号与PC管理后台一致</div> -->
</div>
<script>
    function showMsg(text) {
        var el = document.getElementById('msg');
        el.textContent = text;
        el.style.display = 'block';
    }

    function doLogin() {
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username) return showMsg('请输入账号');
        if (!password) return showMsg('请输入密码');

        var btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = '登录中...';

        var data = new FormData();
        data.append('username', username);
        data.append('password', password);

        fetch("{:url('doLogin')}", {
            method: 'POST',
            body: data,
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        }).then(function (res) { return res.json(); }).then(function (res) {
            if (res.code == 1) {
                location.href = res.url;
            } else {
                showMsg(res.msg || '登录失败');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }).catch(function () {
            showMsg('网络异常，请重试');
            btn.disabled = false;
            btn.textContent = '登 录';
        });
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
