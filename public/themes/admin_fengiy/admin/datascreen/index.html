<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$app_name} · 数据大屏</title>
    <link rel="stylesheet" href="__STATIC__/font-awesome/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #d7f6ff;
            background: #020817;
            overflow-x: hidden;
            overflow-y: auto;
        }
        #bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse at 18% 0%, rgba(14, 116, 144, .22), transparent 42%),
                radial-gradient(ellipse at 88% 100%, rgba(67, 56, 202, .18), transparent 40%),
                linear-gradient(#03101f, #020817);
        }
        #bg-grid:after {
            content: "";
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(34, 211, 238, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, .05) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(ellipse at center, #000 35%, transparent 88%);
        }
        .wrap {
            position: relative; z-index: 1;
            padding: 6px 8px 8px;
        }
        .head {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin-bottom: 6px; padding: 6px 10px;
            border: 1px solid rgba(34, 211, 238, .24);
            background: linear-gradient(90deg, rgba(6, 24, 48, .92), rgba(8, 47, 73, .75));
        }
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .brand-mark {
            width: 26px; height: 26px; border-radius: 6px; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #22d3ee, #2563eb);
            color: #04131f; font-size: 13px;
        }
        .brand h1 {
            font-size: 14px; letter-spacing: 1px; font-weight: 700; white-space: nowrap;
            background: linear-gradient(90deg, #e0f2fe, #67e8f9);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .brand small { display: block; color: #64748b; font-size: 10px; letter-spacing: 0; margin-top: 1px; }
        .clock-time { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #67e8f9; line-height: 1.1; }
        .clock-date { font-size: 10px; color: #64748b; text-align: center; }
        .head-actions { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; justify-content: flex-end; }
        .head-actions button {
            color: #67e8f9; border: 1px solid rgba(34,211,238,.35);
            background: rgba(8, 47, 73, .6); padding: 3px 8px; border-radius: 4px;
            font-size: 11px; cursor: pointer; line-height: 1.4;
        }
        .head-actions button:hover { background: rgba(34,211,238,.16); }
        .meta { font-size: 10px; color: #64748b; white-space: nowrap; }
        .kpis {
            display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px;
            margin-bottom: 6px;
        }
        .kpi {
            padding: 4px 7px 3px;
            border: 1px solid rgba(34, 211, 238, .18);
            background: linear-gradient(180deg, rgba(8, 30, 54, .88), rgba(4, 16, 32, .75));
            border-left: 2px solid #22d3ee;
            min-width: 0;
        }
        .kpi .lab { font-size: 9px; color: #7dd3fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi .num { font-size: 15px; font-weight: 700; color: #f8fafc; margin: 1px 0 0; font-variant-numeric: tabular-nums; line-height: 1.15; }
        .kpi .sub { font-size: 9px; color: #94a3b8; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi .sub em { color: #4ade80; font-style: normal; }
        .screen-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 5px;
        }
        .g-3 { grid-column: span 3; }
        .g-4 { grid-column: span 4; }
        .g-5 { grid-column: span 5; }
        .g-6 { grid-column: span 6; }
        .g-8 { grid-column: span 8; }
        .g-12 { grid-column: span 12; }
        .panel {
            border: 1px solid rgba(34, 211, 238, .18);
            background: rgba(4, 18, 36, .78);
            display: flex; flex-direction: column; min-width: 0;
        }
        .ptitle {
            flex: none; height: 22px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 8px; font-size: 11px; color: #7dd3fc;
            border-bottom: 1px solid rgba(34,211,238,.1);
            background: linear-gradient(90deg, rgba(34,211,238,.1), transparent 60%);
        }
        .ptitle i { margin-right: 4px; color: #22d3ee; font-size: 10px; }
        .ptitle .sub { font-size: 9px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
        .chart { height: 168px; width: 100%; }
        .chart-sm { height: 148px; }
        .feed {
            height: 148px; overflow: hidden auto; padding: 2px 8px 4px;
        }
        .feed-item {
            display: flex; justify-content: space-between; gap: 6px;
            font-size: 10px; color: #cbd5e1; padding: 3px 0;
            border-bottom: 1px dashed rgba(148,163,184,.1);
        }
        .feed-item span { color: #67e8f9; flex: none; font-size: 9px; }
        .feed-item b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        body.is-embed {
            overflow: hidden;
            height: 100%;
        }
        body.is-embed .wrap {
            height: 100%;
            padding: 4px 6px 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.is-embed .head {
            padding: 4px 8px;
            margin-bottom: 4px;
            flex: none;
        }
        body.is-embed .brand-mark,
        body.is-embed .brand small,
        body.is-embed .clock-box,
        body.is-embed .btn-standalone { display: none; }
        body.is-embed .brand h1 { font-size: 13px; letter-spacing: 0; }
        body.is-embed .kpis {
            margin-bottom: 4px;
            gap: 4px;
            flex: none;
        }
        body.is-embed .kpi { padding: 3px 6px 2px; }
        body.is-embed .kpi .num { font-size: 14px; }
        body.is-embed .screen-grid {
            flex: 1;
            min-height: 0;
            gap: 4px;
            align-content: start;
            overflow-y: auto;
        }
        body.is-embed .ptitle { height: 20px; font-size: 10px; padding: 0 6px; }
        body.is-embed .chart,
        body.is-embed .chart-sm,
        body.is-embed .feed { height: var(--chart-h, 132px); }
        @media (max-width: 1400px) {
            .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .g-3, .g-4, .g-5, .g-6, .g-8 { grid-column: span 6; }
        }
        @media (max-width: 900px) {
            .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .g-3, .g-4, .g-5, .g-6, .g-8, .g-12 { grid-column: span 12; }
            .chart, .chart-sm { height: 220px; }
        }
    </style>
</head>
<body>
<div id="bg-grid"></div>
<div class="wrap">
    <header class="head">
        <div class="brand">
            <div class="brand-mark"><i class="fa fa-area-chart"></i></div>
            <div>
                <h1>{$app_name} 数据大屏</h1>
                <small>社区环保运营全景 · 近 30 日</small>
            </div>
        </div>
        <div class="clock-box">
            <div class="clock-time" id="clock-time">--:--:--</div>
            <div class="clock-date" id="clock-date"></div>
        </div>
        <div class="head-actions">
            <span class="meta" id="meta-info"></span>
            <button type="button" id="btn-refresh"><i class="fa fa-refresh"></i> 刷新</button>
            <button type="button" class="btn-standalone" id="btn-full"><i class="fa fa-arrows-alt"></i> 全屏</button>
        </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="screen-grid">
        <div class="panel g-8">
            <div class="ptitle"><span><i class="fa fa-line-chart"></i>近 30 日多维趋势</span><span class="sub">注册 / 打卡 / 垃圾打卡 / 巡检 / 报名 / 积分</span></div>
            <div class="chart" id="c-trend"></div>
        </div>
        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-bullseye"></i>近 7 日运营雷达</span></div>
            <div class="chart" id="c-radar"></div>
        </div>

        <div class="panel g-3">
            <div class="ptitle"><span><i class="fa fa-filter"></i>用户成长漏斗</span></div>
            <div class="chart chart-sm" id="c-funnel"></div>
        </div>
        <div class="panel g-5">
            <div class="ptitle"><span><i class="fa fa-th"></i>打卡时空热力</span><span class="sub">周 × 小时</span></div>
            <div class="chart chart-sm" id="c-heat"></div>
        </div>
        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-clock-o"></i>今日时段脉冲</span></div>
            <div class="chart chart-sm" id="c-hour"></div>
        </div>

        <div class="panel g-3">
            <div class="ptitle"><span><i class="fa fa-pie-chart"></i>垃圾分类结构</span></div>
            <div class="chart chart-sm" id="c-cate"></div>
        </div>
        <div class="panel g-3">
            <div class="ptitle"><span><i class="fa fa-diamond"></i>积分来源构成</span></div>
            <div class="chart chart-sm" id="c-point"></div>
        </div>
        <div class="panel g-6">
            <div class="ptitle"><span><i class="fa fa-building"></i>小区打卡排行 TOP12</span></div>
            <div class="chart chart-sm" id="c-community"></div>
        </div>

        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-sitemap"></i>社区用户分布</span></div>
            <div class="chart chart-sm" id="c-street"></div>
        </div>
        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-bar-chart"></i>帖子/打卡类型</span></div>
            <div class="chart chart-sm" id="c-type"></div>
        </div>
        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-handshake-o"></i>整改任务</span></div>
            <div class="chart chart-sm" id="c-task"></div>
        </div>
        <div class="panel g-4">
            <div class="ptitle"><span><i class="fa fa-rss"></i>实时动态流</span></div>
            <div class="feed" id="c-feed"></div>
        </div>
    </section>
</div>

<script src="__TMPL__/public/assets/js/echarts/echarts.min.js"></script>
<script>
    var D = {$payloadJson|raw};
    var AJAX_URL = '{:url("Datascreen/ajax_data")}';
    var charts = {};
    var C = ['#22d3ee', '#38bdf8', '#818cf8', '#4ade80', '#fbbf24', '#fb7185', '#c084fc', '#2dd4bf'];
    var IS_EMBED = window.self !== window.top;
    if (IS_EMBED) document.body.classList.add('is-embed');

    function nfmt(n) {
        n = parseInt(n || 0, 10);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    function tip() {
        return { backgroundColor: 'rgba(2,8,23,.92)', borderColor: '#22d3ee', textStyle: { color: '#e0f2fe', fontSize: 12 } };
    }
    function axis() {
        return {
            axisLine: { lineStyle: { color: 'rgba(125,211,252,.25)' } },
            axisLabel: { color: '#7dd3fc', fontSize: 10 },
            splitLine: { lineStyle: { color: 'rgba(125,211,252,.08)' } }
        };
    }
    function emptyOpt(text) {
        return { title: { text: text || '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#475569', fontSize: 13, fontWeight: 'normal' } } };
    }
    function applyChartHeights() {
        if (!IS_EMBED) return;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var head = document.querySelector('.head');
        var kpis = document.getElementById('kpis');
        var used = (head ? head.offsetHeight : 0) + (kpis ? kpis.offsetHeight : 0) + 14;
        var remain = vh - used;
        var rowH = Math.floor((remain - 16) / 4);
        if (rowH < 108) rowH = 108;
        if (rowH > 148) rowH = 148;
        document.documentElement.style.setProperty('--chart-h', rowH + 'px');
    }
    function resizeAll() {
        applyChartHeights();
        for (var k in charts) { if (charts[k]) charts[k].resize(); }
    }

    function renderKpi(d) {
        var k = d.kpi || {};
        var items = [
            { lab: '注册用户', num: k.user_total, sub: '今日 <em>+' + nfmt(k.user_today) + '</em> · 7日 ' + nfmt(k.user_7d) },
            { lab: '垃圾打卡', num: k.lj_total, sub: '今日 <em>+' + nfmt(k.lj_today) + '</em> · 活跃 ' + nfmt(k.clock_user_today) },
            { lab: '点位巡检', num: k.patrol_total, sub: '今日 <em>+' + nfmt(k.patrol_today) + '</em>' },
            { lab: '活动报名', num: k.sign_total, sub: '进行中 ' + nfmt(k.active_ing) + ' · 今日 ' + nfmt(k.sign_today) },
            { lab: '积分发放', num: k.point_total, sub: '今日 <em>+' + nfmt(k.point_today) + '</em> · 7日 ' + nfmt(k.point_7d) },
            { lab: '小区 / 社区', num: k.community_total, sub: '社区 ' + nfmt(k.parent_total) + ' · 已绑 ' + nfmt(k.user_bind) },
            { lab: '督导 / 商户', num: k.supervisor_total, sub: '商户 ' + nfmt(k.merchant_total) + ' · 学分类 ' + nfmt(k.learn_user) },
            { lab: '整改 / 学考', num: k.task_log, sub: '任务 ' + nfmt(k.task_open) + ' · 通关率 ' + (d.qxl_rate || 0) + '%' }
        ];
        var html = '';
        for (var i = 0; i < items.length; i++) {
            html += '<div class="kpi"><div class="lab">' + items[i].lab + '</div><div class="num">' + nfmt(items[i].num) + '</div><div class="sub">' + items[i].sub + '</div></div>';
        }
        document.getElementById('kpis').innerHTML = html;
        document.getElementById('meta-info').textContent = (d.from_cache ? '缓存' : '实时') + ' · ' + (d.cost_ms || 0) + 'ms · ' + (d.update_time || '');
    }

    function make(id) {
        if (typeof echarts === 'undefined') return null;
        if (charts[id]) charts[id].dispose();
        charts[id] = echarts.init(document.getElementById(id), null, { renderer: 'canvas' });
        return charts[id];
    }

    function renderCharts(d) {
        if (typeof echarts === 'undefined') return;
        var t = d.trend || {};
        make('c-trend').setOption({
            color: C,
            tooltip: Object.assign({ trigger: 'axis' }, tip()),
            legend: { data: ['注册', '打卡', '垃圾打卡', '巡检', '报名', '积分'], top: 0, itemGap: 8, textStyle: { color: '#94a3b8', fontSize: 9 }, itemWidth: 7, itemHeight: 7 },
            grid: { left: 36, right: 38, top: 22, bottom: 16 },
            xAxis: Object.assign({ type: 'category', data: t.labels || [], boundaryGap: false }, axis()),
            yAxis: [
                Object.assign({ type: 'value', minInterval: 1, splitNumber: 4 }, axis()),
                Object.assign({ type: 'value', minInterval: 1, splitLine: { show: false } }, axis())
            ],
            series: [
                { name: '注册', type: 'line', data: t.user, smooth: true, symbol: 'none', areaStyle: { color: 'rgba(56,189,248,.1)' } },
                { name: '打卡', type: 'bar', data: t.clock, barMaxWidth: 6, itemStyle: { color: 'rgba(129,140,248,.5)' } },
                { name: '垃圾打卡', type: 'line', data: t.lj, smooth: true, symbol: 'none' },
                { name: '巡检', type: 'line', data: t.patrol, smooth: true, symbol: 'none' },
                { name: '报名', type: 'line', data: t.sign, smooth: true, symbol: 'none' },
                { name: '积分', type: 'line', yAxisIndex: 1, data: t.point, smooth: true, symbol: 'none', lineStyle: { type: 'dotted' } }
            ]
        });

        var radar = d.radar || { indicator: [], value: [] };
        make('c-radar').setOption({
            tooltip: tip(),
            radar: {
                indicator: radar.indicator,
                radius: '68%',
                center: ['50%', '52%'],
                splitNumber: 4,
                axisName: { color: '#7dd3fc', fontSize: 9 },
                splitLine: { lineStyle: { color: 'rgba(34,211,238,.2)' } },
                splitArea: { areaStyle: { color: ['rgba(34,211,238,.05)', 'rgba(34,211,238,.01)'] } }
            },
            series: [{ type: 'radar', data: [{ value: radar.value, areaStyle: { color: 'rgba(34,211,238,.22)' }, lineStyle: { color: '#22d3ee' } }] }]
        });

        make('c-funnel').setOption({
            tooltip: Object.assign({ trigger: 'item' }, tip()),
            color: C,
            series: [{ type: 'funnel', left: '4%', top: 4, bottom: 4, width: '82%', minSize: '8%', label: { color: '#e0f2fe', fontSize: 9 }, data: d.funnel || [] }]
        });

        var weeks = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        var hours = [];
        for (var h = 0; h < 24; h++) hours.push(h + '时');
        var heatData = d.heat || [];
        var heatMax = 1;
        for (var hi = 0; hi < heatData.length; hi++) {
            if (heatData[hi][2] > heatMax) heatMax = heatData[hi][2];
        }
        make('c-heat').setOption({
            tooltip: Object.assign({ formatter: function (p) { return weeks[p.value[1]] + ' ' + p.value[0] + '时：' + p.value[2]; } }, tip()),
            grid: { left: 32, right: 6, top: 2, bottom: 14 },
            xAxis: Object.assign({ type: 'category', data: hours, axisLabel: { interval: 4, fontSize: 8 } }, axis()),
            yAxis: Object.assign({ type: 'category', data: weeks, axisLabel: { fontSize: 8 } }, axis()),
            visualMap: { min: 0, max: heatMax, show: false, inRange: { color: ['#042f2e', '#155e75', '#22d3ee', '#fde047'] } },
            series: [{ type: 'heatmap', data: heatData }]
        });

        make('c-hour').setOption({
            tooltip: Object.assign({ trigger: 'axis' }, tip()),
            grid: { left: 30, right: 6, top: 8, bottom: 14 },
            xAxis: Object.assign({ type: 'category', data: hours, boundaryGap: false, axisLabel: { interval: 4, fontSize: 8 } }, axis()),
            yAxis: Object.assign({ type: 'value', minInterval: 1, splitNumber: 3 }, axis()),
            series: [{ type: 'line', data: d.hour_today || [], smooth: true, symbol: 'none', lineStyle: { color: '#4ade80' }, areaStyle: { color: 'rgba(74,222,128,.15)' } }]
        });

        var cate = d.cate_pie || [];
        make('c-cate').setOption(cate.length ? {
            tooltip: Object.assign({ trigger: 'item' }, tip()), color: C,
            series: [{ type: 'pie', radius: ['24%', '68%'], center: ['50%', '52%'], label: { color: '#bae6fd', fontSize: 9 }, data: cate }]
        } : emptyOpt());

        var ps = d.point_source || [];
        make('c-point').setOption(ps.length ? {
            tooltip: Object.assign({ trigger: 'item' }, tip()), color: C,
            series: [{ type: 'pie', radius: ['40%', '68%'], center: ['50%', '52%'], label: { fontSize: 8, color: '#bae6fd' }, data: ps }]
        } : emptyOpt());

        var comm = (d.community || []).slice().reverse();
        make('c-community').setOption(comm.length ? {
            tooltip: Object.assign({ trigger: 'axis' }, tip()),
            grid: { left: 72, right: 10, top: 2, bottom: 2 },
            xAxis: Object.assign({ type: 'value', minInterval: 1 }, axis()),
            yAxis: Object.assign({ type: 'category', data: comm.map(function (x) { return x.name; }), axisLabel: { fontSize: 8, width: 64, overflow: 'truncate' } }, axis()),
            series: [{ type: 'bar', data: comm.map(function (x) { return x.value; }), barMaxWidth: 8, itemStyle: { color: '#67e8f9', borderRadius: [0, 2, 2, 0] } }]
        } : emptyOpt());

        var st = d.street || [];
        make('c-street').setOption(st.length ? {
            tooltip: Object.assign({ trigger: 'item' }, tip()), color: C,
            series: [{ type: 'treemap', roam: false, breadcrumb: { show: false }, top: 2, bottom: 2, left: 2, right: 2, label: { color: '#e0f2fe', fontSize: 10 }, data: st }]
        } : emptyOpt());

        var tb = d.type_bar || [];
        make('c-type').setOption(tb.length ? {
            tooltip: Object.assign({ trigger: 'axis' }, tip()),
            grid: { left: 48, right: 8, top: 8, bottom: 22 },
            xAxis: Object.assign({ type: 'category', data: tb.map(function (x) { return x.name; }), axisLabel: { rotate: 16, fontSize: 8 } }, axis()),
            yAxis: Object.assign({ type: 'value', minInterval: 1, splitNumber: 3 }, axis()),
            series: [{ type: 'bar', data: tb.map(function (x) { return x.value; }), barMaxWidth: 12, itemStyle: { color: '#818cf8', borderRadius: [2, 2, 0, 0] } }]
        } : emptyOpt());

        make('c-task').setOption({
            tooltip: Object.assign({ trigger: 'item' }, tip()),
            color: ['#38bdf8', '#fbbf24', '#fb7185', '#4ade80'],
            series: [{ type: 'pie', radius: ['38%', '68%'], center: ['50%', '52%'], label: { fontSize: 9, color: '#bae6fd' }, data: d.task_pie || [] }]
        });

        var feed = d.latest || [];
        var fh = '';
        for (var i = 0; i < feed.length; i++) {
            fh += '<div class="feed-item"><b>' + feed[i].text + '</b><span>' + feed[i].time + '</span></div>';
        }
        document.getElementById('c-feed').innerHTML = fh || '<div class="feed-item">暂无动态</div>';
        setTimeout(resizeAll, 80);
    }

    function tickClock() {
        var now = new Date();
        var p = function (n) { return n < 10 ? '0' + n : '' + n; };
        var el = document.getElementById('clock-time');
        if (el) el.textContent = p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
        var w = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
        var de = document.getElementById('clock-date');
        if (de) de.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + w;
    }

    function load(force) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', AJAX_URL + (force ? '?refresh=1' : ''), true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var res = JSON.parse(xhr.responseText);
                    if (res.code == 1 && res.data) {
                        D = res.data;
                        renderKpi(D);
                        renderCharts(D);
                    }
                } catch (e) {}
            }
        };
        xhr.send();
    }

    document.getElementById('btn-refresh').onclick = function () { load(true); };
    document.getElementById('btn-full').onclick = function () {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };
    window.addEventListener('resize', resizeAll);

    tickClock();
    setInterval(tickClock, 1000);
    applyChartHeights();
    renderKpi(D);
    renderCharts(D);
    setInterval(function () { load(false); }, 90000);
</script>
</body>
</html>
