<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>

</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">列表</a></li>
        <notempty name="item.id">
            <li class="active"><a href="">编辑</a></li>
            <else/>
            <li class="active"><a href="{:url('update')}">添加</a></li>
        </notempty>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('updatePost')}">

        <input type="hidden" value="{$item.id|default=''}" name="id">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>名称:</label>
            <div class="col-md-4 col-sm-10">
                <input  type="text" class="form-control" name="level_name" value="{$item.level_name|default=''}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>帖子数:</label>
            <div class="col-md-4 col-sm-10">
                <input  type="number" class="form-control" min="=1" name="forum_num" value="{$item.forum_num|default=''}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>点赞数:</label>
            <div class="col-md-4 col-sm-10">
                <input  type="number" class="form-control" min="=1" name="like_num" value="{$item.like_num|default=''}" required>
            </div>
        </div>


        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
            <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>

</body>
</html>
