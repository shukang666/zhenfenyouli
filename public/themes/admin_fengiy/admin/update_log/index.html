<include file="public@header"/>
</head>
<body>
<style>
    /* 更新记录页：详情用 <pre> 原样展示（保留换行与缩进） */
    .upd-filter {
        padding: 12px;
        margin-bottom: 0;
    }

    .upd-filter .form-control {
        min-width: 180px;
    }

    .upd-title {
        font-weight: 600;
        word-wrap: break-word;
        white-space: normal;
    }

    .upd-content {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.7;
        color: #555;
        /* 保留换行与空格，同时允许长行折行，避免撑破表格 */
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        max-height: 260px;
        overflow-y: auto;
    }

    .upd-empty {
        padding: 40px 0;
        text-align: center;
        color: #999;
    }
</style>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">更新记录</a></li>
    </ul>

    <div class="alert alert-info margin-top-20" style="padding:8px 12px;font-size:12px;">
        本页<b>只读</b>：更新记录由开发方直接写入数据表 <code>cmf_update_log</code>，后台不提供新增 / 编辑 / 删除。
    </div>

    <form class="well form-inline upd-filter" method="get" action="{:url('index')}">
        <div class="form-group">
            <input type="text" class="form-control" name="keyword"
                   value="{$keyword}" placeholder="搜索标题或更新详情">
        </div>
        <div class="form-group">
            <select name="type" class="form-control">
                <option value="">全部类型</option>
                <volist name="types" id="t">
                    <option value="{$key}" <if condition="$curType eq $key">selected</if>>{$t}</option>
                </volist>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
        <a href="{:url('index')}" class="btn btn-default">重置</a>
    </form>

    <table class="table table-hover table-bordered">
        <thead>
        <tr>
            <th style="width:140px;">更新时间</th>
            <th style="width:90px;">版本</th>
            <th style="width:86px;">类型</th>
            <th style="width:220px;">标题</th>
            <th>更新详情</th>
        </tr>
        </thead>
        <tbody>
        <if condition="$list->isEmpty()">
            <tr>
                <td colspan="5" class="upd-empty">暂无更新记录</td>
            </tr>
        </if>
        <volist name="list" id="vo">
            <tr>
                <td>{$vo.create_time|date="Y-m-d H:i"}</td>
                <td>{$vo.version|default='—'}</td>
                <td><span class="label {$vo.type_class}">{$vo.type_label}</span></td>
                <td class="upd-title">{$vo.title}</td>
                <td>
                    <pre class="upd-content">{$vo.content}</pre>
                </td>
            </tr>
        </volist>
        </tbody>
    </table>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
