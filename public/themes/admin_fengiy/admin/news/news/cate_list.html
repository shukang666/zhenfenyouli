<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('cate_list')}">列表</a></li>
        <li><a href="{:url('cate_update')}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('cate_list')}">
        关键字：
        <input type="text" class="form-control" name="keyword" style="width: 140px;"
               value="{:input('request.keyword/s','')}" placeholder="请输入标题">

        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('cate_list')}">清空</a>
    </form>
<!--    <form method="post" class="js-ajax-form margin-top-20" action="{:url('listOrder')}">-->
<!--        <div class="table-actions">-->
<!--            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>-->
<!--        </div>-->
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
<!--                <th width="50">排序</th>-->
                <th>ID</th>
                <th>标题</th>

                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
<!--                    <td>-->
<!--                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">-->
<!--                    </td>-->
                    <td>{$vo.id}</td>
                    <td>{$vo.cate_name}</td>
                    <td>
                        <a class="btn btn-xs btn-primary"
                           href="javascript:parent.openIframeLayer('{:url('cate_update',array('id'=>$vo['id']))}','',{area:['80%','80%']});">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>

</body>
</html>
