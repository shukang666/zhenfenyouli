<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index',['type'=>$params.type])}">列表</a></li>

            <li><a href="{:url('update',['type'=>$params.type])}">添加</a></li>
       <!-- <if condition="$params.type neq 1"> </if>-->
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index',['type'=>$params.type])}">
        关键字：
        <input type="text" class="form-control" name="title" style="width: 140px;"
               value="{:input('request.title/s','')}" placeholder="请输入名称">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index',['type'=>$params.type])}">清空</a>

    </form>
    <form method="post" class="js-ajax-form margin-top-20 layui-form" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <!--                    <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"-->
                <!--                                                 data-checklist="js-check-x"></label></th>-->
                <th>排序</th>
                <th>ID</th>
                <th>名称</th>
                <th>启用</th>


                <th width="250">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <!--                        <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"-->
                    <!--                                   name="ids[]" value="{$vo.id}"></td>-->
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text"
                               value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.name}</td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status"
                                   value="{$vo.id}"
                            <if condition="$vo.status == 1">checked</if>
                            >
                        </div>
                    </td>

                    <td>

                        <a class="btn btn-xs btn-info"
                           href="javascript:parent.openIframeLayer('{:url('question/index',array('pid'=>$vo['id']))}','{$vo.name}的题目',{area:['90%','90%']});">题目</a>
                        <a class="btn btn-xs btn-success"
                           href="javascript:parent.openIframeLayer('{:url('course/answer',array('exam_id'=>$vo['id']))}','{$vo.name}的答题记录',{area:['90%','90%']});">答题记录</a>

                        <!--                        <a class="btn btn-xs layui-bg-purple" href="javascript:parent.openIframeLayer('{:url('answer_result/index',array('data_id'=>$vo['id']))}','{$vo.name}的结果',{area:['90%','90%']});">结果</a>-->


                        <a class="btn btn-xs btn-primary"
                           href="{:url('update',array('id'=>$vo['id'],'type'=>$params.type))}">{:lang('EDIT')}</a>

                            <a class="btn btn-xs btn-danger js-ajax-delete"
                               href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                        <if condition="$params.type neq 1">    </if>

                        <!--                        <if condition="$vo.id  gt 8">-->

                        <!--                        <a class="btn btn-xs btn-primary"-->
                        <!--                           href="{:url('update',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>-->
                        <!--
                        <!--                        </if>  &lt;!&ndash;                                        <a class="btn btn-xs btn-warning" href="javascript:parent.openIframeLayer('{:url('cate_data/index',array('cate_id'=>$vo['id']))}','',{area:['70%','70%']});">内容</a>&ndash;&gt;-->
                    </td>

                </tr>
            </foreach>
            </tbody>
        </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });
        //发布不发布
        form.on('switch(is_top)', function (data) {
            setStatus(data.value, 'is_top', this.checked ? 1 : 0)
        });

        pro_type='{$params.type}';

        function setStatus(id, type, status) {
            $.ajax({
                url: '{:url(\'setStatus\')}',
                type: "POST",
                data: {id: id, type: type,pro_type: pro_type, status: status, cate: 0},
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                    if (pro_type == 1) {
                        setInterval(function () {
                            window.location.reload();
                        },  1000)
                    }

                }
            });
        }
    });

</script>
</body>
</html>
