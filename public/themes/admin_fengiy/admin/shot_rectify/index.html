<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('admin/ShotRectify/index')}">志愿者整改清单</a></li>
    </ul>
    <form class="well form-inline margin-top-20 layui-form" method="get" action="{:url('admin/ShotRectify/index')}">
        状态：
        <select name="status" class="form-control" style="width: 120px;">
            <option value="">全部</option>
            <option value="0" <if condition="$status eq '0'">selected</if>>待整改</option>
            <option value="1" <if condition="$status eq '1'">selected</if>>已整改</option>
        </select>
        &nbsp;&nbsp;
        备注：
        <input type="text" class="form-control" name="keyword" style="width: 160px;"
               value="{$keyword}" placeholder="备注关键词">
        &nbsp;&nbsp;
        <input type="submit" class="btn btn-primary" value="搜索"/>
        <a class="btn btn-danger" href="{:url('admin/ShotRectify/index')}">清空</a>
    </form>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户昵称</th>
            <th>手机号</th>
            <th>问题图片</th>
            <th>备注</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname}</td>
                <td>{$vo.mobile}</td>
                <td>
                    <notempty name="$vo.image">
                        <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.image)}');">
                            <img src="{:cmf_get_image_preview_url($vo.image)}" style="width:60px;height:60px;border-radius:4px;">
                        </a>
                    </notempty>
                </td>
                <td style="max-width:200px;word-break:break-all;">{$vo.remark}</td>
                <td>
                    <if condition="$vo.status == 0">
                        <span class="label label-warning">待整改</span>
                    <else/>
                        <span class="label label-success">已整改</span>
                    </if>
                </td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <if condition="$vo.status == 0">
                        <a class="btn btn-xs btn-success btn-rectified" href="javascript:;" data-id="{$vo.id}">标记已整改</a>
                    </if>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    $(function () {
        $('.btn-rectified').on('click', function () {
            var id = $(this).data('id');
            layer.confirm('确认标记为已整改？', {btn: ['确认', '取消']}, function (index) {
                $.ajax({
                    url: "{:url('admin/ShotRectify/rectified')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id},
                    success: function (res) {
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1});
                            setTimeout(function () { location.reload(); }, 1000);
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
                layer.close(index);
            });
        });
    });
</script>
</body>
</html>
