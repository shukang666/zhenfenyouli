<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>推送配置</title>
    <link rel="stylesheet" href="__STATIC__/lib/layui/css/layui.css">
    <link rel="stylesheet" href="__STATIC__/lib/bootstrap/css/bootstrap.min.css">
    <style>
        body { padding: 20px; background: #fff; }
        .push-field-row {
            background: #f9f9f9;
            border: 1px dashed #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
        }
        .push-field-row .delete-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            color: #ff4d4f;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>
<form id="pushForm" class="form-horizontal">
    <input type="hidden" name="id" value="{$item.id|default=''}">
    <input type="hidden" name="action_id" value="{$action.id|default=''}">

    <div class="form-group">
        <label class="col-sm-3 control-label">关联活动：</label>
        <div class="col-sm-8">
            <p class="form-control-static">{$active.name|default='-'}（打卡{$action.clock_count|default='-'}次）</p>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-3 control-label"><span class="text-danger">*</span>推送标题：</label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="push_title" value="{$item.push_title|default=''}" placeholder="如：9月儿童运动比赛安排通知" required>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-3 control-label">推送内容字段：</label>
        <div class="col-sm-8">
            <div id="push-fields-container">
                <!-- 动态添加 -->
            </div>
            <button type="button" class="btn btn-sm btn-info" onclick="addPushField()">
                <i class="fa fa-plus"></i> 添加字段
            </button>
            <p class="text-muted" style="margin-top: 5px;">可自定义标签名称，如：时间、地点、注意事项等</p>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-offset-3 col-sm-8">
            <button type="button" class="btn btn-primary" onclick="savePush()">保存</button>
            <button type="button" class="btn btn-default" onclick="parent.layer.closeAll()">取消</button>
        </div>
    </div>
</form>

<script src="__STATIC__/lib/jquery/jquery.min.js"></script>
<script src="__STATIC__/lib/layui/layui.js"></script>
<script>
    $(function () {
        var item = {:json_encode($item_json, JSON_UNESCAPED_UNICODE)};
        var fields = [];
        try {
            fields = item.push_fields ? JSON.parse(item.push_fields) : [];
        } catch(e) {
            fields = [];
        }

        if (fields.length > 0) {
            fields.forEach(function(f) {
                addPushField(f.label, f.value);
            });
        } else {
            // 添加默认字段
            addPushField('时间', '');
            addPushField('地点', '');
        }
    });

    function addPushField(label, value) {
        label = label || '';
        value = value || '';
        var index = $('#push-fields-container .push-field-row').length;

        var html = '<div class="push-field-row">';
        html += '<span class="delete-btn" onclick="removePushField(this)">×</span>';
        html += '<div class="row">';
        html += '<div class="col-xs-4">';
        html += '<label>字段标签：</label>';
        html += '<input type="text" class="form-control input-sm field-label" value="' + label + '" placeholder="如：时间">';
        html += '</div>';
        html += '<div class="col-xs-8">';
        html += '<label>字段内容：</label>';
        html += '<input type="text" class="form-control input-sm field-value" value="' + value + '" placeholder="如：2026-09-30 10:00">';
        html += '</div>';
        html += '</div>';
        html += '</div>';

        $('#push-fields-container').append(html);
    }

    function removePushField(btn) {
        $(btn).closest('.push-field-row').remove();
    }

    function savePush() {
        var pushTitle = $('input[name="push_title"]').val().trim();
        if (!pushTitle) {
            layer.alert('请填写推送标题');
            return;
        }

        var fields = [];
        $('#push-fields-container .push-field-row').each(function() {
            var label = $(this).find('.field-label').val().trim();
            var value = $(this).find('.field-value').val().trim();
            if (label && value) {
                fields.push({label: label, value: value});
            }
        });

        if (fields.length === 0) {
            layer.alert('请至少添加一个推送字段');
            return;
        }

        var formData = {
            id: $('input[name="id"]').val(),
            action_id: $('input[name="action_id"]').val(),
            push_title: pushTitle,
            push_fields: fields
        };

        $.ajax({
            url: '{:url("active_clock_action/push_save")}',
            type: 'POST',
            data: formData,
            dataType: 'json',
            success: function(res) {
                if (res.code == 1) {
                    layer.msg(res.msg, {icon: 1}, function() {
                        parent.layer.closeAll();
                        if (typeof parent.location.reload === 'function') {
                            parent.location.reload();
                        }
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            },
            error: function() {
                layer.msg('保存失败，请重试', {icon: 2});
            }
        });
    }
</script>
</body>
</html>
