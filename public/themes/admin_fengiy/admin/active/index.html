<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index',[['type'=>$params.type]])}">列表</a></li>
        <li><a href="{:url('update',['type'=>$params.type])}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index',['type'=>$params.type])}">
        关键字：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="请输入名称">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index',['type'=>$params.type])}">清空</a>

    </form>
    <form method="post" class="js-ajax-form margin-top-20" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <!--                    <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"-->
                <!--                                                 data-checklist="js-check-x"></label></th>-->
                <!--            <th>ID</th>-->
                <th width="50">排序</th>
                <th>名称</th>
                <if condition="$params.type == 1">   <th>赠送积分</th> </if>
                <th>启用</th>
                <if condition="$params.type == 3 || $params.type == 1">
                    <th>推荐</th>
                </if>
                <if condition="$params.type == 1">
                    <th>本周推荐</th>
                    <th>首页展示</th>
                </if>
                <th>添加时间</th>
                <th>小程序码</th>

                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <!--                <td>{$vo.id}</td>-->
                    <td>{$vo.name}</td>
                    <if condition="$params.type == 1">
                        <td>
                            <if condition="$vo.is_clock == 1">
                                {$vo.send_point}
                            </if>
                        </td>
                    </if>

                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status"
                                   value="{$vo.id}"
                            <if condition="$vo.status == 1">checked</if>
                            >
                        </div>
                    </td>
                    <if condition="$params.type == 3 || $params.type == 1">
                        <td>
                            <div class="layui-form">
                                <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="is_recommendation" name="is_recommendation" value="{$vo.id}" <if condition="$vo.is_recommendation == 1">checked</if> >
                            </div>
                        </td>
                    </if>
                    <if condition="$params.type == 1">
                        <td>
                            <div class="layui-form">
                                <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="is_month_recommend" name="is_month_recommend" value="{$vo.id}" <if condition="$vo.is_month_recommend == 1">checked</if> >
                            </div>
                        </td>
                        <td>
                            <div class="layui-form">
                                <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="is_put"
                                       name="is_put"
                                       value="{$vo.id}"
                                <if condition="$vo.is_put == 1">checked</if>
                                >
                            </div>
                        </td>
                    </if>
                    <td>{$vo.create_time |date="Y-m-d H:i:s"}</td>
                    <td>
                        <if condition="!empty($vo['qr_code'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.qr_code)}');">
                                <img src="{:cmf_get_image_preview_url($vo.qr_code)}" style="height:40px;">
                            </a>
                        </if>
                    </td>
                    <td>
                        <a class="btn btn-xs btn-primary"
                           href="{:url('update',['id'=>$vo['id'],'type'=>$params.type])}">{:lang('EDIT')}</a>
                        <if condition="$params.type == 1">
                        <a class="btn btn-xs btn-info"
                           href="javascript:;" onclick="openClockAction({$vo['id']})">打卡动作</a>
                        </if>
                        <a class="btn btn-xs btn-danger js-ajax-delete"
                           href="{:url('delete',['id'=>$vo['id'],'type'=>$params.type])}">{:lang('DELETE')}</a>
                    </td>

                </tr>
            </foreach>
            </tbody>
        </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });
        //发布不发布
        form.on('switch(is_top)', function (data) {
            setStatus(data.value, 'is_top', this.checked ? 1 : 0)
        });
        //推荐不推荐
        form.on('switch(is_recommendation)', function (data) {
            setStatus(data.value, 'is_recommendation', this.checked ? 1 : 0)
        });
        //展示不展示
        form.on('switch(is_put)', function (data) {
            setStatus(data.value, 'is_put', this.checked ? 1 : 0)
        });
        //本周推荐
        form.on('switch(is_month_recommend)', function (data) {
            setStatus(data.value, 'is_month_recommend', this.checked ? 1 : 0)
        });

        function setStatus(id, type, status) {
            $.ajax({
                url: '{:url(\'setStatus\')}',
                type: "POST",
                data: {id: id, type: type, status: status, cate: 0},
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }

        // 暴露到全局，让onclick可调用
        window.openClockAction = function(activeId) {
            layer.open({
                type: 2,
                title: '打卡动作配置',
                area: ['85%', '85%'],
                content: '{:url("active_clock_action/index")}?active_id=' + activeId,
                btn: false
            });
        };
    });

</script>
</body>
</html>
