<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('sign_list')}">签到列表</a></li>
        <li><a href="{:url('update',['type'=>1,'join_type'=>2])}">添加</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('sign_list')}">
        关键字：
        <input type="text" class="form-control" name="name" style="width: 140px;"
               value="{:input('request.name/s','')}" placeholder="请输入名称">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('sign_list')}">清空</a>

    </form>
    <form method="post" class="js-ajax-form margin-top-20" action="{:url('listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="50">排序</th>
                <th>名称</th>
                <th>赠送积分</th>
                <th>已签到数量</th>
                <th>启用</th>
                <th>添加时间</th>
                <th>小程序码</th>

                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.name}</td>
                    <td>
                        <if condition="$vo.is_clock == 1">
                            {$vo.send_point}
                        </if>
                    </td>
                    <td>{$vo.sign_count}</td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status"
                                   value="{$vo.id}"
                            <if condition="$vo.status == 1">checked</if>
                            >
                        </div>
                    </td>
                    <td>{$vo.create_time |date="Y-m-d H:i:s"}</td>
                    <td>
                        <if condition="!empty($vo['qr_code'])">
                            <a href="javascript:imagePreviewDialog('{:cmf_get_image_preview_url($vo.qr_code)}');">
                                <img src="{:cmf_get_image_preview_url($vo.qr_code)}" style="height:40px;">
                            </a>
                        </if>
                    </td>
                    <td>
                        <a class="btn btn-xs btn-primary"
                           href="{:url('update',['id'=>$vo['id'],'type'=>$vo['type'],'join_type'=>2])}">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-info"
                           href="javascript:;" onclick="openClockAction({$vo['id']})">打卡动作</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete"
                           href="{:url('delete',['id'=>$vo['id'],'type'=>$vo['type']])}">{:lang('DELETE')}</a>
                    </td>

                </tr>
            </foreach>
            </tbody>
        </table>
    </form>

    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer, form = layui.form;
        form.on('switch(status)', function (data) {
            setStatus(data.value, 'status', this.checked ? 1 : 2)
        });

        function setStatus(id, type, status) {
            $.ajax({
                url: '{:url(\'setStatus\')}',
                type: "POST",
                data: {id: id, type: type, status: status, cate: 0},
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }

        // 暴露到全局，让onclick可调用
        window.openClockAction = function(activeId) {
            layer.open({
                type: 2,
                title: '打卡动作配置',
                area: ['85%', '85%'],
                content: '{:url("active_clock_action/index")}?active_id=' + activeId,
                btn: false
            });
        };
    });

</script>
</body>
</html>
