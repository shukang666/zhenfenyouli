<include file="public@header"/>
<style>
    .push-fields {
        font-size: 12px;
        color: #666;
    }
    .push-fields div {
        margin-bottom: 2px;
    }
</style>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('user_list')}">用户提交记录</a></li>
        <li class="active"><a href="{:url('push_list')}">推送管理</a></li>
    </ul>

    <form class="well form-inline margin-top-20" method="get" action="{:url('push_list')}">
        活动：
        <select class="form-control" name="active_id" style="width: 160px;">
            <option value="">全部活动</option>
            <foreach name="active_list" item="name" key="id">
                <option value="{$id}" <if condition="$params.active_id == $id">selected</if>>{$name}</option>
            </foreach>
        </select>

        <input type="hidden" class="export" name="export" value="0">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-success ajax-export" href="javascript:;">导出</a>
        <a class="btn btn-danger" href="{:url('push_list')}">清空</a>
    </form>

    <form method="post" class="js-ajax-form margin-top-20" action="">
        <div class="table-actions">
            <a class="btn btn-primary btn-sm" href="{:url('push_edit', ['active_id'=>$params.active_id])}" onclick="return openPushEdit(this.href)">+ 新建推送</a>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>ID</th>
                <th>活动名称</th>
                <th>打卡次数</th>
                <th>推送标题</th>
                <th>推送内容</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>推送时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.active_name}</td>
                    <td>{$vo.clock_count}次</td>
                    <td>{$vo.push_title}</td>
                    <td class="push-fields">
                        <foreach name="vo.push_fields_arr" item="field">
                            <div><strong>{$field.label|default=''}：</strong>{$field.value|default=''}</div>
                        </foreach>
                    </td>
                    <td>
                        <if condition="$vo.push_status == 1">
                            <span class="label label-success">已推送</span>
                            <else/>
                            <span class="label label-warning">未推送</span>
                        </if>
                    </td>
                    <td>{$vo.create_time_text}</td>
                    <td>{$vo.push_time_text}</td>
                    <td>
                        <if condition="$vo.push_status == 0">
                            <a class="btn btn-xs btn-success" href="javascript:;" onclick="doPush({$vo.id})">发起推送</a>
                            <a class="btn btn-xs btn-primary" href="{:url('push_edit', ['id'=>$vo.id])}" onclick="return openPushEdit(this.href)">编辑</a>
                        </if>
                        <a class="btn btn-xs btn-danger" href="javascript:;" onclick="deletePush({$vo.id})">删除</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    // 打开推送编辑弹窗
    function openPushEdit(url) {
        layer.open({
            type: 2,
            title: '推送配置',
            area: ['700px', '500px'],
            content: url
        });
        return false;
    }

    // 执行推送
    function doPush(pushId) {
        layer.confirm('确定要向已订阅的用户发送推送吗？', {icon: 3, title: '确认推送'}, function(index) {
            $.ajax({
                url: '{:url("active_clock_action/do_push")}',
                type: 'POST',
                data: {push_id: pushId},
                dataType: 'json',
                success: function(res) {
                    if (res.code == 1) {
                        layer.msg(res.msg, {icon: 1}, function() {
                            location.reload();
                        });
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                },
                error: function() {
                    layer.msg('推送失败，请重试', {icon: 2});
                }
            });
            layer.close(index);
        });
    }

    // 删除推送
    function deletePush(pushId) {
        layer.confirm('确定要删除这条推送记录吗？', {icon: 3}, function(index) {
            $.ajax({
                url: '{:url("active_clock_action/push_delete")}',
                type: 'POST',
                data: {id: pushId},
                dataType: 'json',
                success: function(res) {
                    if (res.code == 1) {
                        layer.msg(res.msg, {icon: 1}, function() {
                            location.reload();
                        });
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }
            });
            layer.close(index);
        });
    }

    // 导出数据
    $(".ajax-export").click(function () {
        $(".export").val(1);
        $(".well.form-inline").submit();
        $(".export").val(0);
        return false;
    });
</script>
</body>
</html>
