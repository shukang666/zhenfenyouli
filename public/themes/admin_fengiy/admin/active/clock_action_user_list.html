<include file="public@header"/>
<style>
    .table {
        table-layout: fixed;
    }
    .form-data-cell {
        max-width: 300px;
        word-wrap: break-word;
        white-space: normal;
        font-size: 12px;
    }
</style>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('user_list')}">用户提交记录</a></li>
        <li><a href="{:url('push_list')}">推送管理</a></li>
    </ul>

    <form class="well form-inline margin-top-20" method="get" action="{:url('user_list')}">
        活动：
        <select class="form-control" name="active_id" style="width: 160px;">
            <option value="">全部活动</option>
            <foreach name="active_list" item="name" key="id">
                <option value="{$id}" <if condition="$params.active_id == $id">selected</if>>{$name}</option>
            </foreach>
        </select>

        用户：
        <input type="text" class="form-control" name="keyword" style="width: 140px;"
               value="{$params.keyword}" placeholder="昵称/手机/ID">

        <input type="hidden" class="export" name="export" value="0">
        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-success ajax-export" href="javascript:;">导出</a>
        <a class="btn btn-danger" href="{:url('user_list')}">清空</a>
    </form>

    <form method="post" class="js-ajax-form margin-top-20" action="">
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>ID</th>
                <th>活动名称</th>
                <th>打卡次数</th>
                <th>通知类型</th>
                <th>用户</th>
                <th>手机号</th>
                <th>提交时间</th>
                <th width="300">提交内容</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.active_name}</td>
                    <td>{$vo.clock_count}次</td>
                    <td>{$vo.notify_type_text}</td>
                    <td>{$vo.nickname}({$vo.user_id})</td>
                    <td>{$vo.mobile}</td>
                    <td>{$vo.create_time_text}</td>
                    <td class="form-data-cell">
                        <foreach name="vo.form_data_arr" item="val" key="key">
                            <div><strong>{$key}：</strong>{$val|htmlspecialchars}</div>
                        </foreach>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    // 导出数据
    $(".ajax-export").click(function () {
        $(".export").val(1);
        $(".well.form-inline").submit();
        $(".export").val(0);
        return false;
    });
</script>
</body>
</html>
