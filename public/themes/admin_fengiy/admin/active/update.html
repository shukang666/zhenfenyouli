<include file="public@header"/>
<style type="text/css">
    .pic-list li {
        margin-bottom: 5px;
    }
</style>

</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['type'=>$params.type])}">列表</a></li>
        <notempty name="item.id">
            <li class="active"><a href="">编辑</a></li>
            <else/>
            <li class="active"><a href="{:url('update',['type'=>$params.type])}">添加</a></li>
        </notempty>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('updatePost')}">

        <input type="hidden" value="{$item.id|default=''}" name="id">
        <input type="hidden" value="{$params.type|default=''}" name="type">
        <if condition="$params.type==1">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>分类:</label>
            <div class="col-md-6 col-sm-10">
                <select name="cate_id" class="form-control">
                    <foreach name="cate_list" item="vo">
                        <notempty name="item.cate_id">
                            <option value="{$vo.id}"
                            <if condition="$item.cate_id == $vo.id">selected</if>
                            >{$vo.name}</option>
                            <else/>
                            <option value="{$vo.id}">{$vo.name}</option>
                        </notempty>

                    </foreach>
                </select>
            </div>
        </div>
        </if>



        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>名称:</label>
            <div class="col-md-6 col-sm-10">
                <input style="width: 212px" type="text" class="form-control" name="name"
                       value="{$item.name|default=''}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">图片:</label>
            <div class="col-md-6 col-sm-10">
                <php>  $thumb='thumb';</php>
                <input type="hidden" name="{$thumb}" id="{$thumb}" value="{$item[$thumb]|default=''}">
                <a href="javascript:uploadOneImage('图片上传','#{$thumb}');">
                    <if condition="empty($item[$thumb])">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png"
                             id="{$thumb}-preview"
                             width="135" style="cursor: pointer"/>
                        <else/>
                        <img src="{:cmf_get_image_preview_url($item[$thumb])}"
                             id="{$thumb}-preview"
                             width="135" style="cursor: pointer"/>
                    </if>
                </a>
                <p class="help-block text-danger">建议尺寸:宽690*长326</p>
            </div>

        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>日期:</label>
            <div class="col-md-2 col-sm-10">
                <input type="date" class="form-control" name="date"
                       value="{$item.date|default=''}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>时间类型:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="day_type"
                       value="{$item.day_type|default=''}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>地区范围:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="area_range"
                       value="{$item.area_range|default=''}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>详情:</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="content" name="content">{$item.content|default=''}</script>
            </div>
        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("SAVE")}</button>
            <a class="btn btn-default" href="{:url('index',['type'=>$params.type])}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    var editorURL = GV.WEB_ROOT;
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('content');
        try {
            editorcontent.sync();
        } catch (err) {
        }

    });
</script>
</body>
</html>
