<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">照片审核</a></li>
        <li class="active"><a href="{:url('report_index')}">周期周报</a></li>
    </ul>
    <p class="margin-top-20 text-muted">周报由脚本生成：<code>php data/generate_qxl_photo_weekly_report.php [active_id] [period_key]</code></p>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th>ID</th>
            <th>活动</th>
            <th>周期</th>
            <th>标题</th>
            <th>首页推荐</th>
            <th>生成时间</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.active_id}</td>
                <td>{$vo.period_key}</td>
                <td>{$vo.title}</td>
                <td><if condition="$vo.is_home_featured == 1">是<else/>否</if></td>
                <td>{:date('Y-m-d H:i',$vo.create_time)}</td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
</body>
</html>
