				<div class="col-md-6 col-sm-10">
					<div style="display: flex">
						<input type="radio" checked name="indate_cate" value="1"> <span class="set_text">获取后</span> <input type="text" class="form-control"  name="indate_day" style="width: 100px"><span class="set_text">天有效</span>

	<script src="__STATIC__/js/admin.js"></script>
	<script>
		layui.use(['layer', 'form'], function(){
			var layer = layui.layer,form = layui.form;

			var type = $("#type").val();
			var discount_type = $("#discount_type").val();
			setTypeDisplay(type);
			setDiscountTypeDisplay(discount_type);

			form.on('select(type)', function(data) {
				console.log(1)
				console.log(data);
				setTypeDisplay(data.value);
			})

			form.on('select(discount_type)', function(data) {
				console.log(data);
				setDiscountTypeDisplay(data.value);
			})

			function setTypeDisplay(this_id){
				$('.show_type').css('display','none');
				$('.show_type_'+this_id).css('display','block');
			}

			function setDiscountTypeDisplay(this_id){
				$('.show_discount_type').css('display','none');
				$('.show_discount_type_'+this_id).css('display','block');
			}

		});
	</script>
