<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('coupon/selectList')}">领取列表</a></li>
    </ul>
   <form class="well form-inline margin-top-20" method="get" action="{:url('coupon/selectList')}">
       关键字：
        <input type="text" class="form-control" name="keyword" style="width: 120px;" value="{:input('request.keyword/s','')}" placeholder="请输入关键字">

       &nbsp;&nbsp;状态:
       <div class="form-group layui-form">

           <div class="layui-form-item" style="margin-bottom: 0 !important;">
               <div class="col-md-12" style="z-index: 2000 !important;">
                   <div class="layui-inline" style="width: 100px;">
                       <select name="used" lay-verify="used" lay-search lay-filter="used" >
                           <option value = "-1" class="form-control">全部</option>
                           <option value = "0" class="form-control" <if condition="$used == 0">selected</if>>待使用</option>
                           <option value = "1" class="form-control" <if condition="$used == 1">selected</if>>已使用</option>
                           <option value = "2" class="form-control" <if condition="$used == 2">selected</if>>已过期</option>
                       </select>
                   </div>
               </div>
           </div>
       </div>


       &nbsp;&nbsp;&nbsp;<input type="submit" class="btn btn-primary" value="搜索" />
        <a class="btn btn-danger" href="{:url('coupon/selectList')}">清空</a>
    </form>

        <form class="js-ajax-form" action="" method="post">
        <div>
            <button class="btn btn-danger btn-sm js-ajax-submit " type="submit"
                    data-action="{:url('delete_all',array('no'=>1))}" data-subcheck="true">批量删除
            </button>

        </div>
    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>     <th width="16"><label><input type="checkbox" class="js-check-all" data-direction="x"
                                         data-checklist="js-check-x"></label></th>

            <th width="50">ID</th>
            <th>用户信息</th>
            <th>名称</th>
            <th>有效期</th>
            <th>金额</th>
            <th>状态</th>
            <th>领取时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>          <td><input type="checkbox" class="js-check" data-yid="js-check-y" data-xid="js-check-x"
                           name="ids[]" value="{$vo.id}"></td>


                <td>{$vo.id}</td>
                <td>{$vo.nickname}（{$vo.mobile}）</td>
                <td>{$vo.name}</td>
                <td>{$vo.start_time|date="Y-m-d"}至{$vo.end_time|date="Y-m-d"}</td>

                <td>满{$vo.full_amount}减{$vo.amount}</td>
                <td>
                    <if condition="$vo.used == 0">待使用
                        <elseif condition="$vo.used == 1" />已使用
                        <elseif condition="$vo.used == 2" />已过期
                    </if>
                </td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('select_delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
