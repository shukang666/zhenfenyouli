<include file="public@header" />
</head>
<body>
	<div class="wrap">
		<ul class="nav nav-tabs">
			<li class="active"><a href="">编辑优惠券</a></li>
		</ul>
		<form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('edit')}">


<!--			<div class="form-group show_div">-->
<!--				<label class="col-sm-2 control-label"><span class="form-required">*</span>优惠券类型:</label>-->
<!--				<div class="col-md-6 col-sm-10">-->
<!--					<select name="discount_type" class="form-control" id="discount_type">-->
<!--						<foreach name="discount_type_list" item="vo" key="key">-->
<!--							<option value = "{$key}" <if condition="$data.discount_type == $key">selected</if>>{$vo}</option>-->
<!--						</foreach>-->
<!--					</select>-->
<!--				</div>-->
<!--			</div>-->



			<div class="form-group " >
				<label class="col-sm-2 control-label"><span class="form-required">*</span>金额:</label>
				<div class="col-md-6 col-sm-10">
					<div class="layui-form-item">

						<div class="layui-inline">
							<div class="layui-form-mid"><b></b>满</div>
							<div class="layui-input-inline" style="width: 80px;">
								<input type="number" name="full_amount"  autocomplete="off" class="layui-input" required value="{$data.full_amount}">
							</div>
							<div class="layui-form-mid"><b></b>元减</div>
							<div class="layui-input-inline" style="width: 100px;">
								<input type="number" name="amount" autocomplete="off" class="layui-input" required value="{$data.amount}">
							</div>
							<div class="layui-form-mid"><b></b>元</div>
						</div>
					</div>
				</div>
			</div>



			<div class="form-group">
				<label class="col-sm-2 control-label"><span class="form-required">*</span>适用时间限制:</label>
				<div class="col-md-6 col-sm-10">
					<div style="display: flex">
						<input type="radio" name="indate_cate" value="1" <if condition="$data.indate_cate == 1">checked</if>> <span class="set_text">获取后</span> <input type="text" class="form-control"  name="indate_day" style="width: 100px" value="{$data.indate_day}"><span class="set_text">天有效</span>
					</div>
					<div style="display: flex;margin-top: 5px" >
						<input type="radio" name="indate_cate" value="2" <if condition="$data.indate_cate == 2">checked</if>>
						<span class="set_text">时间范围: </span><input style="width: 200px" type="date" class="form-control" name="start_time" value="{$data.start_time}"><span class="set_text">至</span><input style="width: 200px" type="date" class="form-control" name="end_time"  value="{$data.end_time}">
					</div>
				</div>
			</div>
			<style>
				.set_text{
					margin-top: 8px;
					margin-right: 10px;
					margin-left: 10px;
				}
			</style>

			<div class="form-group">
				<label  class="col-sm-2 control-label"><span class="form-required">*</span>优惠券名称:</label>
				<div class="col-md-6 col-sm-10">
					<input type="text" class="form-control"  name="name" required value="{$data.name}">
				</div>
			</div>
			<div class="form-group">
				<label  class="col-sm-2 control-label"><span class="form-required">*</span>数量:</label>
				<div class="col-md-6 col-sm-10">
					<input type="number" class="form-control" name="count" required value="{$data.count}">
				</div>
			</div>

			<div class="form-group">
				<label  class="col-sm-2 control-label"><span class="form-required">*</span>限领数量:</label>
				<div class="col-md-6 col-sm-10">
					<input type="number" class="form-control" name="limit" required value="{$data.limit}">
				</div>
			</div>

			<input type="hidden" class="form-control" name="id" placeholder="" value="{$data.id}">
			<div class="form-group">
				<div class="col-sm-offset-2 col-sm-10">
					<button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
				</div>
			</div>
		</form>
	</div>
	<script src="__STATIC__/js/admin.js"></script>
	<script>
		layui.use(['layer', 'form'], function(){
			var layer = layui.layer,form = layui.form;

			var type = $("#type").val();
			var discount_type = $("#discount_type").val();
			setTypeDisplay(type);
			setDiscountTypeDisplay(discount_type);

			form.on('select(type)', function(data) {
				console.log(1)
				console.log(data);
				setTypeDisplay(data.value);
			})

			form.on('select(discount_type)', function(data) {
				console.log(data);
				setDiscountTypeDisplay(data.value);
			})

			function setTypeDisplay(this_id){
				$('.show_type').css('display','none');
				$('.show_type_'+this_id).css('display','block');
			}

			function setDiscountTypeDisplay(this_id){
				$('.show_discount_type').css('display','none');
				$('.show_discount_type_'+this_id).css('display','block');
			}

		});
	</script>
</body>
</html>
