    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
<!--            <th>适用范围</th>-->
<!--            <th>优惠券类型</th>-->
            <th>名称</th>
            <th>商家</th>
<!--            <th>数量</th>-->
            <th>领取数量</th>
            <th>金额</th>
            <th>有效期</th>
            <th>发布</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
<!--                <td>{$vo.type_name}</td>-->
<!--                <td>{$vo.discount_type_name}</td>-->
                <td>{$vo.name}</td>
                <td>{$vo.shop_name}</td>
<!--                <td>{$vo.count}</td>-->
                <td>{$vo.select_count}</td>
                <td>
                    <if condition="$vo.discount_type == 1">
                        满{$vo.full_amount}元减{$vo.amount}元
                        <elseif condition="$vo.discount_type == 2" />
                        {$vo.amount}元
                        <elseif condition="$vo.discount_type == 3" />
                        {$vo.discount}折
                    </if>

                </td>
                <td>
                    <if condition="$vo.indate_cate == 1">
                        {$vo.indate_day}天内有效
                        <else/>
                        {$vo.start_time|date="Y-m-d"}至{$vo.end_time|date="Y-m-d"}
                    </if>
                </td>
                <td>
                    <div class="layui-form">
                        <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                    </div>
                </td>

                <td>
                    <a class="btn btn-xs btn-primary" href="javascript:openIframeLayer('{:url('edit',array('id'=>$vo['id']))}','',{area:['70%','70%']});">{:lang('EDIT')}</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;

        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });

        function setStatus(id,field,status){
            $.ajax({
                url:'/admin/coupon/setCoupon',
                type:"POST",
                data: {id:id,field:field,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });



</script>
