<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index',['type'=>$params.type])}">列表</a></li>
        <li><a href="{:url('update',['type'=>$params.type])}">添加</a></li>
        <li class="active"><a href="{:url('addMany',['type'=>$params.type])}">导入</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('addMany')}">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>上传表格:</label>
            <div class="col-md-6 col-sm-10">
                <input type="file" class="form-control" name="myfile" value="" required>
            </div>
            <if condition="$params.type == 1">
                <a href="{$domain}/upload/医疗机构导入模版.xlsx">下载模板</a>
            </if>

        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <input type="hidden" name="type" value="{$params.type}"/>
            <button type="submit" class="btn btn-primary js-ajax-submit">导入</button>


        </div>
    </form>
</div>
</tbody>

<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
