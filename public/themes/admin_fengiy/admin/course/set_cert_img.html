<include file="public@header"/>
<!-- 多图上传引入开始-->
<script type="text/html" id="photos-item-tpl">
    <li  id="saved-image{id}" style="cursor:pointer;margin-bottom: 5px;margin-right: 10px;">
        <input id="photo-{id}" type="hidden" name="photos[]" value="{filepath}">
        <input class="form-control" id="photo-{id}-name" type="hidden" name="photo_names[]" value="{name}"
               style="width: 200px;" title="图片名称">
        <img id="photo-{id}-preview" src="{url}" style="height:80px;width: 80px;" >
        <div>
            <a href="javascript:uploadOneImage('图片上传','#photo-{id}');">替换</a>
            <a href="javascript:(function(){$('#saved-image{id}').remove();})();">移除</a>
        </div>
    </li>
</script>
<!-- 多图上传引入结束-->
</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="">证书设置</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('setCertImg')}">


        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>60分证书:</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="thumb_60" id="thumb_60" value="{$data.thumb_60|default=''}">
                <a href="javascript:uploadOneImage('图片上传','#thumb_60');">
                    <notempty name="data.thumb_60">
                        <img src="{:cmf_get_image_preview_url($data.thumb_60)}" id="thumb_60-preview" width="135" style="cursor: hand"/>
                    <else />
                        <img src="__TMPL__/public/assets/images/default-image.png" id="thumb_60-preview" width="135" style="cursor: hand"/>
                    </notempty>
                </a>
                <input type="button" class="btn btn-sm" onclick="$('#thumb_60-preview').attr('src','__TMPL__/public/assets/images/default-image.png');$('#thumb_60').val('');return false;" value="取消图片">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>90分证书:</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="thumb_90" id="thumb_90" value="{$data.thumb_90|default=''}">
                <a href="javascript:uploadOneImage('图片上传','#thumb_90');">
                    <notempty name="data.thumb_90">
                        <img src="{:cmf_get_image_preview_url($data.thumb_90)}" id="thumb_90-preview" width="135" style="cursor: hand"/>
                        <else />
                        <img src="__TMPL__/public/assets/images/default-image.png" id="thumb_90-preview" width="135" style="cursor: hand"/>
                    </notempty>
                </a>
                <input type="button" class="btn btn-sm" onclick="$('#thumb_90-preview').attr('src','__TMPL__/public/assets/images/default-image.png');$('#thumb_90').val('');return false;" value="取消图片">
            </div>
        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("ADD")}</button>
            <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
        </div>
    </form>

</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
