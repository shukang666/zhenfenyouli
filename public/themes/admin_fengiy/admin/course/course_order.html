<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('courseOrder')}">课程订单列表</a></li>
    </ul>

    <form class="well form-inline margin-top-20 layui-form" method="get" action="{:url('courseOrder')}" style="display: flex">

        <div>
            <span>关键字：</span>
            <div class="layui-inline">
                <input type="text" class="form-control" name="keyword"  value="{:input('request.keyword/s','')}" placeholder="关键字">
            </div>
        </div>

        <div style="margin-left: 10px">
            <span>时间：</span>
            <div class="layui-inline" id="create-time">
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="text" autocomplete="off" id="create-startDate" class="layui-input" name="start_time" value="{:input('request.start_time')}" placeholder="开始日期">
                </div>
                -
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="text" autocomplete="off" id="create-endDate" class="layui-input" name="end_time" value="{:input('request.end_time')}" placeholder="结束日期">
                </div>
            </div>
        </div>

        <div style="margin-left: 10px">
            <input type="submit" class="btn btn-primary" value="搜索" />
            <a class="btn btn-danger" href="{:url('courseOrder')}">清空</a>
        </div>
    </form>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>用户</th>
            <th width="800">课程标题</th>
            <th>价格</th>
            <th width="200">购买时间</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname}({$vo.mobile})</td>
                <td>{$vo.title}</td>
                <td>{$vo.price}</td>
                <td>{$vo.pay_time}</td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider','laydate'], function(){
        let layer = layui.layer,form = layui.form,laydate = layui.laydate;
        //日期范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });

        //发布不发布
        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });

        function setStatus(id,field,status){
            $.ajax({
                url:'/admin/activity/setStatus',
                type:"POST",
                data: {id:id,field:field,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

    function check(id){
        layer.confirm('是否确认审核通过？', {
            btn: ['通过','拒绝'] //按钮
        }, function(){
            doCheck(id,1);
        }, function(){
            layer.prompt({title: '请说明拒绝原因', formType: 2}, function(text, index){
                doCheck(id,2,text);
            });
        });
    }

    function doCheck(id,check_status,check_reason){
        $.ajax({
            url:'/admin/activity/check',
            type:"POST",
            data: {id:id,check_status:check_status,check_reason:check_reason},
            success: function(res) {
                if(res.code === 1){
                    layer.msg(res.msg, {icon:1});
                    setTimeout(function(){
                        location.reload();
                    },1000);

                }else{
                    layer.msg(res.msg, {icon: 7});
                }
            }
        });
    }

</script>
</body>
</html>
