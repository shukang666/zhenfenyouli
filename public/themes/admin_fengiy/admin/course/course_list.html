<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('course/courseList')}">视频列表</a></li>
        <li><a href="{:url('course/addCourse')}">添加视频</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('course/courseList')}">
        视频名称：
        <input type="text" class="form-control" name="title"  value="{:input('request.title/s','')}" placeholder="请输入视频名称">

        <input type="submit" class="btn btn-primary" value="搜索" />
        <a class="btn btn-danger" href="{:url('course/courseList')}">清空</a>
    </form>
    <form method="post" class="js-ajax-form margin-top-20" action="{:url('course/listOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="50">排序</th>
                <th width="50">ID</th>
                <th>视频名称</th>
                <th>主图</th>
                <th>时间</th>
                <th>查看</th>
                <th>上架</th>
                <th>添加时间</th>
                <th width="250">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.title}</td>
                    <td>
                        <notempty name="vo.thumb">
                            <img width="25" height="25" src="{:cmf_get_asset_url($vo.thumb)}" onclick="parent.imagePreviewDialog(this.src);"/>
                        </notempty>
                    </td>
                    <td>
                        <notempty name="vo.duration">
                            {$vo.show_duration}
                            <else />
                            正在计算时长...
                        </notempty>
                    </td>
                    <td><a href="{$vo.media}" target="_blank">查看</a></td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
                    <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                    <td>
                        <a class="btn btn-xs btn-info" href="javascript:parent.openIframeLayer('{:url('question/index',array('pid'=>$vo['id']))}','',{area:['90%','90%']});">题目</a>
                        <a class="btn btn-xs btn-success" href="javascript:parent.openIframeLayer('{:url('course/answer',array('exam_id'=>$vo['id']))}','',{area:['90%','90%']});">答题记录</a>
                        <a class="btn btn-xs btn-primary" href="javascript:parent.openIframeLayer('{:url('editCourse',array('id'=>$vo['id']))}','',{area:['70%','70%']});">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('course/deleteCourse',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;

        //首页显示
        form.on('switch(status)', function(data){
            var status = 2;
            var id = data.value;
            if(this.checked){
                status = 1;
            }
            $.ajax({
                url:'/admin/course/setCourseStatus',
                type:"POST",
                data: {id:id,type:1,status:status},
                success: function(res) {
                    //console.log(res);
                    if(res.code==1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        });

        form.on('switch(is_hot)', function(data){
            var status = 0;
            var id = data.value;
            if(this.checked){
                status = 1;
            }
            $.ajax({
                url:'/admin/course/setCourseStatus',
                type:"POST",
                data: {id:id,type:2,status:status},
                success: function(res) {
                    //console.log(res);
                    if(res.code==1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        });

    });



</script>
</body>
</html>
