<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('course/chapterList',array('id'=>$course_id))}">章节列表</a></li>
        <li><a href="{:url('course/addChapter',array('course_id'=>$course_id))}">添加章节</a></li>
    </ul>
    <form method="post" class="js-ajax-form margin-top-20" action="{:url('course/chapterListOrder')}">
        <div class="table-actions">
            <button class="btn btn-primary btn-sm js-ajax-submit" type="submit">{:lang('SORT')}</button>
        </div>
        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th width="50">排序</th>
                <th width="50">ID</th>
                <th>章节名称</th>
                <th>链接</th>
                <th>浏览次数</th>
                <th>上线</th>
                <th width="320">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>
                        <input name="list_orders[{$vo.id}]" class="input-order" type="text" value="{$vo.list_order}">
                    </td>
                    <td>{$vo.id}</td>
                    <td>{$vo.name}</td>
                    <td><a href="{$vo.media}" target="_blank">查看</a></td>
                    <td>{$vo.views}</td>
                    <td>
                        <div class="layui-form">
                            <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
                    <td>
                        <a class="btn btn-xs btn-primary" href="{:url('course/editChapter',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('course/deleteChapter',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;

        //首页显示
        form.on('switch(status)', function(data){
            var status = 2;
            var id = data.value;
            if(this.checked){
                status = 1;
            }
            $.ajax({
                url:'/admin/course/setChapterStatus',
                type:"POST",
                data: {id:id,type:1,status:status},
                success: function(res) {
                    //console.log(res);
                    if(res.code==1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        });
    });



</script>
</body>
</html>
