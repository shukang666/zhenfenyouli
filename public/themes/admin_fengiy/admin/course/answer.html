<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('answer',['exam_id'=>$exam_id])}">答题记录</a></li>
    </ul>

    <form class="well form-inline margin-top-20 layui-form" method="get" action="{:url('answer')}" style="display: flex;flex-wrap: wrap">

        <input type="hidden" name="exam_id" value="{$exam_id}">

        <div>
            <span>关键字：</span>
            <div class="layui-inline">
                <input type="text" class="form-control" name="keyword"  value="{:input('request.keyword/s','')}" placeholder="关键字">
            </div>
        </div>



        <div style="margin-left: 10px">
            <input type="submit" class="btn btn-primary" value="搜索" />
            <a class="btn btn-danger" href="{:url('answer',['exam_id'=>$exam_id])}">清空</a>
            <notempty name="exam_id">
<!--                <a class="btn btn-success" href="{:url('outAnswer',['keyword'=>$keyword,'shop_id'=>$shop_id,'exam_id'=>$exam_id])}">导出</a>-->
            </notempty>
        </div>
    </form>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
            <th>用户</th>
            <th>答题数</th>
<!--            <th>正确数</th>-->
            <th>得分</th>
            <th width="200">答题时间</th>
            <th width="150">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.nickname??$vo.true_name}({$vo.mobile})</td>
                <td>{$vo.total_num}</td>
<!--                <td>{$vo.right_num}</td>-->
                <td>{$vo.score}</td>
                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <a class="btn btn-xs btn-success" href="javascript:parent.openIframeLayer('{:url('course/answerLog',array('answer_id'=>$vo['id']))}','答题记录详情',{area:['60%','80%']});">详情</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('answer_delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>

                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider','laydate'], function(){
        let layer = layui.layer,form = layui.form,laydate = layui.laydate;
        //日期范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });
    });
</script>
</body>
</html>
