<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('course/viewDetail',array('id'=>$id))}">播放详情</a></li>
    </ul>

        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>章节</th>
                <th>总时长</th>
                <th>观看时长</th>
                <th>进度</th>
                <th>最后观看时间</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.name}</td>
                    <td>{$vo.duration}</td>
                    <td>{$vo.play_time_str}</td>
                    <td>
                        <if condition="$vo.played == 1">已看完<else />{$vo.per}</if>
                    </td>
                    <td>{$vo.last_time|date="Y-m-d H:i:s"}</td>
                </tr>
            </foreach>
            </tbody>
        </table>

    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form'], function(){
        var layer = layui.layer,form = layui.form;

        //首页显示
        form.on('switch(status)', function(data){
            var status = 2;
            var id = data.value;
            if(this.checked){
                status = 1;
            }
            $.ajax({
                url:'/admin/course/setCourseStatus',
                type:"POST",
                data: {id:id,type:1,status:status},
                success: function(res) {
                    //console.log(res);
                    if(res.code==1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        });
    });



</script>
</body>
</html>
