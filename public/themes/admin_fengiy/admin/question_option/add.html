<include file="public@header"/>
<script type="text/html" id="image-item-tpl">
    <li id="saved-image{id}">
        <input id="image-{id}" type="hidden" name="photos[]" value="{filepath}">
        <!--        <input class="form-control" id="image-{id}-name" type="text" name="image_names[]" value="{name}"-->
        <!--               style="width: 200px;" title="图片名称">-->
        <img id="image-{id}-preview" src="{url}" style="height:34px;width: 44px;"
             onclick="imagePreviewDialog(this.src);">
        <a class="btn btn-default" href="javascript:uploadOneImage('图片上传','#image-{id}');"><i class="fa fa-upload fa-fw"></i></a>
        <a class="btn btn-danger" href="javascript:(function(){$('#saved-image{id}').remove();})();"><i class="fa fa-trash fa-fw"></i></a>
        <a class="btn btn-success" href="javascript:(function(){$('#saved-image{id}').before($('#saved-image{id}').next());})();"><i class="fa fa-arrow-down fa-fw"></i></a>
    </li>
</script>
</head>
<body>
<div class="wrap js-check-wrap">

    <ul class="nav nav-tabs">
        <li><a href="{:url('index',['q_id'=>$q_id,'problem_type'=>$problem_type])}">选项列表</a></li>
        <li class="active"><a href="{:url('add',['q_id'=>$q_id,'problem_type'=>$problem_type])}">添加</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20 layui-form" action="{:url('add')}">

        <input type="hidden" name="q_id" value="{$q_id}">

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>选项序号:</label>
            <div class="col-md-6 col-sm-10" style="z-index: 9999">
                <select name="letter" class="form-control" lay-search>
                    <foreach name="letter_list" item="vo">
                        <option value = "{$vo}">{$vo}</option>
                    </foreach>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>选项内容:</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="option" value="" required>
            </div>
        </div>

      <!--  <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>选项内容:</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="option" name="option"></script>
            </div>
        </div>-->

        <if condition="$problem_type neq 1">
            <div class="form-group">
                <label class="col-sm-2 control-label"><span class="form-required">*</span>正确答案:</label>
                <div class="col-md-6 col-sm-10">
                    <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="true_answer" name="true_answer" value="1">
                </div>
            </div>

            <else/>
            <div class="form-group">
                <label class="col-sm-2 control-label"><span class="form-required">*</span>正确答案:</label>
                <div class="col-md-6 col-sm-10">
                    <input type="checkbox" lay-skin="switch" lay-text="是|否" lay-filter="true_answer" name="true_answer" value="1">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label"><span class="form-required">*</span>分值:</label>
                <div class="col-md-6 col-sm-10">
                    <input type="number" class="form-control" name="score" value="" required>
                </div>
            </div>

        </if>

        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary js-ajax-submit">{:lang("ADD")}</button>
            <a class="btn btn-default" href="{:url('index',['q_id'=>$q_id,'problem_type'=>$problem_type])}">{:lang('BACK')}</a>
        </div>
    </form>

</div>

    //编辑器路径定义
    var editorURL = GV.WEB_ROOT;
</script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {

        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('content');
        try {
            editorcontent.sync();
        } catch (err) {
        }

        option = new baidu.editor.ui.Editor();
        option.render('option');
        try {
            option.sync();
        } catch (err) {
        }


    });

</script>
