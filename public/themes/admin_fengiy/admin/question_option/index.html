<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index',['q_id'=>$q_id,'problem_type'=>$problem_type])}">选项列表</a></li>
        <li><a href="{:url('add',['q_id'=>$q_id,'problem_type'=>$problem_type])}">添加</a></li>
    </ul>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th width="50">ID</th>
<!--            <th width="50">编号</th>-->
            <th>选项</th>
         <!--   <th>图片</th>-->
            <if condition="$problem_type neq 1">
                <th>正确答案</th>
                <else/>
                <th>分值</th>
            </if>

<!--         -->
            <th width="200">添加时间</th>
            <th width="150">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
<!--                <td>{$vo.sn}</td>-->
                <td>
                    <span > {$vo.letter} . {$vo.option}</span>
                </td>
                <if condition="$problem_type neq 1">
                    <td>
                        <if condition="$vo.true_answer == 1">是<else />否</if>
                    </td>
                    <else/>
                    <td>{$vo.score}</td>
                </if>

<!--              -->
<!--                <td>-->
<!--                    <notempty name="vo.photos">-->
<!--                        <foreach name="vo.photos" item="item">-->
<!--                            <img width="25" height="25" src="{:cmf_get_asset_url($item)}" onclick="parent.imagePreviewDialog(this.src);"/>-->
<!--                        </foreach>-->
<!--                    </notempty>-->
<!--                </td>-->

                <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                <td>
                    <a class="btn btn-xs btn-primary" href="{:url('edit',array('id'=>$vo['id'],'problem_type'=>$problem_type))}">{:lang('EDIT')}</a>
                    <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider','laydate'], function(){
        let layer = layui.layer,form = layui.form,laydate = layui.laydate;
        //日期范围
        laydate.render({
            elem: '#create-time',
            range: ['#create-startDate', '#create-endDate'],
            rangeLinked: true
        });

        //发布不发布
        form.on('switch(status)', function(data){
            setStatus(data.value,'status',this.checked ? 1 : 2)
        });

        function setStatus(id,field,status){
            $.ajax({
                url:'/admin/questionOption/setStatus',
                type:"POST",
                data: {id:id,field:field,status:status},
                success: function(res) {
                    if(res.code === 1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        }
    });

</script>
</body>
</html>
