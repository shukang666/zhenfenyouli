<include file="public@header" />
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">列表</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="get" action="{:url('index')}">
        关键字：
        <input type="text" class="form-control" name="keyword" style="width: 200px;" value="{:input('request.keyword/s','')}" placeholder="姓名/手机号">

        &nbsp;&nbsp;审核状态:
        <div class="form-group layui-form">

            <div class="layui-form-item" style="margin-bottom: 0 !important;">
                <div class="col-md-12" style="z-index: 2000 !important;">
                    <div class="layui-inline" style="width: 100px;">
                        <select name="check_status" lay-verify="check_status" lay-search lay-filter="check_status" >
                            <option value = "-1" class="form-control">全部</option>
                            <option value = "0" class="form-control" <if condition="$check_status == 0">selected</if>>待审核</option>
                            <option value = "1" class="form-control" <if condition="$check_status == 1">selected</if>>已通过</option>
                            <option value = "2" class="form-control" <if condition="$check_status == 2">selected</if>>已拒绝</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <input type="submit" class="btn btn-primary" value="搜索" style="margin-left: 25px"/>
        <a class="btn btn-danger" href="{:url('index')}">清空</a>
    </form>

        <table class="table table-hover table-bordered margin-top-20">
            <thead>
            <tr>
                <th>ID</th>
                <th>用户</th>
                <th>姓名</th>
                <th>手机号</th>
                <th>余额</th>
                <th>身份证</th>
                <th>状态</th>
                <th>审核状态</th>
                <th>认证时间</th>
                <th width="200">{:lang('ACTIONS')}</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.nickname}，ID:{$vo.user_id}</td>
                    <td>{$vo.true_name}</td>
                    <td>{$vo.mobile}</td>
                    <td>{$vo.balance}</td>
                    <td>
                        <notempty name="vo.card_f">
                             <img width="25" height="25" src="{:cmf_get_asset_url($vo.card_f)}" onclick="parent.imagePreviewDialog(this.src);"/>
                        </notempty>
                        <notempty name="vo.card_b">
                            <img width="25" height="25" src="{:cmf_get_asset_url($vo.card_b)}" onclick="parent.imagePreviewDialog(this.src);"/>
                        </notempty>
                    </td>
                    <td>
                        <div class="layui-form" style="margin-bottom: 10px">
                            <input type="checkbox" lay-skin="switch" lay-text="正常|禁用" lay-filter="status" name="status" value="{$vo.id}" <if condition="$vo.status == 1">checked</if>>
                        </div>
                    </td>
                    <td>
                        {$vo.check_status_name}
                        <if condition="$vo.check_status == 2">
                            <notempty name="vo.check_reason">
                                <span style="color: red">（{$vo.check_reason}）</span>
                            </notempty>
                        </if>

                    </td>
                    <td>{$vo.create_time|date="Y-m-d H:i:s"}</td>
                    <td>

                        <if condition="$vo.check_status == 0">
                            <div class="layui-btn layui-btn-xs" onclick="check({$vo.id})">审核</div>
                        </if>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delete',array('id'=>$vo['id']))}">{:lang('DELETE')}</a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>

    <div class="pagination">{$page}</div>

</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer', 'form','slider'], function(){
        var layer = layui.layer,form = layui.form;

        form.on('switch(status)', function(data){

            var status = 2;
            var id = data.value;
            if(this.checked){
                status = 1;
            }
            $.ajax({
                url:'/admin/manager/setStatus',
                type:"POST",
                data: {id:id,status:status,type:1},
                success: function(res) {
                    //console.log(res);
                    if(res.code==1){
                        layer.msg(res.msg, {icon:1});
                    }else{
                        layer.msg(res.msg, {icon: 7});
                    }
                }
            });
        });
    });


    function check(id){
        layer.confirm('是否确认审核通过？', {
            btn: ['通过','拒绝'] //按钮
        }, function(){
            doCheck(id,1);
        }, function(){
            layer.prompt({title: '请说明拒绝原因', formType: 2}, function(text, index){
                doCheck(id,2,text);
            });
        });
    }

    function doCheck(id,check_status,check_reason){

        $.ajax({
            url:'/admin/manager/check',
            type:"POST",
            data: {id:id,check_status:check_status,check_reason:check_reason},
            success: function(res) {
                if(res.code==1){
                    layer.msg(res.msg, {icon:1});
                    setTimeout(function(){
                        location.reload();
                    },1000);

                }else{
                    layer.msg(res.msg, {icon: 7});
                }
            }
        });

    }

</script>
</body>
</html>
