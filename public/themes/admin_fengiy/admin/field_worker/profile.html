<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外勤工作台 - 个人信息</title>
    <link rel="stylesheet" href="__STATIC__/font-awesome/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #2fb74c 0%, #1a8a32 100%);
            color: #fff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .header .back {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.18);
            font-size: 18px;
        }
        .header .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .header .user-info a {
            color: #fff;
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            font-size: 12px;
        }
        .main { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title i { color: #2fb74c; }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f3f3;
            font-size: 15px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: #888; }
        .info-row .value { color: #333; font-weight: 500; text-align: right; max-width: 70%; word-break: break-all; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            background: #fafafa;
            outline: none;
        }
        .form-control:focus { border-color: #2fb74c; background: #fff; }
        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(141deg, #A4DB88 0%, #18AF38 100%);
            border: none;
            border-radius: 24px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            display: none;
            max-width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>
        <a class="back" href="{:url('admin/FieldWorker/index')}" title="返回工作台"><i class="fa fa-angle-left"></i></a>
        个人信息
    </h1>
    <div class="user-info">
        <span>{$workerName}</span>
        <a href="{:url('admin/FieldWorker/logout')}"><i class="fa fa-sign-out"></i> 退出</a>
    </div>
</div>

<div class="main">
    <div class="card">
        <div class="card-title"><i class="fa fa-id-card-o"></i> 账号资料</div>
        <div class="info-row">
            <span class="label">登录账号</span>
            <span class="value">{$user.user_login|default='—'}</span>
        </div>
        <div class="info-row">
            <span class="label">昵称</span>
            <span class="value">
                <notempty name="user.user_nickname">{$user.user_nickname}<else/>—</notempty>
            </span>
        </div>
        <div class="info-row">
            <span class="label">手机号</span>
            <span class="value">
                <notempty name="user.mobile">{$user.mobile}<else/>—</notempty>
            </span>
        </div>
        <div class="info-row">
            <span class="label">邮箱</span>
            <span class="value">
                <notempty name="user.user_email">{$user.user_email}<else/>—</notempty>
            </span>
        </div>
        <div class="info-row">
            <span class="label">上次登录</span>
            <span class="value">
                <if condition="$user.last_login_time gt 0">
                    {$user.last_login_time|date='Y-m-d H:i',###}
                    <else/>—
                </if>
            </span>
        </div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fa fa-lock"></i> 修改密码</div>
        <form id="pwdForm">
            <div class="form-group">
                <label>原密码</label>
                <input type="password" class="form-control" id="old_password" autocomplete="current-password" placeholder="请输入原密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" class="form-control" id="password" autocomplete="new-password" placeholder="至少 6 位">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" class="form-control" id="re_password" autocomplete="new-password" placeholder="再输入一次新密码">
            </div>
            <button type="submit" class="btn-submit" id="btnPwd">保存新密码</button>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="__STATIC__/js/jquery.js"></script>
<script>
$(function() {
    $('#pwdForm').on('submit', function(e) {
        e.preventDefault();
        var oldPassword = $.trim($('#old_password').val());
        var password = $('#password').val();
        var rePassword = $('#re_password').val();
        if (!oldPassword) { showToast('请输入原密码'); return; }
        if (!password) { showToast('请输入新密码'); return; }
        if (password.length < 6) { showToast('新密码至少 6 位'); return; }
        if (password !== rePassword) { showToast('两次输入的新密码不一致'); return; }

        $('#btnPwd').prop('disabled', true).text('保存中...');
        $.ajax({
            type: 'POST',
            url: '{:url("admin/FieldWorker/changePassword")}',
            data: {
                old_password: oldPassword,
                password: password,
                re_password: rePassword
            },
            dataType: 'json',
            success: function(res) {
                if (res.code == 1) {
                    showToast(res.msg || '密码已修改');
                    $('#pwdForm')[0].reset();
                } else {
                    showToast(res.msg || '修改失败');
                }
                $('#btnPwd').prop('disabled', false).text('保存新密码');
            },
            error: function() {
                showToast('网络错误，请重试');
                $('#btnPwd').prop('disabled', false).text('保存新密码');
            }
        });
    });
});

function showToast(msg) {
    var $toast = $('#toast');
    $toast.text(msg).fadeIn(200);
    setTimeout(function() { $toast.fadeOut(300); }, 2000);
}
</script>
</body>
</html>
