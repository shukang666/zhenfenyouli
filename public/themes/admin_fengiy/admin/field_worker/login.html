<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外勤工作台 - 登录</title>
    <link rel="stylesheet" href="__STATIC__/css/bootstrap.min.css">
    <link rel="stylesheet" href="__STATIC__/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #2fb74c 0%, #1a8a32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px 30px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2fb74c, #1a8a32);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: #fff;
        }
        .login-header h1 {
            font-size: 22px;
            color: #333;
            font-weight: 600;
        }
        .login-header p {
            font-size: 14px;
            color: #999;
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-control:focus {
            border-color: #2fb74c;
        }
        .btn-login {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #2fb74c, #1a8a32);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #aaa;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-danger {
            background: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fde2e2;
        }
        .alert-success {
            background: #f0f9eb;
            color: #67c23a;
            border: 1px solid #e1f3d8;
        }
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 16px;
        }
        .input-icon-wrapper .form-control {
            padding-left: 44px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo"><i class="fa fa-map-marker"></i></div>
            <h1>外勤工作台</h1>
            <p>点位巡查 · 移动录入</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm" method="post">
            <div class="form-group">
                <label>账号</label>
                <div class="input-icon-wrapper">
                    <i class="fa fa-user"></i>
                    <input type="text" class="form-control" name="username" id="username" placeholder="请输入用户名/手机号" autocomplete="off">
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <div class="input-icon-wrapper">
                    <i class="fa fa-lock"></i>
                    <input type="password" class="form-control" name="password" id="password" placeholder="请输入密码">
                </div>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">登 录</button>
        </form>

        <div class="login-footer">
            使用后台管理账号登录
        </div>
    </div>

    <script src="__STATIC__/js/jquery.min.js"></script>
    <script>
    $(function() {
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            var username = $.trim($('#username').val());
            var password = $('#password').val();

            if (!username) { showAlert('请输入账号', 'danger'); return; }
            if (!password) { showAlert('请输入密码', 'danger'); return; }

            $('#btnLogin').prop('disabled', true).text('登录中...');

            $.ajax({
                type: 'POST',
                url: '{:url("admin/FieldWorker/doLogin")}',
                data: { username: username, password: password },
                dataType: 'json',
                success: function(res) {
                    if (res.code == 1) {
                        showAlert('登录成功，正在跳转...', 'success');
                        setTimeout(function() {
                            window.location.href = res.data || '{:url("admin/FieldWorker/index")}';
                        }, 500);
                    } else {
                        showAlert(res.msg || '登录失败', 'danger');
                        $('#btnLogin').prop('disabled', false).text('登 录');
                    }
                },
                error: function() {
                    showAlert('网络错误，请重试', 'danger');
                    $('#btnLogin').prop('disabled', false).text('登 录');
                }
            });
        });

        function showAlert(msg, type) {
            $('#alertBox').removeClass('alert-danger alert-success')
                .addClass('alert-' + type).text(msg).show();
        }
    });
    </script>
</body>
</html>
