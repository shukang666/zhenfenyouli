<include file="public@header"/>
</head>
<body>
<style>
    .table {
        table-layout: fixed;
    }
    .desc-cell {
        word-wrap: break-word;
        white-space: normal;
        color: #666;
        font-size: 12px;
    }
    .param-cell {
        word-wrap: break-word;
        white-space: normal;
        font-size: 12px;
    }
    .result-cell {
        word-wrap: break-word;
        white-space: normal;
        font-size: 12px;
    }
    code {
        color: #c7254e;
        background: #f9f2f4;
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 12px;
    }
</style>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('index')}">定时任务列表</a></li>
    </ul>

    <table class="table table-hover table-bordered margin-top-20">
        <thead>
        <tr>
            <th style="width:30px;">ID</th>
            <th style="width:170px;">任务</th>
            <th>描述 / 原理</th>
            <th style="width:130px;">执行周期</th>
            <th style="width:230px;">参数(JSON各键值)</th>
            <th style="width:190px;">状态 / 进度</th>
            <th style="width:230px;">上次执行</th>
            <th style="width:170px;">操作</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>
                    <b>{$vo.title}</b><br/>
                    <code>{$vo.task_key}</code>
                </td>
                <td class="desc-cell" title="{$vo.description}">{$vo.description}</td>
                <td>{$vo.cycle_text}</td>
                <td class="param-cell" title="{$vo.param_text}">{$vo.param_text}</td>
                <td>
                    <if condition="$vo.status==1">
                        <span class="label label-success">启用</span>
                        <else/>
                        <span class="label label-default">停用</span>
                    </if>
                    <div class="margin-top-10" title="运行进度(state JSON)">
                        <small>进度：{$vo.state_text}</small>
                    </div>
                    <div><small>下次：{$vo.next_run_text}</small></div>
                </td>
                <td class="result-cell">
                    <small>{$vo.last_run_text}</small><br/>
                    <span title="{$vo.last_run_result}">{$vo.last_run_result}</span>
                </td>
                <td>
                    <a href="{:url('edit',['id'=>$vo.id])}" class="btn btn-primary btn-xs">编辑</a>
                    <a href="javascript:;" data-id="{$vo.id}" data-status="{$vo.status}" class="btn btn-xs js-toggle <if condition='$vo.status==1'>btn-warning<else/>btn-success</if>">
                        <if condition="$vo.status==1">停用<else/>启用</if>
                    </a>
                    <a href="javascript:;" data-id="{$vo.id}" class="btn btn-info btn-xs js-run-now">立即执行</a>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    layui.use(['layer'], function () {
        var layer = layui.layer;

        // 启用 / 停用
        $('.js-toggle').click(function () {
            var id = $(this).data('id');
            var status = $(this).data('status') == 1 ? 0 : 1;
            var tip = status == 1 ? '启用该定时任务？启用后将在下一个调度周期自动执行。' : '停用该定时任务？';
            layer.confirm(tip, {title: '提示'}, function (index) {
                layer.close(index);
                $.ajax({
                    url: "{:url('toggle_status')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id, status: status},
                    success: function (res) {
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1});
                            setTimeout(function () {
                                window.location.reload();
                            }, 800);
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
            });
        });

        // 立即执行
        $('.js-run-now').click(function () {
            var id = $(this).data('id');
            layer.confirm('立即执行该任务一次？此操作不会改变自动调度计划，但可能耗时较长（需联网下载比对图片）。', {
                title: '立即执行',
                btn: ['开始执行', '取消']
            }, function (index) {
                layer.close(index);
                var loading = layer.msg('正在执行中，请稍候…', {icon: 16, shade: 0.3, time: 0});
                $.ajax({
                    url: "{:url('run_now')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {id: id},
                    timeout: 120000,
                    success: function (res) {
                        layer.close(loading);
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1, time: 3000});
                        } else {
                            layer.msg(res.msg, {icon: 2, time: 3000});
                        }
                        setTimeout(function () {
                            window.location.reload();
                        }, 1500);
                    },
                    error: function () {
                        layer.close(loading);
                        layer.msg('请求出错，任务可能在服务端仍在执行，请稍后刷新查看', {icon: 2});
                    }
                });
            });
        });
    });
</script>
</body>
</html>
