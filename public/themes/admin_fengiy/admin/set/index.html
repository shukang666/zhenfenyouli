<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a>基本设置</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('set/index')}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>客服手机号</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="service_phone" value="{$info.service_phone|default=''}" placeholder="请输入" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>客服微信号</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="service_wx_num" value="{$info.service_wx_num|default=''}" placeholder="请输入" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>新人红包</label>
            <div class="col-md-6 col-sm-10">
                <input type="number" class="form-control" name="new_people" value="{$info.new_people|default=''}" placeholder="请输入" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>推荐奖励</label>
            <div class="col-md-6 col-sm-10">
                <input type="number" class="form-control" name="recommend" value="{$info.recommend|default=''}" placeholder="请输入" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>入职奖励</label>
            <div class="col-md-6 col-sm-10">
                <input type="number" class="form-control" name="induction" value="{$info.induction|default=''}" placeholder="请输入" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>温馨提示</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="warm_prompt" name="warm_prompt">{$info.warm_prompt|default=''}</script>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>用户协议</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="user_agreement" name="user_agreement">{$info.user_agreement|default=''}</script>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>商务政策</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="business_policy" name="business_policy">{$info.business_policy|default=''}</script>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>关于我们</label>
            <div class="col-md-6 col-sm-10">
                <script type="text/plain" id="about_us" name="about_us">{$info.about_us|default=''}</script>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script type="text/javascript">
    //编辑器路径定义
    var editorURL = GV.WEB_ROOT;
</script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('user_agreement');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('business_policy');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('about_us');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
    $(function () {
        editorcontent = new baidu.editor.ui.Editor();
        editorcontent.render('warm_prompt');
        try {
            editorcontent.sync();
        } catch (err) {
        }
    });
</script>
</body>
</html>
