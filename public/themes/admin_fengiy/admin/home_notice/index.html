<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <h4 class="page-header">首页走马灯通知配置（小程序首页头图下方滚动通知）</h4>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('HomeNotice/index')}">
        <fieldset>
            <div class="tabbable">
                <div class="tab-content">
                    <div class="tab-pane active">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">通知内容</label>
                            <div class="col-md-8 col-sm-10">
                                <textarea class="form-control" name="notice" rows="3" maxlength="200"
                                          placeholder="请输入走马灯通知文字，留空则小程序首页不显示通知栏">{$notice}</textarea>
                                <span class="help-block" style="margin-top:5px;">
                                    建议简短一句话，最多200字；保存后小程序首页刷新即可生效，留空则不显示通知栏
                                </span>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary js-ajax-submit">保存配置</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
