<include file="public@header"/>
</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('admin/QxlQuiz/index')}">七贤岭考试</a></li>
        <if condition="!empty($data.id)">
            <li class="active"><a href="javascript:;">编辑题目</a></li>
        <else/>
            <li class="active"><a href="javascript:;">添加题目</a></li>
        </if>
    </ul>
    <if condition="!empty($data.id)">
        <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('admin/QxlQuiz/edit', ['id'=>$data.id])}">
    <else/>
        <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('admin/QxlQuiz/add')}">
    </if>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>题目内容</label>
            <div class="col-md-8 col-sm-10">
                <textarea class="form-control" name="title" rows="3" required placeholder="请输入题目内容">{$data.title|default=''}</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>选项 A</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="option_a" value="{$data.option_a|default=''}" required placeholder="选项A">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>选项 B</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="option_b" value="{$data.option_b|default=''}" required placeholder="选项B">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">选项 C</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="option_c" value="{$data.option_c|default=''}" placeholder="选项C（可为空）">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">选项 D</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="option_d" value="{$data.option_d|default=''}" placeholder="选项D（可为空）">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>正确答案</label>
            <div class="col-md-3 col-sm-10">
                <select class="form-control" name="correct_option" required>
                    <option value="">请选择</option>
                    <option value="A" <if condition="$data.correct_option eq 'A'">selected="selected"</if>>A</option>
                    <option value="B" <if condition="$data.correct_option eq 'B'">selected="selected"</if>>B</option>
                    <option value="C" <if condition="$data.correct_option eq 'C'">selected="selected"</if>>C</option>
                    <option value="D" <if condition="$data.correct_option eq 'D'">selected="selected"</if>>D</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-md-3 col-sm-10">
                <input type="number" class="form-control" name="list_order" value="{$data.list_order|default='0'}" placeholder="数字越小越靠前">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a href="{:url('admin/QxlQuiz/index')}" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
