    <script type="text/javascript">
        /**
         * 移动端适配：仅为窄屏做两件事
         * 1. 给所有数据表格套横向滚动容器，并按列数设置最小宽度，避免表格被压成一列一个字
         * 2. 页面被独立打开（不在后台 iframe 壳内）时补一个返回按钮
         * PC 端直接 return，不做任何 DOM 改动
         */
        (function () {
            if (window.innerWidth > 767) {
                return;
            }

            $(function () {
                // 只处理「宽表格」（列数 >= 5）：仪表盘卡片内的窄表格（2~4 列）让它自然收缩，
                // 否则强行加最小宽度会把卡片撑破
                $('table.table').each(function () {
                    var $table = $(this);

                    if ($table.hasClass('dash-table') || $table.hasClass('no-mobile-scroll')) {
                        return;
                    }
                    if ($table.parent().hasClass('cmf-table-scroll') || $table.parent().hasClass('table-responsive')) {
                        return;
                    }

                    var cols = $table.children('thead').find('tr').first().find('th').length;
                    if (!cols) {
                        cols = $table.find('tr').first().children().length;
                    }
                    if (cols < 5) {
                        return;
                    }

                    // 每列按 88px 估算，保证单元格文字不折行
                    $table.css('min-width', cols * 88 + 'px');
                    $table.wrap('<div class="cmf-table-scroll"></div>');
                });

                // 独立打开（非 iframe 壳内）时补返回按钮：移动端没有后台导航栏
                if (window.self === window.top) {
                    $('<a href="javascript:history.back();" class="cmf-m-back">返回</a>').appendTo('body');
                }
            });
        })();
    </script>
