

<foreach name="fields" item="v">

    <div class="form-group">
        <label class="col-sm-2 control-label"><span class="form-required">*</span>{$v.COLUMN_COMMENT}:</label>
        <div class="col-md-6 col-sm-10">
            <input type="{$v.type}" class="form-control" name="{$v.COLUMN_NAME}" value="{$v.value}">
        </div>
    </div>

</foreach>
