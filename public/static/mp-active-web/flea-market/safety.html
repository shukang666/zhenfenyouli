<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>安全注意事项 · 绿色二手集市</title>
  <style>
    body{font-family:-apple-system,sans-serif;padding:20px;line-height:1.75;color:#1b4332;background:#fff8f0}
    h1{font-size:20px;color:#bc6c25}
    ul{padding-left:20px}
    li{font-size:15px;margin-bottom:8px}
  </style>
</head>
<body>
  <h1>安全注意事项</h1>
  <ul>
    <li>注意人身与财物安全，贵重物品请自行看管，建议结伴前往。</li>
    <li>现场注意防滑、防绊，儿童需在监护人陪同下活动。</li>
    <li>禁止携带、交易易燃易爆、有毒有害及法律法规禁止物品。</li>
    <li>电器、工具类二手商品请确认安全可用，交易前充分验货。</li>
    <li>遇纠纷请冷静协商，必要时联系现场工作人员或报警处理。</li>
    <li>遵守消防安全规定，摊位区域内禁止明火。</li>
    <li>关注天气变化，极端天气以平台现场通知为准。</li>
  </ul>
</body>
</html>
