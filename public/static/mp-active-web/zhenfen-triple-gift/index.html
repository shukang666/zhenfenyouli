<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>三次真分专享礼</title>
  <script src="../sdk.js"></script>
  <style>
    :root { --green: #2d6a4f; --green-light: #40916c; --bg: linear-gradient(165deg, #d8f3dc 0%, #f1faee 45%, #fff 100%); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: #1b4332;
      padding: 20px 16px 36px;
    }
    .card {
      background: rgba(255,255,255,.94);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 10px 36px rgba(27,67,50,.08);
      max-width: 480px;
      margin: 0 auto 14px;
    }
    .pill { display: inline-block; font-size: 12px; background: var(--green); color: #fff; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    h1 { font-size: 21px; line-height: 1.35; margin-bottom: 10px; }
    .desc { font-size: 15px; line-height: 1.65; color: var(--green-light); margin-bottom: 12px; }
    .progress-box {
      background: #f1faee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .progress-box strong { color: var(--green); font-size: 18px; }
    .warn { color: #c1121f; font-size: 14px; line-height: 1.55; }
    .goods {
      display: flex;
      gap: 12px;
      border: 2px solid #b7e4c7;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #fff;
    }
    .goods.selected { border-color: var(--green); background: #f1faee; }
    .goods img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #eee; }
    .goods-info { flex: 1; min-width: 0; }
    .goods-info h3 { font-size: 14px; line-height: 1.45; font-weight: 600; margin-bottom: 6px; }
    .goods-info .tag { font-size: 12px; color: var(--green); }
    .addr {
      width: 100%;
      border: 1px solid #b7e4c7;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      background: #fff;
      color: #1b4332;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      background: var(--green);
      color: #fff;
      margin-top: 6px;
    }
    .btn:disabled { opacity: .45; }
    .btn.secondary { background: #74c69d; margin-top: 10px; }
    .hidden { display: none !important; }
    .err { color: #c1121f; font-size: 14px; margin-top: 8px; }
    .done { text-align: center; padding: 8px 0; }
    .done img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card" id="panel-loading">
    <span class="pill">Web 式活动</span>
    <h1>加载中…</h1>
    <p class="desc">正在获取活动与用户进度</p>
  </div>

  <div class="card hidden" id="panel-main">
    <span class="pill">真分新手礼</span>
    <h1 id="title">三次真分专享兑换</h1>
    <p class="desc">
      自 <strong>2026 年 10 月 15 日</strong>起，此前从未进行过真分打卡的用户，累计完成 <strong>3 次</strong>真分（不要求连续），即可在以下两件健康好物中<strong>免费任选其一</strong>，0 积分兑换，订单可在小程序「兑换记录」查看。
    </p>
    <div class="progress-box" id="progress"></div>
    <p class="warn hidden" id="ineligible"></p>

    <div id="pick-block" class="hidden">
      <p class="desc" style="margin-bottom:8px;">请选择一件赠品：</p>
      <div id="goods-list"></div>
      <select class="addr" id="address-select"><option value="">加载收货地址…</option></select>
      <p class="desc" style="font-size:13px;">没有地址？请先在小程序「我的 → 收货地址」中添加。</p>
      <button type="button" class="btn" id="btn-claim" disabled>确认 0 积分兑换</button>
    </div>

    <div id="done-block" class="done hidden">
      <p class="desc">您已领取本次活动赠品</p>
      <img id="done-thumb" alt="" />
      <p id="done-name" style="font-size:15px;font-weight:600;margin-bottom:8px;"></p>
      <p class="desc">订单号：<span id="done-order"></span></p>
      <p class="desc">请前往小程序「我的 → 兑换记录」查看物流进度。</p>
    </div>
    <p class="err hidden" id="err"></p>
  </div>

  <script>
    (function () {
      var ctx = null;
      var activeId = '';
      var apiBase = '';
      var openid = '';
      var state = { goodsId: 0, status: null };

      function $(id) { return document.getElementById(id); }
      function show(id) { $(id).classList.remove('hidden'); }
      function hide(id) { $(id).classList.add('hidden'); }

      function apiPost(path, body) {
        return ActiveWebSdk.apiPost(apiBase, openid, path, body || {}).then(function (res) {
          if (!res || res.code !== 1) throw new Error((res && res.msg) || '请求失败');
          return res.data;
        });
      }

      function apiGet(path) {
        var url = apiBase.replace(/\/$/, '') + path;
        return fetch(url, { headers: { openid: openid || '' } }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res || res.code !== 1) throw new Error((res && res.msg) || '请求失败');
          return res.data;
        });
      }

      function renderProgress(st) {
        var e = st.eligibility || {};
        var html = '真分进度（10月15日起）：<strong>' + (e.since_start_clock_count || 0) + ' / ' + (e.required || 3) + '</strong> 次';
        if (e.prior_clock_count > 0) {
          html += '<br/><span class="warn">活动开始前已有 ' + e.prior_clock_count + ' 次真分记录</span>';
        } else if (!st.has_claimed && !e.eligible) {
          html += '<br/>' + (e.reason || '');
        } else if (e.eligible && !st.has_claimed) {
          html += '<br/>' + (e.reason || '');
        }
        $('progress').innerHTML = html;
        if (!e.eligible && !st.has_claimed) {
          $('ineligible').textContent = e.reason || '暂不符合条件';
          show('ineligible');
        } else {
          hide('ineligible');
        }
      }

      function renderGoods(goods) {
        var wrap = $('goods-list');
        wrap.innerHTML = '';
        (goods || []).forEach(function (g) {
          var div = document.createElement('div');
          div.className = 'goods';
          div.dataset.id = g.id;
          div.innerHTML =
            '<img src="' + (g.thumb || '') + '" alt=""/>' +
            '<div class="goods-info"><h3>' + g.goods_name + '</h3>' +
            '<span class="tag">商城原价 ' + g.point + ' 积分 · 本活动 0 积分</span></div>';
          div.onclick = function () {
            wrap.querySelectorAll('.goods').forEach(function (el) { el.classList.remove('selected'); });
            div.classList.add('selected');
            state.goodsId = parseInt(g.id, 10);
            $('btn-claim').disabled = !state.goodsId || !$('address-select').value;
          };
          wrap.appendChild(div);
        });
      }

      function loadAddresses() {
        return apiGet('/wxapp/user/get_address_info').then(function (list) {
          var sel = $('address-select');
          sel.innerHTML = '';
          if (!list || !list.length) {
            sel.innerHTML = '<option value="">请先添加收货地址</option>';
            return;
          }
          list.forEach(function (a) {
            var opt = document.createElement('option');
            opt.value = a.id;
            opt.textContent = (a.username || '') + ' ' + (a.phone || '') + ' ' +
              (a.province || '') + (a.city || '') + (a.county || '') + (a.address || '');
            sel.appendChild(opt);
          });
          sel.onchange = function () {
            $('btn-claim').disabled = !state.goodsId || !sel.value;
          };
          if (list.length === 1) sel.value = list[0].id;
        });
      }

      function refreshStatus() {
        return apiPost('/wxapp/active_web_zhenfen_gift/status', { active_id: activeId }).then(function (st) {
          state.status = st;
          $('title').textContent = st.active_name || '三次真分专享兑换';
          renderProgress(st);
          if (st.has_claimed && st.claim) {
            hide('pick-block');
            show('done-block');
            var g = (st.claim.goods || {});
            $('done-thumb').src = g.thumb || '';
            $('done-name').textContent = g.goods_name || '';
            $('done-order').textContent = st.claim.order_num || '';
            return;
          }
          if (st.eligibility && st.eligibility.eligible) {
            show('pick-block');
            renderGoods(st.goods);
            return loadAddresses();
          }
          hide('pick-block');
        });
      }

      $('btn-claim').onclick = function () {
        if (!state.goodsId) return;
        var addressId = parseInt($('address-select').value, 10);
        if (!addressId) { alert('请选择收货地址'); return; }
        $('btn-claim').disabled = true;
        apiPost('/wxapp/active_web_zhenfen_gift/claim', {
          active_id: activeId,
          goods_id: state.goodsId,
          address_id: addressId
        }).then(function () {
          alert('兑换成功！');
          return refreshStatus();
        }).catch(function (e) {
          alert(e.message || e);
          $('btn-claim').disabled = false;
        });
      };

      ActiveWebSdk.bootstrap().then(function (data) {
        ctx = data;
        apiBase = (data.api && data.api.base) || '';
        openid = (data.session && data.session.openid) || '';
        activeId = (data.active && data.active.id) || (new URLSearchParams(location.search).get('active_id') || '');
        hide('panel-loading');
        show('panel-main');
        return refreshStatus();
      }).catch(function (e) {
        $('panel-loading').innerHTML = '<p class="warn">' + (e.message || e) + '</p>';
      });
    })();
  </script>
</body>
</html>
