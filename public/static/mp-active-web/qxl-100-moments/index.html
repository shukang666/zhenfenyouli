<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>七贤岭100个瞬间</title>
  <script src="../sdk.js?v=2026101217"></script>
  <style>
    :root { --g:#2d6a4f; --gl:#40916c; --bg:#f1faee; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1b4332;padding-bottom:72px}
    .hidden{display:none!important}
    header{padding:16px;background:linear-gradient(135deg,#2d6a4f,#40916c);color:#fff}
    header h1{font-size:20px}
    header p{font-size:13px;opacity:.9;margin-top:6px}
    .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #d8f3dc;z-index:20}
    .tabs button{flex:1;border:none;background:none;padding:12px 4px;font-size:13px;color:#40916c}
    .tabs button.on{color:var(--g);font-weight:600}
    .banner{margin:12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
    .banner img{width:100%;height:140px;object-fit:cover;display:block;background:#d8f3dc}
    .banner .bbody{padding:12px}
    .banner h3{font-size:16px;margin-bottom:4px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
    .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05)}
    .card img{width:100%;height:120px;object-fit:cover;background:#eee}
    .card .cbody{padding:8px;font-size:12px}
    .tag{display:inline-block;font-size:10px;background:#d8f3dc;padding:2px 6px;border-radius:4px;margin-bottom:4px}
    .fab{position:fixed;right:16px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;border:none;font-size:28px;line-height:1;box-shadow:0 4px 16px rgba(45,106,79,.4);z-index:15}
    .panel{padding:12px}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--g);color:#fff;font-size:15px;margin-top:10px}
    .btn.sec{background:#95d5b2;color:#1b4332}
    textarea,input,select{width:100%;padding:10px;border:1px solid #b7e4c7;border-radius:10px;font-size:14px}
    .field{margin-top:14px}
    .field-label{display:block;font-size:13px;font-weight:600;color:var(--g);margin-bottom:8px}
    .field-hint{font-size:12px;color:#74c69d;margin-top:6px;line-height:1.45}
    .file-input-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .photo-picker{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;padding:16px;border:2px dashed #95d5b2;border-radius:14px;background:#fff;cursor:pointer;transition:border-color .2s,background .2s;-webkit-tap-highlight-color:transparent}
    .photo-picker:active{background:#e8f5e9;border-color:var(--gl)}
    .photo-picker.has-preview{padding:0;border-style:solid;border-color:#b7e4c7;cursor:default;min-height:0;overflow:hidden}
    .photo-picker.has-preview .picker-empty{display:none}
    .picker-empty{text-align:center;padding:8px 12px}
    .picker-icon{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,#d8f3dc,#b7e4c7);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
    .picker-title{font-size:15px;font-weight:600;color:var(--g)}
    .picker-sub{font-size:12px;color:#74c69d;margin-top:6px;line-height:1.5}
    .picker-preview{width:100%;display:block;max-height:320px;object-fit:contain;background:#f1faee;vertical-align:middle}
    .picker-actions{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #d8f3dc}
    .picker-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #b7e4c7;background:#fff;color:var(--g);font-size:14px}
    .picker-actions button.primary{background:var(--g);color:#fff;border-color:var(--g)}
    .btn:disabled{opacity:.55;pointer-events:none}
    .btn.loading{position:relative;color:transparent}
    .btn.loading::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .detail-img{width:100%;border-radius:12px;margin:12px 0;background:#eee;min-height:120px}
    .like-row{display:flex;align-items:center;gap:12px;margin:12px 0}
    .like-btn{padding:10px 20px;border-radius:999px;border:2px solid var(--g);background:#fff;color:var(--g);font-size:15px}
    .like-btn.done{background:var(--g);color:#fff}
    .err{color:#c1121f;font-size:13px;margin-top:8px}
    .limits{font-size:12px;color:#74c69d;margin-top:8px}
    .empty{padding:24px;text-align:center;color:#74c69d;font-size:14px}
    .about-card{background:#fff;border-radius:14px;padding:16px;margin:12px;box-shadow:0 4px 20px rgba(0,0,0,.06);font-size:14px;line-height:1.65;color:#1b4332}
    .about-card h2{font-size:17px;margin-bottom:10px;color:var(--g)}
    .about-card ul{padding-left:18px;margin:8px 0}
    .about-card li{margin:6px 0}
    .reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .reward-item{background:#f1faee;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}
    .reward-item b{display:block;font-size:15px;color:var(--g);margin-bottom:4px}
    .meta-line{font-size:13px;color:#40916c;margin-top:10px}
    .cta-row{padding:0 12px 12px}
  </style>
</head>
<body>
  <header>
    <h1 id="hdr-title">七贤岭100个瞬间</h1>
    <p id="hdr-sub">发现 · 上传 · 分享 · 记录身边的七贤岭</p>
  </header>

  <div id="view-about" class="hidden">
    <div class="about-card">
      <h2>活动说明</h2>
      <div id="about-body"></div>
      <div class="reward-grid" id="about-rewards"></div>
      <p class="meta-line" id="about-meta"></p>
    </div>
    <div class="cta-row">
      <button type="button" class="btn" id="btn-go-discover">去看大家作品</button>
    </div>
  </div>

  <div id="view-home" class="hidden">
    <div id="report-banner" class="banner hidden" onclick="app.openReportFromBanner()">
      <img id="report-cover" alt="" />
      <div class="bbody">
        <h3 id="report-title"></h3>
        <p style="font-size:13px;color:#40916c">点击查看本周影像周报 · 可分享好友或朋友圈</p>
      </div>
    </div>
    <div class="limits panel" id="home-limits"></div>
    <div class="grid" id="photo-grid"></div>
    <p class="empty hidden" id="home-empty">暂无作品，快来上传第一张七贤岭照片吧</p>
    <p class="panel err hidden" id="home-err"></p>
  </div>

  <div id="view-upload" class="hidden panel">
    <p style="font-size:14px;line-height:1.6;margin-bottom:4px">上传你在七贤岭的人文、景观、美食等照片，并附简短介绍。审核通过后可公开展示、分享获赞。</p>
    <div class="field">
      <label class="field-label" for="up-category">作品分类</label>
      <select id="up-category">
        <option value="humanity">人文（大集、民俗等）</option>
        <option value="scenery">美景（栈道、观海等）</option>
        <option value="food">美食</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="field">
      <span class="field-label">选择照片</span>
      <input type="file" id="up-file" class="file-input-hidden" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/*" />
      <div class="photo-picker" id="photo-picker" role="button" tabindex="0" aria-label="选择照片">
        <div class="picker-empty">
          <div class="picker-icon" aria-hidden="true">📷</div>
          <p class="picker-title">点击添加照片</p>
          <p class="picker-sub">支持 JPG、PNG 等常见格式<br/>单张建议不超过 10MB，须为本人原创实拍</p>
        </div>
        <img class="picker-preview hidden" id="up-preview" alt="已选照片预览" />
        <div class="picker-actions hidden" id="picker-actions">
          <button type="button" id="btn-change-photo">重新选择</button>
          <button type="button" class="primary" id="btn-clear-photo">移除</button>
        </div>
      </div>
      <p class="field-hint hidden" id="up-file-meta"></p>
    </div>
    <div class="field">
      <label class="field-label" for="up-intro">作品介绍</label>
      <textarea id="up-intro" rows="4" maxlength="500" placeholder="简单介绍拍摄地点与故事（500字内）"></textarea>
      <p class="field-hint"><span id="up-intro-count">0</span>/500 字</p>
    </div>
    <button class="btn" type="button" id="btn-upload">发布作品</button>
    <p class="err hidden" id="up-err"></p>
  </div>

  <div id="view-mine" class="hidden panel">
    <div id="mine-list"></div>
  </div>

  <div id="view-detail" class="hidden panel">
    <img class="detail-img" id="dt-img" alt="" />
    <p class="tag" id="dt-cat"></p>
    <p id="dt-intro" style="line-height:1.6;font-size:15px"></p>
    <p style="font-size:13px;color:#74c69d;margin-top:8px" id="dt-author"></p>
    <div class="like-row">
      <button type="button" class="like-btn" id="btn-like">👍 点赞 <span id="dt-likes">0</span></button>
    </div>
    <button class="btn sec" id="btn-copy-share">复制分享链接</button>
    <button class="btn sec" id="btn-back-home">返回首页</button>
  </div>

  <div id="view-report" class="hidden panel">
    <h2 id="rp-title" style="margin-bottom:12px"></h2>
    <div id="rp-html" style="line-height:1.7;font-size:14px"></div>
    <div class="grid" id="rp-photos" style="margin-top:16px;padding:0"></div>
    <button class="btn sec" id="btn-copy-report">复制周报分享链接</button>
    <button class="btn sec" id="btn-back-home2">返回首页</button>
  </div>

  <button type="button" class="fab hidden" id="fab-upload" title="上传">+</button>
  <nav class="tabs">
    <button type="button" data-tab="about" class="on">说明</button>
    <button type="button" data-tab="home">发现</button>
    <button type="button" data-tab="upload">上传</button>
    <button type="button" data-tab="mine">我的</button>
  </nav>

  <script>
    var app = {
      activeId: 0, openid: '', apiBase: '', bannerReportId: 0, guest: false,
      currentPhoto: null, currentReport: null, uploadPreviewUrl: '', uploadFile: null,
      maxUploadBytes: 10 * 1024 * 1024,
      needLoginTip: function() {
        alert('请通过微信小程序打开「七贤岭100个瞬间」后再上传或点赞');
      },
      api: function(path, body) {
        return ActiveWebSdk.apiPost(app.apiBase, app.openid, path, body || {}).then(function(res) {
          if (!res || res.code !== 1) throw new Error((res && res.msg) || '失败');
          return res.data;
        });
      },
      resolveApiBase: function() {
        if (ActiveWebSdk.defaultApiBase) return ActiveWebSdk.defaultApiBase();
        var o = location.origin;
        return o ? o + '/api' : 'https://admin.circular-economy.cn/api';
      },
      startSession: function() {
        var params = ActiveWebSdk.getQuery();
        var webCtx = (params.get('web_ctx') || '').trim();
        app.apiBase = app.resolveApiBase();
        if (!webCtx) {
          var data = ActiveWebSdk.guestSession
            ? ActiveWebSdk.guestSession(params.get('active_id'), app.apiBase)
            : { guest: true, session: { openid: '' }, active: { id: params.get('active_id') }, api: { base: app.apiBase } };
          return Promise.resolve(data);
        }
        return ActiveWebSdk.bootstrap({ allowGuest: true, apiBase: app.apiBase });
      },
      init: function() {
        app.startSession().then(function(data) {
          app.guest = !!data.guest;
          app.apiBase = (data.api && data.api.base) || app.apiBase;
          app.openid = (data.session && data.session.openid) || '';
          app.activeId = parseInt(data.active.id, 10) || parseInt(ActiveWebSdk.getQuery().get('active_id'), 10);
          var q = ActiveWebSdk.getQuery();
          var pid = parseInt(q.get('photo_id'), 10);
          var sh = q.get('share') || '';
          if (!app.activeId && pid && sh) {
            return app.api('/wxapp/active_web_photo/detail', {
              active_id: 0, photo_id: pid, share: sh
            }).then(function(p) {
              app.activeId = parseInt(p.active_id, 10);
              if (!app.activeId) throw new Error('无法识别分享的活动');
              return app.api('/wxapp/active_web_photo/home', { active_id: app.activeId });
            });
          }
          if (!app.activeId) throw new Error('链接缺少活动 ID，请重新复制分享链接');
          return app.api('/wxapp/active_web_photo/home', { active_id: app.activeId });
        }).then(function(h) {
          document.getElementById('hdr-title').textContent = h.active_name || '七贤岭100个瞬间';
          app.renderAbout(h);
          if (app.guest) {
            document.getElementById('home-limits').textContent =
              '访客模式：可浏览与查看分享的作品 · 上传/点赞请从小程序进入活动';
            document.getElementById('fab-upload').classList.add('hidden');
          } else {
            app.renderLimits(h.limits);
            document.getElementById('fab-upload').classList.remove('hidden');
          }
          if (h.latest_report) app.showReportBanner(h.latest_report);
          app.loadPhotos();
          app.routeFromHash();
        }).catch(function(e) {
          var el = document.getElementById('home-err');
          el.textContent = e.message || String(e);
          el.classList.remove('hidden');
        });

        document.querySelectorAll('.tabs button').forEach(function(b) {
          b.onclick = function() { app.switchTab(b.getAttribute('data-tab')); };
        });
        document.getElementById('fab-upload').onclick = function() { app.switchTab('upload'); };
        document.getElementById('btn-upload').onclick = app.doUpload;
        app.bindUploadPicker();
        document.getElementById('btn-like').onclick = app.doLike;
        document.getElementById('btn-copy-share').onclick = app.copyPhotoShare;
        document.getElementById('btn-copy-report').onclick = app.copyReportShare;
        document.getElementById('btn-back-home').onclick = document.getElementById('btn-back-home2').onclick = function() {
          location.hash = '';
          app.switchTab('home');
        };
        document.getElementById('btn-go-discover').onclick = function() { app.switchTab('home'); };
        window.addEventListener('hashchange', app.routeFromHash);
      },
      renderAbout: function(h) {
        var body = document.getElementById('about-body');
        if (h.intro_html) body.innerHTML = h.intro_html;
        else body.innerHTML = '<p>用镜头记录七贤岭的人文与风景，上传原创照片参与征集。</p>';
        var rw = document.getElementById('about-rewards');
        var r = h.rewards || {};
        rw.innerHTML =
          '<div class="reward-item"><b>' + (r.approve_point || 5) + ' 分</b>单张审核通过</div>' +
          '<div class="reward-item"><b>' + (r.max_upload_per_day || 3) + ' 张/日</b>上传上限</div>' +
          '<div class="reward-item"><b>' + (r.bonus_like_threshold || 20) + ' 赞</b>额外 +' + (r.bonus_like_points || 5) + ' 分</div>' +
          '<div class="reward-item"><b>' + (r.badge_approved_count || 5) + ' 张</b>通过可获荣誉勋章</div>';
        var meta = [];
        if (h.end_time_text) meta.push('征集至 ' + h.end_time_text);
        if (h.address) meta.push('范围：' + h.address);
        if (h.contact_phone) meta.push('咨询：' + h.contact_phone);
        document.getElementById('about-meta').textContent = meta.join(' · ');
      },
      bindUploadPicker: function() {
        var input = document.getElementById('up-file');
        var picker = document.getElementById('photo-picker');
        var intro = document.getElementById('up-intro');
        function openFile() {
          if (app.guest) { app.needLoginTip(); return; }
          input.click();
        }
        picker.addEventListener('click', function(e) {
          if (picker.classList.contains('has-preview') && e.target.closest('.picker-actions')) return;
          if (!picker.classList.contains('has-preview')) openFile();
        });
        picker.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!picker.classList.contains('has-preview')) openFile();
          }
        });
        document.getElementById('btn-change-photo').onclick = function(e) {
          e.stopPropagation();
          openFile();
        };
        document.getElementById('btn-clear-photo').onclick = function(e) {
          e.stopPropagation();
          app.clearUploadFile();
        };
        input.onchange = function() {
          var file = input.files && input.files[0];
          if (file) app.setUploadFile(file);
        };
        intro.oninput = function() {
          document.getElementById('up-intro-count').textContent = String(intro.value.length);
        };
      },
      formatFileSize: function(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      },
      clearUploadFile: function() {
        if (app.uploadPreviewUrl) {
          try { URL.revokeObjectURL(app.uploadPreviewUrl); } catch (e) {}
          app.uploadPreviewUrl = '';
        }
        app.uploadFile = null;
        document.getElementById('up-file').value = '';
        document.getElementById('up-preview').src = '';
        document.getElementById('up-preview').classList.add('hidden');
        document.getElementById('picker-actions').classList.add('hidden');
        document.getElementById('photo-picker').classList.remove('has-preview');
        document.getElementById('up-file-meta').classList.add('hidden');
        document.getElementById('up-file-meta').textContent = '';
      },
      setUploadFile: function(file) {
        var err = document.getElementById('up-err');
        err.classList.add('hidden');
        if (!file.type || file.type.indexOf('image/') !== 0) {
          err.textContent = '请选择图片文件（JPG、PNG 等）';
          err.classList.remove('hidden');
          app.clearUploadFile();
          return;
        }
        if (file.size > app.maxUploadBytes) {
          err.textContent = '图片过大（最大 10MB），请压缩后重试';
          err.classList.remove('hidden');
          app.clearUploadFile();
          return;
        }
        app.clearUploadFile();
        app.uploadFile = file;
        app.uploadPreviewUrl = URL.createObjectURL(file);
        var preview = document.getElementById('up-preview');
        preview.src = app.uploadPreviewUrl;
        preview.classList.remove('hidden');
        document.getElementById('picker-actions').classList.remove('hidden');
        document.getElementById('photo-picker').classList.add('has-preview');
        var meta = document.getElementById('up-file-meta');
        meta.textContent = (file.name || '已选图片') + ' · ' + app.formatFileSize(file.size);
        meta.classList.remove('hidden');
      },
      setUploadLoading: function(on) {
        var btn = document.getElementById('btn-upload');
        btn.disabled = on;
        btn.classList.toggle('loading', on);
        btn.textContent = on ? '发布中…' : '发布作品';
      },
      renderLimits: function(l) {
        if (!l) return;
        document.getElementById('home-limits').textContent =
          '今日还可上传 ' + l.upload_left_today + ' 张 · 今日积分剩余额度 ' + l.points_left_today;
      },
      showReportBanner: function(r) {
        document.getElementById('report-banner').classList.remove('hidden');
        document.getElementById('report-title').textContent = r.title;
        if (r.cover_image) document.getElementById('report-cover').src = r.cover_image;
        app.bannerReportId = r.id;
      },
      openReportFromBanner: function() {
        if (app.bannerReportId) location.hash = 'report/' + app.bannerReportId;
      },
      switchTab: function(tab) {
        if (app.guest && (tab === 'upload' || tab === 'mine')) {
          app.needLoginTip();
          return;
        }
        ['view-about','view-home','view-upload','view-mine','view-detail','view-report'].forEach(function(id) {
          document.getElementById(id).classList.add('hidden');
        });
        document.querySelectorAll('.tabs button').forEach(function(b) {
          b.classList.toggle('on', b.getAttribute('data-tab') === tab);
        });
        if (tab === 'about') document.getElementById('view-about').classList.remove('hidden');
        if (tab === 'home') document.getElementById('view-home').classList.remove('hidden');
        if (tab === 'upload') document.getElementById('view-upload').classList.remove('hidden');
        if (tab === 'mine') { document.getElementById('view-mine').classList.remove('hidden'); app.loadMine(); }
      },
      loadPhotos: function() {
        app.api('/wxapp/active_web_photo/list_photos', { active_id: app.activeId, page_size: 20 }).then(function(d) {
          var g = document.getElementById('photo-grid');
          var list = d.list || [];
          g.innerHTML = '';
          document.getElementById('home-empty').classList.toggle('hidden', list.length > 0);
          list.forEach(function(p) {
            var el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = '<img src="' + p.image + '" alt=""/><div class="cbody"><span class="tag">' + p.category_label + '</span><div>' +
              (p.intro.length > 36 ? p.intro.slice(0, 36) + '…' : p.intro) + '</div><div style="margin-top:4px;color:#74c69d">👍 ' + p.like_count + '</div></div>';
            el.onclick = function() { location.hash = 'photo/' + p.id; };
            g.appendChild(el);
          });
        }).catch(function(e) {
          document.getElementById('home-err').textContent = e.message || e;
          document.getElementById('home-err').classList.remove('hidden');
        });
      },
      loadMine: function() {
        app.api('/wxapp/active_web_photo/my_list', { active_id: app.activeId }).then(function(d) {
          var box = document.getElementById('mine-list');
          box.innerHTML = '';
          (d.list || []).forEach(function(p) {
            var div = document.createElement('div');
            div.className = 'card';
            div.style.marginBottom = '10px';
            div.innerHTML = '<img src="' + p.image + '" style="width:100%;height:100px;object-fit:cover"/><div class="cbody">' +
              p.status_text + ' · 👍' + p.like_count + '<br/>' + p.intro + '</div>';
            div.onclick = function() { if (p.status == 1) location.hash = 'photo/' + p.id; };
            box.appendChild(div);
          });
        });
      },
      routeFromHash: function() {
        var h = (location.hash || '').replace(/^#/, '');
        if (!h) {
          app.switchTab('about');
          return;
        }
        var m = h.match(/^photo\/(\d+)/);
        if (m) { app.openPhoto(parseInt(m[1], 10)); return; }
        m = h.match(/^report\/(\d+)/);
        if (m) { app.openReport(parseInt(m[1], 10)); }
      },
      openPhoto: function(id) {
        var share = ActiveWebSdk.getQuery().get('share') || '';
        app.api('/wxapp/active_web_photo/detail', { active_id: app.activeId, photo_id: id, share: share }).then(function(p) {
          app.currentPhoto = p;
          ['view-about','view-home','view-upload','view-mine','view-report'].forEach(function(v) {
            document.getElementById(v).classList.add('hidden');
          });
          document.getElementById('view-detail').classList.remove('hidden');
          document.getElementById('dt-img').src = p.image;
          document.getElementById('dt-cat').textContent = p.category_label;
          document.getElementById('dt-intro').textContent = p.intro;
          document.getElementById('dt-author').textContent = (p.author_nickname || '') + ' · 👍 ' + p.like_count;
          document.getElementById('dt-likes').textContent = p.like_count;
          var lb = document.getElementById('btn-like');
          lb.classList.toggle('done', p.liked == 1);
          lb.disabled = p.liked == 1;
        });
      },
      openReport: function(id) {
        var share = ActiveWebSdk.getQuery().get('share') || '';
        app.api('/wxapp/active_web_photo/report_detail', { active_id: app.activeId, report_id: id, share: share }).then(function(r) {
          app.currentReport = r;
          ['view-about','view-home','view-upload','view-mine','view-detail'].forEach(function(v) {
            document.getElementById(v).classList.add('hidden');
          });
          document.getElementById('view-report').classList.remove('hidden');
          document.getElementById('rp-title').textContent = r.title;
          document.getElementById('rp-html').innerHTML = r.summary_html;
          var g = document.getElementById('rp-photos');
          g.innerHTML = '';
          (r.photos || []).forEach(function(p) {
            var c = document.createElement('div');
            c.className = 'card';
            c.innerHTML = '<img src="' + p.image + '"/><div class="cbody">' + p.intro.slice(0, 30) + '</div>';
            c.onclick = function() { location.hash = 'photo/' + p.id; };
            g.appendChild(c);
          });
        });
      },
      doUpload: function() {
        if (app.guest) { app.needLoginTip(); return; }
        var file = app.uploadFile || (document.getElementById('up-file').files && document.getElementById('up-file').files[0]);
        var intro = document.getElementById('up-intro').value.trim();
        var cat = document.getElementById('up-category').value;
        var err = document.getElementById('up-err');
        err.classList.add('hidden');
        if (!file) { err.textContent = '请先添加一张照片'; err.classList.remove('hidden'); return; }
        if (!intro) { err.textContent = '请填写作品介绍'; err.classList.remove('hidden'); return; }
        if (app.uploadLoading) return;
        app.uploadLoading = true;
        app.setUploadLoading(true);
        var fd = new FormData();
        fd.append('file', file);
        fetch(app.apiBase + '/wxapp/public/upload_asset?filetype=image', {
          method: 'POST', headers: { openid: app.openid }, body: fd
        }).then(function(r) { return r.json(); }).then(function(up) {
          if (!up || up.code !== 1) throw new Error((up && up.msg) || '上传失败');
          var path = (up.data && (up.data.filepath || up.data.url)) || '';
          return app.api('/wxapp/active_web_photo/submit', {
            active_id: app.activeId, image: path, intro: intro, category: cat
          });
        }).then(function(res) {
          alert(res.message || '发布成功');
          document.getElementById('up-intro').value = '';
          document.getElementById('up-intro-count').textContent = '0';
          app.clearUploadFile();
          app.api('/wxapp/active_web_photo/home', { active_id: app.activeId }).then(function(h) {
            app.renderLimits(h.limits);
          });
          app.switchTab('mine');
        }).catch(function(e) {
          err.textContent = e.message || e;
          err.classList.remove('hidden');
        }).finally(function() {
          app.uploadLoading = false;
          app.setUploadLoading(false);
        });
      },
      doLike: function() {
        if (app.guest) { app.needLoginTip(); return; }
        if (!app.currentPhoto) return;
        app.api('/wxapp/active_web_photo/like', {
          active_id: app.activeId, photo_id: app.currentPhoto.id
        }).then(function(d) {
          document.getElementById('dt-likes').textContent = d.like_count;
          document.getElementById('btn-like').classList.add('done');
          document.getElementById('btn-like').disabled = true;
        }).catch(function(e) { alert(e.message || e); });
      },
      copyPhotoShare: function() {
        var url = app.currentPhoto && app.currentPhoto.share && app.currentPhoto.share.h5_url;
        if (url) app.copyText(url, '链接已复制，可发给好友；朋友圈可用右上角菜单分享');
      },
      copyReportShare: function() {
        var url = app.currentReport && app.currentReport.share && app.currentReport.share.h5_url;
        if (url) app.copyText(url, '周报链接已复制');
      },
      copyText: function(t, msg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(function() { alert(msg); });
        } else {
          prompt('复制链接', t);
        }
      }
    };
    app.init();
  </script>
</body>
</html>
