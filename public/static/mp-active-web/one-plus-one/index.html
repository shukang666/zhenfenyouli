<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>1+1 活动</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <script src="../sdk.js?v=20261021c"></script>
  <style>
    :root {
      --green: #0d4f36;
      --green-mid: #1a8f5c;
      --green-soft: #5fd4a0;
      --green-glow: rgba(95, 212, 160, .45);
      --gold: #f0b429;
      --gold-soft: #ffe8a3;
      --text: #0f2e22;
      --muted: #3d6b58;
      --bg: #e4f5ec;
      --card: rgba(255, 255, 255, .88);
      --radius: 20px;
      --shadow: 0 12px 40px rgba(13, 79, 54, .12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      padding-bottom: 48px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(95, 212, 160, .35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 20%, rgba(240, 180, 41, .15), transparent 50%),
        linear-gradient(180deg, #dff5ea 0%, #f4fbf7 45%, #e8f6ed 100%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z' fill='%230d4f36'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .hidden { display: none !important; }
    .hero {
      position: relative;
      padding: 28px 20px 36px;
      color: #fff;
      border-radius: 0 0 28px 28px;
      overflow: hidden;
      background: linear-gradient(135deg, #063d2a 0%, #0f6b4a 40%, #2ab87a 100%);
      box-shadow: 0 16px 48px rgba(6, 61, 42, .35);
    }
    .hero::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -20%;
      width: 70%;
      height: 120%;
      background: radial-gradient(circle, rgba(255,255,255,.18) 0%, transparent 65%);
      animation: hero-float 8s ease-in-out infinite;
    }
    .hero::after {
      content: "7";
      position: absolute;
      right: 12px;
      bottom: -8px;
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      opacity: .08;
      letter-spacing: -4px;
    }
    @keyframes hero-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-8px, 6px) scale(1.05); }
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
    }
    .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.02em; }
    .hero p { font-size: 13px; line-height: 1.65; opacity: .92; max-width: 28em; }
    .shell { max-width: 480px; margin: -20px auto 0; padding: 0 14px; position: relative; z-index: 1; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      max-width: 100%;
    }
    .guide-line {
      font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 10px;
      padding-left: 12px; border-left: 2px solid rgba(26, 143, 92, .25);
    }
    .guide-line:last-child { margin-bottom: 0; }
    .sec-title {
      font-size: 16px; font-weight: 800; margin-bottom: 12px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .sec-title::before {
      content: "";
      width: 4px; height: 16px; border-radius: 4px;
      background: linear-gradient(180deg, var(--green-mid), var(--green-soft));
    }
    .stat-row { display: flex; gap: 10px; margin-bottom: 4px; }
    .stat {
      flex: 1; text-align: center; border-radius: 16px; padding: 12px 6px;
      background: linear-gradient(160deg, #f0faf5, #fff);
      border: 1px solid rgba(26, 143, 92, .12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .stat strong {
      display: block; font-size: 22px; font-weight: 800;
      background: linear-gradient(135deg, var(--green), var(--green-mid));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .stat span { font-size: 11px; color: var(--muted); margin-top: 2px; display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }
    .cell {
      aspect-ratio: 1; min-width: 0; max-width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(26, 143, 92, .15);
      background: linear-gradient(165deg, #fff 0%, #f4fbf7 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 6px 4px; cursor: pointer;
      transition: transform .2s cubic-bezier(.34,1.4,.64,1), box-shadow .2s, border-color .2s;
      box-shadow: 0 4px 14px rgba(13, 79, 54, .06);
      overflow: hidden;
    }
    .cell:nth-child(7):last-child {
      grid-column: 2;
    }
    .cell:active { transform: scale(.94); }
    .cell .num {
      font-size: 20px; font-weight: 800; color: var(--green-mid);
      width: 36px; height: 36px; line-height: 36px; border-radius: 50%;
      background: rgba(26, 143, 92, .08);
    }
    .cell .lbl {
      font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.25; font-weight: 500;
      width: 100%; padding: 0 2px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      word-break: break-all;
    }
    .cell.partial {
      border-color: var(--gold);
      background: linear-gradient(165deg, #fffbeb, #fff);
      box-shadow: 0 0 0 3px rgba(240, 180, 41, .15);
    }
    .cell.done {
      border-color: var(--green-mid);
      background: linear-gradient(145deg, #d8f3e4, #fff);
      box-shadow: 0 6px 20px var(--green-glow);
    }
    .cell.done .num { background: var(--green-mid); color: #fff; }
    .cell.done .num::after { content: '✓'; font-size: 12px; margin-left: 2px; }
    .cell.locked { opacity: .42; border-color: #ddd; background: #f0f0f0; cursor: not-allowed; box-shadow: none; }
    .cell.locked .lbl::after { content: ' 🔒'; font-size: 10px; }
    .cell.preview { border-style: dashed; border-color: var(--green-soft); opacity: .9; }
    .act-hint {
      font-size: 13px; line-height: 1.55; color: #7a5a08;
      background: linear-gradient(90deg, #fff8e6, #fff);
      border: 1px solid rgba(233, 163, 25, .35);
      padding: 12px 14px; border-radius: 14px; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(233, 163, 25, .1);
    }
    .read-only .btn-primary,
    .read-only .btn-ghost { opacity: .45; pointer-events: none; }
    .read-only .upload-zone,
    .read-only .harmful-input { pointer-events: none; opacity: .55; }
    .btn {
      display: block; width: 100%; border: none; border-radius: 14px;
      padding: 14px 16px; font-size: 15px; font-weight: 700; margin-top: 12px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      color: #fff;
      background: linear-gradient(105deg, #0f6b4a 0%, #1a8f5c 45%, #5fd4a0 100%);
      box-shadow: 0 8px 24px rgba(26, 143, 92, .35);
    }
    .btn-primary::after {
      content: "";
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      animation: btn-shine 3s ease-in-out infinite;
    }
    @keyframes btn-shine {
      0% { left: -100%; }
      40%, 100% { left: 150%; }
    }
    .btn-ghost {
      background: rgba(255,255,255,.7); color: var(--green-mid);
      border: 2px solid rgba(26, 143, 92, .25);
      box-shadow: none;
    }
    .btn-ghost::after { display: none; }
    .btn:disabled { opacity: .5; box-shadow: none; }
    .detail-hero { font-size: 21px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.02em; }
    .detail-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.55; }
    .part {
      border-radius: 18px; padding: 16px; margin-bottom: 12px;
      border: 1px solid rgba(26, 143, 92, .12);
      position: relative; overflow: hidden;
    }
    .part::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      border-radius: 4px 0 0 4px;
    }
    .part.zhenfen {
      background: linear-gradient(135deg, rgba(240, 251, 245, .95), rgba(255,255,255,.9));
    }
    .part.zhenfen::before { background: linear-gradient(180deg, var(--green-mid), var(--green-soft)); }
    .part.task {
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(248, 252, 250, .9));
    }
    .part.task::before { background: linear-gradient(180deg, var(--gold), var(--gold-soft)); }
    .part h3 { font-size: 16px; margin-bottom: 8px; font-weight: 800; }
    .part p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
    }
    .badge.ok { background: linear-gradient(90deg, #c8efd8, #e8f8ef); color: #0d5c3f; }
    .badge.wait { background: linear-gradient(90deg, #fff3cd, #fff8e6); color: #856404; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: var(--green-mid);
      margin-bottom: 14px; cursor: pointer;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(26, 143, 92, .15);
      backdrop-filter: blur(8px);
    }
    .loading {
      text-align: center; padding: 64px 16px; color: var(--muted);
      font-size: 14px; font-weight: 500;
    }
    .loading::before {
      content: "";
      display: block; width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid rgba(26, 143, 92, .15);
      border-top-color: var(--green-mid);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .harmful-box { margin-top: 14px; padding-top: 4px; }
    .harmful-kicker {
      font-size: 12px; font-weight: 700; color: var(--green-mid);
      letter-spacing: .06em; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .harmful-kicker::before {
      content: "☣";
      display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center;
      font-size: 12px; border-radius: 8px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
      color: #fff;
    }
    .upload-zone {
      position: relative; border-radius: 18px; overflow: hidden;
      border: 2px dashed rgba(26, 143, 92, .35);
      background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(240, 251, 245, .8));
      transition: border-color .25s, box-shadow .25s, transform .2s;
    }
    .upload-zone.has-file {
      border-color: var(--green-mid);
      border-style: solid;
      box-shadow: 0 0 0 4px rgba(95, 212, 160, .2);
    }
    .upload-zone:active { transform: scale(.99); }
    .upload-input {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 2;
    }
    .upload-zone-inner {
      padding: 28px 16px; text-align: center; pointer-events: none;
    }
    .upload-icon {
      width: 56px; height: 56px; margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--green-mid), var(--green-soft));
      box-shadow: 0 8px 24px var(--green-glow);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      animation: upload-pulse 2.5s ease-in-out infinite;
    }
    @keyframes upload-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 24px var(--green-glow); }
      50% { transform: scale(1.05); box-shadow: 0 12px 32px rgba(95, 212, 160, .5); }
    }
    .upload-zone.has-file .upload-icon { animation: none; background: linear-gradient(145deg, #0f6b4a, #1a8f5c); }
    .upload-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .upload-hint { font-size: 12px; color: var(--muted); }
    .preview-frame {
      margin-top: 14px; padding: 6px; border-radius: 16px;
      background: linear-gradient(135deg, var(--green-mid), var(--gold));
      box-shadow: 0 10px 28px rgba(13, 79, 54, .15);
    }
    .preview-frame-inner {
      border-radius: 12px; overflow: hidden; background: #000;
    }
    .harmful-preview {
      width: 100%; max-height: 220px; object-fit: cover; display: block;
    }
    .harmful-input {
      width: 100%; padding: 12px 14px; margin-top: 12px;
      border: 2px solid rgba(26, 143, 92, .15); border-radius: 14px;
      font-size: 14px; background: rgba(255,255,255,.85);
      transition: border-color .2s, box-shadow .2s;
    }
    .harmful-input:focus {
      outline: none; border-color: var(--green-mid);
      box-shadow: 0 0 0 4px rgba(95, 212, 160, .2);
    }
    .record-list { margin-top: 16px; }
    .record-item {
      display: flex; gap: 12px; align-items: center; padding: 12px;
      margin-bottom: 8px; border-radius: 14px;
      background: rgba(255,255,255,.6); border: 1px solid rgba(26, 143, 92, .08);
    }
    .record-item:last-child { margin-bottom: 0; }
    .record-item img {
      width: 56px; height: 56px; object-fit: cover; border-radius: 12px;
      flex-shrink: 0; box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    .record-meta { flex: 1; min-width: 0; }
    .record-meta .t { font-size: 11px; color: var(--muted); font-weight: 500; }
    .record-meta .r { font-size: 13px; color: var(--text); margin-top: 4px; word-break: break-all; }
    .quiz-box { margin-top: 14px; }
    .quiz-kicker {
      font-size: 12px; font-weight: 700; color: var(--green-mid);
      margin-bottom: 12px; letter-spacing: .04em;
    }
    .quiz-q {
      margin-bottom: 20px; padding: 14px; border-radius: 16px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(26, 143, 92, .1);
      box-shadow: 0 4px 16px rgba(13, 79, 54, .04);
    }
    .quiz-q-title { font-size: 14px; font-weight: 700; line-height: 1.55; margin-bottom: 12px; color: var(--text); }
    .quiz-q-num {
      display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 12px; margin-right: 6px;
      background: linear-gradient(135deg, var(--green-mid), var(--green-soft)); color: #fff;
    }
    .quiz-opt {
      display: block; width: 100%; text-align: left;
      border: 2px solid rgba(26, 143, 92, .12);
      background: linear-gradient(90deg, #fafdfb, #fff);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
      font-size: 14px; color: var(--text); line-height: 1.45; cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    }
    .quiz-opt:active { transform: scale(.99); }
    .quiz-opt.selected {
      border-color: var(--green-mid);
      background: linear-gradient(90deg, #e8f8ef, #fff);
      box-shadow: 0 0 0 3px rgba(95, 212, 160, .25);
    }
    .quiz-opt.correct { border-color: var(--green-mid); background: #d8f3dc; }
    .quiz-opt.wrong { border-color: #e07a7a; background: #fff5f5; }
    .quiz-explain {
      margin-top: 10px; padding: 12px; border-radius: 12px;
      background: linear-gradient(90deg, #f4fbf7, #fff);
      border-left: 4px solid var(--green-soft);
      font-size: 13px; line-height: 1.6; color: var(--muted);
    }
    .quiz-done-tip {
      font-size: 13px; font-weight: 600; color: #0d5c3f;
      background: linear-gradient(90deg, #d8f3dc, #e8f8ef);
      padding: 12px 14px; border-radius: 14px; margin-bottom: 12px;
      border: 1px solid rgba(26, 143, 92, .2);
    }
    #quiz-panel.quiz-locked .quiz-opt,
    #quiz-panel.quiz-locked #btn-quiz-submit { pointer-events: none; opacity: .55; }
    .read-only #quiz-panel:not(.quiz-locked) .quiz-opt,
    .read-only #quiz-panel:not(.quiz-locked) #btn-quiz-submit { pointer-events: auto; opacity: 1; }
  </style>
</head>
<body>
  <div id="panel-loading" class="loading">加载中…</div>

  <div id="panel-home" class="hidden">
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-badge">Eco Challenge</div>
        <h1 id="hero-title">1+1 七日挑战</h1>
        <p id="hero-sub">点击日历格子进入当天挑战</p>
      </div>
    </div>
    <div class="shell">
      <div class="card">
        <div class="sec-title">挑战日历（7 天）</div>
        <div class="grid" id="day-grid"></div>
        <div id="day-grid-error" class="guide-line hidden" style="color:#b42318;margin-top:12px;"></div>
      </div>
      <div class="card">
        <div class="sec-title">我的进度</div>
        <div class="stat-row">
          <div class="stat"><strong id="stat-done">0</strong><span>已完成天</span></div>
          <div class="stat"><strong id="stat-reward3">300</strong><span>前3天积分</span></div>
          <div class="stat"><strong id="stat-reward7">800</strong><span>7天积分</span></div>
        </div>
      </div>
      <div class="card" id="guide-card"></div>
    </div>
  </div>

  <div id="panel-day" class="hidden">
    <div class="shell" style="margin-top:16px;">
      <div class="back-link" id="btn-back">← 返回日历</div>
      <div class="card">
        <div class="detail-hero" id="day-title"></div>
        <div class="detail-sub" id="day-brief"></div>
        <div id="act-hint-box" class="act-hint hidden"></div>
        <div class="part zhenfen" id="part-zhenfen">
          <h3>真分打卡 <span class="badge wait" id="badge-z">待完成</span></h3>
          <p>进入三场景选择器，任选家庭 / 办公 / 沿街等场景完成一次垃圾分类拍照打卡。</p>
          <button type="button" class="btn btn-primary" id="btn-zhenfen">去真分打卡</button>
        </div>
        <div class="part task" id="part-task">
          <h3>当日任务 <span class="badge wait" id="badge-t">待完成</span></h3>
          <p id="task-detail"></p>
          <button type="button" class="btn btn-primary" id="btn-task">去做任务</button>
          <button type="button" class="btn btn-ghost hidden" id="btn-share-ack">我已分享，刷新进度</button>
          <div id="harmful-panel" class="harmful-box hidden">
            <div class="harmful-kicker">有害垃圾 · 拍照打卡</div>
            <label class="upload-zone" id="harmful-upload-zone">
              <input type="file" class="upload-input" accept="image/*" capture="environment" id="harmful-file" />
              <div class="upload-zone-inner">
                <div class="upload-icon">📷</div>
                <div class="upload-title">轻触拍照或选择相册</div>
                <div class="upload-hint" id="harmful-file-hint">请拍摄有害垃圾实物照片</div>
              </div>
            </label>
            <div id="harmful-preview-wrap" class="preview-frame hidden">
              <div class="preview-frame-inner">
                <img id="harmful-preview" class="harmful-preview" alt="预览" />
              </div>
            </div>
            <input type="text" class="harmful-input" id="harmful-remark" maxlength="200" placeholder="选填：拍摄地点或物品说明（200字内）" />
            <button type="button" class="btn btn-primary" id="btn-harmful-submit">提交有害垃圾打卡</button>
            <div class="sec-title" style="margin-top:18px;font-size:14px;">我的打卡记录</div>
            <div class="record-list" id="harmful-records"></div>
          </div>
          <div id="quiz-panel" class="quiz-box hidden">
            <div class="quiz-kicker">分类知识 · 单选题</div>
            <div id="quiz-done-tip" class="quiz-done-tip hidden">本题库已全部答对，当日任务已完成。</div>
            <div id="quiz-questions"></div>
            <button type="button" class="btn btn-primary" id="btn-quiz-submit">提交答案</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var apiBase = '';
      var openid = '';
      var activeId = '';
      var state = null;
      var currentDay = 0;
      var zhenfenPath = '/pages/activity/scene-clock-flow?mode=theme';
      var quizQuestions = [];
      var quizPicks = {};
      var quizClickBound = false;

      function $(id) { return document.getElementById(id); }

      function apiPost(path, body) {
        return ActiveWebSdk.apiPost(apiBase, openid, path, body).then(function (res) {
          if (!res || res.code !== 1) throw new Error((res && res.msg) || '请求失败');
          return res.data;
        });
      }

      function navigateMp(path) {
        if (!path) return;
        ActiveWebSdk.navigateMp(path).catch(function (e) {
          alert((e && e.message) ? e.message : '跳转失败，请稍后重试');
        });
      }

      function preLearnMpPath(d) {
        if (d && d.mp_path) return d.mp_path;
        return '/pages/flhd/pre_learn?from=one_plus_one&active_id=' + encodeURIComponent(activeId || '');
      }

      function show(id) { $(id).classList.remove('hidden'); }
      function hide(id) { $(id).classList.add('hidden'); }

      function showLoadError(msg) {
        var text = msg || '活动数据加载失败，请返回后重试';
        var grid = $('day-grid');
        if (grid) {
          grid.innerHTML = '<div class="guide-line" style="grid-column:1/-1;color:#b42318;">' + escapeHtml(text) + '</div>';
        }
        hide('day-grid-error');
      }

      function renderHome(data) {
        hide('day-grid-error');
        state = data;
        zhenfenPath = data.zhenfen_entry || zhenfenPath;
        var g = data.guide || {};
        $('hero-title').textContent = g.title || '1+1 七日挑战';
        var guideHtml = (g.lines || []).map(function (line) {
          return '<div class="guide-line">' + line + '</div>';
        }).join('');
        $('guide-card').innerHTML = '<div class="sec-title">活动说明</div>' + guideHtml;
        $('stat-done').textContent = data.completed_count || 0;
        if (data.rewards) {
          $('stat-reward3').textContent = data.rewards.milestone_3;
          $('stat-reward7').textContent = data.rewards.milestone_7;
        }
        var grid = $('day-grid');
        grid.innerHTML = '';
        var days = data.days || [];
        if (!days.length) {
          showLoadError('未获取到挑战日历数据，请确认活动已发布且后端已更新');
          return;
        }
        days.forEach(function (d) {
          var el = document.createElement('div');
          var cls = 'cell';
          if (d.locked) cls += ' locked';
          else if (d.done) cls += ' done';
          else if (d.read_only) cls += ' preview';
          else if (d.zhenfen_done || d.task_done) cls += ' partial';
          el.className = cls;
          el.innerHTML = '<div class="num">' + d.day + '</div><div class="lbl">' + (d.task_title || '') + '</div>';
          el.onclick = function () {
            if (d.locked) {
              alert(d.lock_hint || ('请先完成第 ' + (d.day - 1) + ' 天'));
              return;
            }
            if (d.day === 1 && d.task_kind === 'pre_learn_mp' && Number(d.can_act) === 1 && !Number(d.task_done) && !Number(d.done)) {
              navigateMp(preLearnMpPath(d));
              return;
            }
            openDay(d.day);
          };
          grid.appendChild(el);
        });
      }

      function renderHarmfulRecords(list) {
        var box = $('harmful-records');
        if (!list || !list.length) {
          box.innerHTML = '<div class="guide-line">暂无记录，上传照片后将显示在这里。</div>';
          return;
        }
        box.innerHTML = list.map(function (r) {
          var time = r.create_time ? new Date(r.create_time * 1000).toLocaleString() : '';
          var remark = r.remark ? r.remark : '（无说明）';
          return '<div class="record-item"><img src="' + r.image + '" alt=""/><div class="record-meta"><div class="t">' + time + ' · 第' + (r.cycle_no || 1) + '轮</div><div class="r">' + remark + '</div></div></div>';
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function bindQuizOptionClicks() {
        if (quizClickBound) return;
        quizClickBound = true;
        var box = $('quiz-questions');
        box.addEventListener('click', function (e) {
          if ($('quiz-panel').classList.contains('quiz-locked')) return;
          var btn = e.target.closest('.quiz-opt');
          if (!btn || !box.contains(btn)) return;
          e.preventDefault();
          var qid = String(btn.getAttribute('data-qid'));
          var key = btn.getAttribute('data-key');
          quizPicks[qid] = key;
          var parent = btn.closest('.quiz-q');
          if (parent) {
            parent.querySelectorAll('.quiz-opt').forEach(function (b) { b.classList.remove('selected'); });
          }
          btn.classList.add('selected');
        });
      }

      function renderQuizQuestions(questions, resultDetail, taskDone) {
        var showResults = !!(resultDetail && resultDetail.length);
        if (!showResults) quizPicks = {};
        var box = $('quiz-questions');
        if (!questions || !questions.length) {
          box.innerHTML = '<div class="guide-line">题目加载中…</div>';
          return;
        }
        var resultMap = {};
        (resultDetail || []).forEach(function (r) { resultMap[r.id] = r; });
        box.innerHTML = questions.map(function (q, idx) {
          var res = resultMap[q.id];
          var optsHtml = (q.options || []).map(function (o) {
            var cls = 'quiz-opt';
            var picked = !showResults && quizPicks[String(q.id)] === o.key;
            if (picked) cls += ' selected';
            if (res) {
              if (Number(res.correct) && o.key === res.pick) cls += ' correct';
              else if (!Number(res.correct) && o.key === res.pick) cls += ' wrong';
              else if (!Number(res.correct) && o.key === res.answer) cls += ' correct';
            }
            return '<div role="button" tabindex="0" class="' + cls + '" data-qid="' + q.id + '" data-key="' + o.key + '">' +
              escapeHtml(o.key) + '. ' + escapeHtml(o.text) + '</div>';
          }).join('');
          var explain = res && !Number(res.correct) && res.explain
            ? '<div class="quiz-explain">' + escapeHtml(res.explain) + '</div>' : '';
          return '<div class="quiz-q" data-qid="' + q.id + '"><div class="quiz-q-title"><span class="quiz-q-num">' + (idx + 1) + '</span>' +
            escapeHtml(q.title) + '</div>' + optsHtml + explain + '</div>';
        }).join('');
        bindQuizOptionClicks();
      }

      function setQuizLocked(locked) {
        var panel = $('quiz-panel');
        if (locked) panel.classList.add('quiz-locked'); else panel.classList.remove('quiz-locked');
      }

      function loadQuizPanel(d) {
        hide('btn-task');
        hide('harmful-panel');
        show('quiz-panel');
        var taskDone = Number(d.task_done) === 1;
        var canAct = Number(d.can_act) === 1;
        setQuizLocked(!canAct || taskDone);
        if (taskDone) show('quiz-done-tip'); else hide('quiz-done-tip');
        $('btn-quiz-submit').disabled = taskDone || !canAct;
        $('btn-quiz-submit').textContent = taskDone ? '已完成' : '提交答案';
        var loadQ = quizQuestions.length
          ? Promise.resolve(quizQuestions)
          : apiPost('/wxapp/active_web_one_plus_one/quiz_questions', { active_id: activeId }).then(function (data) {
            quizQuestions = data.questions || [];
            return quizQuestions;
          });
        loadQ.then(function (qs) {
          renderQuizQuestions(qs, null, taskDone);
        }).catch(function (e) {
          $('quiz-questions').innerHTML = '<div class="guide-line">' + escapeHtml(e.message || '加载题目失败') + '</div>';
        });
        $('btn-quiz-submit').onclick = function () {
          if (taskDone || !canAct) return;
          var qs = quizQuestions;
          if (!qs.length) { alert('题目尚未加载'); return; }
          for (var i = 0; i < qs.length; i++) {
            if (!quizPicks[String(qs[i].id)]) {
              alert('请完成第 ' + (i + 1) + ' 题后再提交');
              return;
            }
          }
          $('btn-quiz-submit').disabled = true;
          apiPost('/wxapp/active_web_one_plus_one/quiz_submit', { active_id: activeId, answers: quizPicks }).then(function (data) {
            setQuizLocked(true);
            renderQuizQuestions(quizQuestions, data.detail || [], true);
            show('quiz-done-tip');
            $('btn-quiz-submit').textContent = '已完成';
            return refresh();
          }).catch(function (e) {
            alert(e.message || e);
            $('btn-quiz-submit').disabled = false;
          });
        };
      }

      function loadHarmfulRecords() {
        return apiPost('/wxapp/active_web_one_plus_one/harmful_list', { active_id: activeId }).then(function (data) {
          renderHarmfulRecords(data.list || []);
        }).catch(function () {
          renderHarmfulRecords([]);
        });
      }

      function uploadHarmfulImage(file) {
        var fd = new FormData();
        fd.append('file', file);
        return fetch(apiBase.replace(/\/$/, '') + '/wxapp/public/upload_asset?filetype=image', {
          method: 'POST',
          headers: { openid: openid },
          body: fd
        }).then(function (r) { return r.json(); }).then(function (up) {
          if (!up || up.code !== 1) throw new Error((up && up.msg) || '上传失败');
          return (up.data && (up.data.filepath || up.data.url)) || '';
        });
      }

      function openDay(day) {
        currentDay = day;
        var d = (state.days || []).find(function (x) { return x.day === day; });
        if (!d) return;
        if (d.locked) {
          alert(d.lock_hint || ('请先完成第 ' + (day - 1) + ' 天'));
          return;
        }
        var readOnly = !!(Number(d.read_only) && !d.done);
        hide('panel-home');
        show('panel-day');
        var card = $('panel-day').querySelector('.card');
        if (card) {
          if (readOnly) card.classList.add('read-only'); else card.classList.remove('read-only');
        }
        var hintBox = $('act-hint-box');
        if (readOnly && d.act_hint) {
          hintBox.textContent = d.act_hint;
          show('act-hint-box');
        } else if (!Number(d.can_act) && d.act_hint && !d.done) {
          hintBox.textContent = d.act_hint;
          show('act-hint-box');
        } else {
          hide('act-hint-box');
        }
        $('day-title').textContent = d.title + ' · ' + d.task_title;
        $('day-brief').textContent = d.task_brief;
        $('task-detail').textContent = d.task_detail || '';
        var isPreLearnMp = d.task_kind === 'pre_learn_mp' || Number(d.task_only) === 1;
        var taskOnlyDay = isPreLearnMp && day === 1;

        if (taskOnlyDay) {
          hide('part-zhenfen');
        } else {
          show('part-zhenfen');
          $('badge-z').textContent = d.zhenfen_done ? '已完成' : '待完成';
          $('badge-z').className = 'badge ' + (d.zhenfen_done ? 'ok' : 'wait');
          $('btn-zhenfen').onclick = function () { navigateMp(zhenfenPath); };
        }

        var taskHead = $('part-task').querySelector('h3');
        if (taskHead) {
          var badgeCls = d.task_done ? 'ok' : 'wait';
          var badgeTxt = d.task_done ? '已完成' : '待完成';
          taskHead.innerHTML = (taskOnlyDay ? '学习任务' : '当日任务') +
            ' <span class="badge ' + badgeCls + '" id="badge-t">' + badgeTxt + '</span>';
        } else {
          $('badge-t').textContent = d.task_done ? '已完成' : '待完成';
          $('badge-t').className = 'badge ' + (d.task_done ? 'ok' : 'wait');
        }

        var isQuizWeb = d.task_kind === 'quiz_web' || day === 3;
        var isHarmfulWeb = d.task_kind === 'harmful_web';
        hide('quiz-panel');
        if (isQuizWeb) {
          loadQuizPanel(d);
        } else if (isPreLearnMp) {
          hide('harmful-panel');
          hide('quiz-panel');
          show('btn-task');
          $('btn-task').textContent = Number(d.task_done) ? '再看一遍前置学习' : '进入前置学习';
          $('btn-task').onclick = function () {
            if (readOnly && !Number(d.task_done)) {
              alert(d.act_hint || '当前仅可浏览，暂不可操作');
              return;
            }
            if (!Number(d.can_act) && !Number(d.task_done)) {
              alert(d.act_hint || '当前不可进行该天任务');
              return;
            }
            navigateMp(preLearnMpPath(d));
          };
        } else if (isHarmfulWeb) {
          hide('btn-task');
          hide('quiz-panel');
          show('harmful-panel');
          $('harmful-file').value = '';
          $('harmful-remark').value = '';
          var prev = $('harmful-preview');
          var prevWrap = $('harmful-preview-wrap');
          var zone = $('harmful-upload-zone');
          var hint = $('harmful-file-hint');
          prev.src = '';
          hide('harmful-preview-wrap');
          if (zone) zone.classList.remove('has-file');
          if (hint) hint.textContent = '请拍摄有害垃圾实物照片';
          loadHarmfulRecords();
          $('harmful-file').onchange = function () {
            var f = $('harmful-file').files[0];
            if (!f) return;
            prev.src = URL.createObjectURL(f);
            show('harmful-preview-wrap');
            if (zone) zone.classList.add('has-file');
            if (hint) {
              var name = f.name || '已选照片';
              if (name.length > 24) name = name.slice(0, 22) + '…';
              hint.textContent = '已选：' + name;
            }
          };
          $('btn-harmful-submit').onclick = function () {
            var file = $('harmful-file').files[0];
            if (!file) { alert('请先选择或拍摄照片'); return; }
            $('btn-harmful-submit').disabled = true;
            uploadHarmfulImage(file).then(function (path) {
              return apiPost('/wxapp/active_web_one_plus_one/harmful_submit', {
                active_id: activeId,
                image: path,
                remark: $('harmful-remark').value.trim()
              });
            }).then(function () {
              alert('打卡成功');
              return refresh();
            }).catch(function (e) {
              alert(e.message || e);
            }).then(function () {
              $('btn-harmful-submit').disabled = false;
            });
          };
        } else {
          show('btn-task');
          hide('harmful-panel');
          hide('quiz-panel');
          $('btn-task').onclick = function () {
            if (d.needs_share_ack) {
              apiPost('/wxapp/active_web_one_plus_one/share_ack', { active_id: activeId }).then(function () {
                alert('已记录，请完成分享后返回刷新');
              }).catch(function (e) { alert(e.message || e); });
            }
            if (d.mp_path) navigateMp(d.mp_path);
          };
        }

        if (d.needs_share_ack) show('btn-share-ack'); else hide('btn-share-ack');
        $('btn-share-ack').onclick = function () {
          refresh().then(function () { alert('进度已更新'); });
        };
      }

      function refresh() {
        return apiPost('/wxapp/active_web_one_plus_one/status', { active_id: activeId }).then(function (data) {
          renderHome(data);
          if (currentDay > 0) {
            var d = (data.days || []).find(function (x) { return x.day === currentDay; });
            if (d) openDay(currentDay);
          }
          return data;
        }).catch(function (e) {
          var msg = (e && e.message) ? e.message : '活动进度加载失败';
          showLoadError(msg);
          throw e;
        });
      }

      $('btn-back').onclick = function () {
        currentDay = 0;
        hide('panel-day');
        show('panel-home');
      };

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && activeId) refresh().catch(function () {});
      });

      ActiveWebSdk.bootstrap().then(function (data) {
        apiBase = (data.api && data.api.base) || '';
        openid = (data.session && data.session.openid) || '';
        activeId = (data.active && data.active.id) || (new URLSearchParams(location.search).get('active_id') || '');
        hide('panel-loading');
        show('panel-home');
        if (ActiveWebSdk.ensureMiniProgramApi) {
          ActiveWebSdk.ensureMiniProgramApi().catch(function () {});
        }
        var hash = location.hash || '';
        var m = hash.match(/day\/(\d+)/);
        return refresh().then(function () {
          if (m) openDay(parseInt(m[1], 10));
        }).catch(function () {});
      }).catch(function (e) {
        $('panel-loading').textContent = e.message || String(e);
      });
    })();
  </script>
</body>
</html>
