<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>数康Chatgpt AI 讨论组</title>
  <style>
    :root {
      --bg: #ededed;
      --panel: #f7f7f7;
      --mine: #95ec69;
      --other: #ffffff;
      --ai: #e8f4ff;
      --accent: #07c160;
      --text: #191919;
      --muted: #888;
      --bar: #393a3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; background: var(--panel); box-shadow: 0 0 24px rgba(0,0,0,.06); }
    header {
      flex-shrink: 0;
      background: var(--bar);
      color: #fff;
      text-align: center;
      padding: 12px 16px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    header small { display: block; font-size: 11px; font-weight: 400; opacity: .75; margin-top: 4px; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { display: flex; margin-bottom: 14px; align-items: flex-start; gap: 8px; }
    .msg.mine { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; color: #fff; flex-shrink: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .msg.mine .avatar { background: linear-gradient(135deg, #07c160, #06ae56); }
    .msg.ai .avatar { background: linear-gradient(135deg, #4facfe, #00f2fe); font-size: 11px; }
    .bubble-wrap { max-width: 78%; min-width: 0; }
    .nick { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .msg.mine .nick { text-align: right; }
    .bubble {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .msg:not(.mine):not(.ai) .bubble { background: var(--other); }
    .msg.mine .bubble { background: var(--mine); }
    .msg.ai .bubble { background: var(--ai); border: 1px solid #cce5ff; }
    .time { font-size: 10px; color: #aaa; margin-top: 4px; }
    .msg.mine .time { text-align: right; }
    .composer {
      flex-shrink: 0;
      border-top: 1px solid #ddd;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: #f7f7f7;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.4;
      background: #fff;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .btn-send {
      flex-shrink: 0;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-send:disabled { opacity: .5; cursor: not-allowed; }
    .status-bar { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 0; min-height: 20px; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; z-index: 100;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #fff; border-radius: 12px; padding: 24px 20px;
      width: 100%; max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .modal h2 { font-size: 18px; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
    .modal input {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px; margin-bottom: 16px;
    }
    .modal button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .nick-edit {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: rgba(255,255,255,.85);
      font-size: 12px; cursor: pointer;
    }
    header { position: relative; }
  </style>
</head>
<body>
  <div id="nickOverlay" class="overlay">
    <div class="modal">
      <h2>进入讨论组</h2>
      <p>输入在本群展示的昵称（保存在本机浏览器，无需登录后台）。</p>
      <input id="nickInput" type="text" maxlength="20" placeholder="例如：小绿" autocomplete="nickname" />
      <button type="button" id="nickOk">开始聊天</button>
    </div>
  </div>

  <div class="app">
    <header>
      数康Chatgpt AI 讨论组
      <small>每人发言后，助手会根据最近 30 条记录回复</small>
      <button type="button" class="nick-edit" id="editNick">改昵称</button>
    </header>
    <div class="status-bar" id="statusBar"></div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…" maxlength="800"></textarea>
      <button type="button" class="btn-send" id="sendBtn">发送</button>
    </div>
  </div>

  <script>
(function () {
  var STORAGE_NICK = 'ai_talk_nickname';
  var API = 'api.php';
  var nickname = localStorage.getItem(STORAGE_NICK) || '';
  var lastId = 0;
  var polling = null;
  var sending = false;

  var elOverlay = document.getElementById('nickOverlay');
  var elNickInput = document.getElementById('nickInput');
  var elMessages = document.getElementById('messages');
  var elInput = document.getElementById('input');
  var elSend = document.getElementById('sendBtn');
  var elStatus = document.getElementById('statusBar');

  function avatarText(name, isAi) {
    if (isAi) return 'AI';
    var s = (name || '?').trim();
    return s.slice(0, 1).toUpperCase();
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    var h = d.getHours();
    var m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function appendMessage(m, scroll) {
    if (!m || !m.id) return;
    if (document.querySelector('[data-id="' + m.id + '"]')) return;

    var mine = m.role === 'user' && m.nickname === nickname;
    var isAi = m.role === 'assistant';
    var wrap = document.createElement('div');
    wrap.className = 'msg' + (mine ? ' mine' : '') + (isAi ? ' ai' : '');
    wrap.setAttribute('data-id', String(m.id));

    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = avatarText(m.nickname, isAi);

    var bw = document.createElement('div');
    bw.className = 'bubble-wrap';

    var nick = document.createElement('div');
    nick.className = 'nick';
    nick.textContent = isAi ? '讨论助手' : (m.nickname || '访客');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.content || '';

    var time = document.createElement('div');
    time.className = 'time';
    time.textContent = formatTime(m.ts);

    bw.appendChild(nick);
    bw.appendChild(bubble);
    bw.appendChild(time);
    wrap.appendChild(av);
    wrap.appendChild(bw);
    elMessages.appendChild(wrap);

    if (m.id > lastId) lastId = m.id;
    if (scroll !== false) {
      elMessages.scrollTop = elMessages.scrollHeight;
    }
  }

  function setStatus(text) {
    elStatus.textContent = text || '';
  }

  function fetchJson(url, opts) {
    return fetch(url, opts || {}).then(function (r) {
      return r.text().then(function (text) {
        try {
          return JSON.parse(text);
        } catch (e) {
          var hint = (text || '').replace(/\s+/g, ' ').slice(0, 120);
          throw new Error(hint.indexOf('<') >= 0 ? '接口返回异常（非 JSON），请确认已部署最新 ai_talk 后端' : hint || '响应解析失败');
        }
      });
    });
  }

  function loadHistory(sinceId) {
    var q = sinceId ? ('&since_id=' + sinceId) : '';
    return fetchJson(API + '?action=history' + q).then(function (res) {
      if (!res || res.code !== 1) throw new Error((res && res.msg) || '加载失败');
      var list = (res.data && res.data.messages) || [];
      list.forEach(function (m) { appendMessage(m, false); });
      elMessages.scrollTop = elMessages.scrollHeight;
    });
  }

  function startPoll() {
    if (polling) clearInterval(polling);
    polling = setInterval(function () {
      if (sending) return;
      loadHistory(lastId).catch(function () {});
    }, 2500);
  }

  function ensureNick() {
    if (nickname) {
      elOverlay.classList.add('hidden');
      return Promise.resolve();
    }
    elOverlay.classList.remove('hidden');
    elNickInput.focus();
    return new Promise(function (resolve) {
      document.getElementById('nickOk').onclick = function () {
        var v = (elNickInput.value || '').trim();
        if (!v) {
          alert('请输入昵称');
          return;
        }
        nickname = v.slice(0, 20);
        localStorage.setItem(STORAGE_NICK, nickname);
        elOverlay.classList.add('hidden');
        resolve();
      };
    });
  }

  function sendMessage() {
    if (sending) return;
    var text = (elInput.value || '').trim();
    if (!text) return;
    if (!nickname) {
      elOverlay.classList.remove('hidden');
      return;
    }
    sending = true;
    elSend.disabled = true;
    setStatus('助手思考中…');
    fetchJson(API + '?action=send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: nickname, content: text })
    }).then(function (res) {
      if (!res || res.code !== 1) throw new Error((res && res.msg) || '发送失败');
      elInput.value = '';
      var d = res.data || {};
      appendMessage(d.user, true);
      appendMessage(d.assistant, true);
      setStatus('');
    }).catch(function (e) {
      setStatus('');
      alert(e.message || '发送失败');
    }).finally(function () {
      sending = false;
      elSend.disabled = false;
    });
  }

  document.getElementById('editNick').onclick = function () {
    elNickInput.value = nickname;
    elOverlay.classList.remove('hidden');
    document.getElementById('nickOk').onclick = function () {
      var v = (elNickInput.value || '').trim();
      if (!v) return;
      nickname = v.slice(0, 20);
      localStorage.setItem(STORAGE_NICK, nickname);
      elOverlay.classList.add('hidden');
    };
  };

  elSend.onclick = sendMessage;
  elInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  ensureNick().then(function () {
    setStatus('加载记录…');
    return loadHistory(0);
  }).then(function () {
    setStatus('');
    startPoll();
  }).catch(function (e) {
    setStatus('');
    alert(e.message || '初始化失败');
  });
})();
  </script>
</body>
</html>
